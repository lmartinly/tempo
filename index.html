        ['1m', '3m', 'all'].map(r => '<button class="chip' + (weightRange === r ? ' on' : '') + '" data-act="wrange" data-r="' + r + '">' + (r === '1m' ? '4 weeks' : r === '3m' ? '3 months' : 'All') + '</button>').join('') + '</div>' +
        '<div class="chips" style="margin-bottom:8px">' +
        '<button class="chip' + (weightShowAvg ? ' on' : '') + '" data-act="w-toggle-avg">7-day average</button>' +
        '<button class="chip' + (weightShowInj ? ' on' : '') + '" data-act="w-toggle-inj">Injections</button>' +
        '<button class="chip' + (weightShowCycle ? ' on' : '') + '" data-act="w-toggle-cycle">Period windows</button></div>' +
        lineChart({ series: chartSeries, marks, bands, goal: set.goalKg ? +set.goalKg : null, yFmt: v => fmtKg(v) }) +
        '<div class="chart-legend"><span><i style="background:var(--pink)"></i>weight</span>' +
        (rollPts.length >= 2 ? '<span><i style="background:var(--trend)"></i>7-day avg</span>' : '') +
        (set.goalKg ? '<span><i style="background:var(--mint)"></i>goal ' + fmtKg(+set.goalKg) + ' kg</span>' : '') +
        (weightShowCycle && Store.state.cycles.length ? '<span><i style="background:var(--lav);opacity:.5"></i>period (recorded)</span>' : '') +
        (predictedBandShown ? '<span><i style="background:var(--bandp);opacity:.5;border:1px dashed var(--bandp)"></i>period (predicted)</span>' : '') + '</div>';
      /* range summary — what actually happened in the selected window, no guesses */
      if (rangePts.length >= 2) {
        const chg = rangePts[rangePts.length - 1].y - rangePts[0].y;
        const label = weightRange === '1m' ? 'the last 4 weeks' : weightRange === '3m' ? 'the last 3 months' : 'this whole log';
        h += '<div class="footnote">' + fmtSign(chg, 'kg') + ' over ' + label + ' (' + rangePts.length + ' weigh-in' + (rangePts.length === 1 ? '' : 's') + ').</div>';
      } else if (weightShowCycle && !Store.state.cycles.length) {
        h += '<div class="footnote">No period starts logged yet — add one from Tools → Period Log to see shading here.</div>';
      }
      h += '</div>';
      /* shape ratio (waist:hip) */
      const whr = waistHipSummary();
      if (whr) {
        h += '<div class="sec-label">Shape ratio (waist:hip)</div><div class="card">' +
          '<div class="kv"><span>Latest</span><b>' + whr.last.toFixed(2) + '</b></div>' +
          (whr.n >= 2 ? '<div class="kv" style="border:0"><span>Change since first measurement</span><b class="delta ' + (whr.delta < 0 ? 'down' : whr.delta > 0 ? 'up' : 'flat') + '">' + (whr.delta < 0 ? '−' : whr.delta > 0 ? '+' : '·') + Math.abs(whr.delta).toFixed(2) + '</b></div>' : '') +
          '<div class="footnote">A lower ratio generally reflects more change around the waist than the hips — shown for context, not as a target.</div></div>';
      }
      /* measurements */
      h += '<div class="sec-label">Measurements</div>';
      h += renderMeasurementBlock();
      /* history */
      const ws = weightsSorted(true);
      if (ws.length) {
        h += '<div class="sec-label">Weight history</div><div class="list">' + ws.slice(0, 40).map((w, i) => {
          const prev = ws[i + 1];
          const d = prev ? w.kg - prev.kg : 0;
          return '<button class="row" style="width:100%;text-align:left" data-act="edit-weight" data-id="' + w.id + '">' +
            '<div class="rmain"><div class="rtitle">' + fmtDate(w.dateTime) + '</div><div class="rsub">' + fmtTime(w.dateTime) + '</div>' + (w.note ? '<div class="rnote">' + esc(w.note) + '</div>' : '') + '</div>' +
            '<div class="rside"><div class="rval num">' + fmtKg(w.kg) + ' kg</div>' +
            (prev ? '<div class="rsub delta ' + (d < 0 ? 'down' : d > 0 ? 'up' : 'flat') + '">' + (d < 0 ? '↓' : d > 0 ? '↑' : '·') + ' ' + fmtKg(Math.abs(d)) + '</div>' : '') + '</div></button>';
        }).join('') + '</div>';
      }
      body.innerHTML = h;
    }
  });
}
function renderMeasurementBlock() {
  const ms = Store.state.measurements.slice().sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));
  let h = '<div class="card"><div class="card-head" style="margin-bottom:8px">' + iconChip('tape', 'mint') + '<h3>Body measurements</h3>' +
    '<button class="mini-add" data-act="add-measurement">' + ic('plus', 16) + '</button></div>';
  if (!ms.length) {
    h += '<div style="font-size:14px;color:var(--muted)">Neck to thighs, all in cm — often the story the scale doesn’t tell. Measure what matters to you; every field is optional.</div></div>';
    return h;
  }
  const deltas = measurementDeltas();
  const tb = totalBodyChange(deltas);
  /* body progress summary — the headline */
  if (tb) {
    h += '<div style="background:var(--mint-soft);border-radius:15px;padding:12px 14px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center">' +
      '<span style="font-size:13px;font-weight:600;color:var(--mint-deep)">Total body change</span>' +
      '<b class="num delta ' + (tb.cm < 0 ? 'down' : tb.cm > 0 ? 'up' : 'flat') + '" style="font-size:18px">' + fmtSign(tb.cm, 'cm', fmtCm) + '</b></div>';
  }
  /* grouped current values with change from start */
  MEAS_GROUPS.forEach(g => {
    const rows = g[1].map(f => deltas[f[0]] ? [f, deltas[f[0]]] : null).filter(Boolean);
    if (!rows.length) return;
    h += '<div class="mgroup">' + g[0] + '</div>';
    rows.forEach(r => {
      const d = r[1];
      h += '<div class="kv"><span>' + esc(d.label) + '</span>' +
        '<b><span class="num">' + fmtCm(d.last) + ' cm</span>' +
        (d.n >= 2 && Math.abs(d.delta) >= 0.05 ? ' <span class="delta ' + (d.delta < 0 ? 'down' : 'up') + '" style="font-size:12.5px">' + fmtSign(d.delta, '', fmtCm) + '</span>' : '') +
        '</b></div>';
    });
  });
  /* mini trend charts for fields with enough points */
  MEAS_FIELDS.forEach(f => {
    const pts = ms.filter(m => m[f[0]] != null && m[f[0]] !== '').map(m => ({ x: new Date(m.dateTime).getTime(), y: +m[f[0]] }));
    if (pts.length >= 3) {
      h += '<div class="divider"></div><div style="font-size:13px;font-weight:700;color:var(--muted);margin-bottom:2px">' + f[1] + '</div>' +
        lineChart({ series: [{ pts, color: 'var(--mint)', dots: pts.length <= 16, endDot: true }], h: 120, yFmt: v => fmtCm(v) });
    }
  });
  /* history rows */
  h += '<div class="divider"></div>' + ms.slice().reverse().slice(0, 20).map(m =>
    '<button class="row" style="width:100%;text-align:left;padding:11px 2px" data-act="edit-measurement" data-id="' + m.id + '">' +
    '<div class="rmain"><div class="rtitle" style="font-size:14px">' + fmtDate(m.dateTime) + '</div>' +
    '<div class="rsub">' + MEAS_FIELDS.filter(f => m[f[0]] != null && m[f[0]] !== '').map(f => f[1] + ' ' + fmtCm(m[f[0]])).join(' · ') + '</div></div>' +
    '<span class="chev-ico">' + ic('chevR', 15) + '</span></button>').join('');
  h += '</div>';
  return h;
}
/* ---------------- journey page ---------------- */
function openJourneyPage() {
  Pages.push({
    title: 'Your Journey',
    render(body) {
      const now = new Date();
      const wk = weeksSinceStart(now);
      const fi = firstInjection();
      const sw = startWeight(), cw = currentWeight();
      const lost = (cw && sw != null) ? sw - cw.kg : null;
      const deltas = measurementDeltas();
      const tb = totalBodyChange(deltas);
      const ins = buildInsights();
      const recs = buildRecords();
      let h = '';

      /* hero */
      h += '<div class="card journey">';
      if (fi) {
        h += '<div class="hero-num">Week ' + wk + '</div>' +
          '<div class="hero-sub">day ' + daysSinceStart(now) + ' since your first injection · ' + fmtDate(fi.dateTime) + '</div>';
      } else {
        h += '<div class="hero-num">Day one</div><div class="hero-sub">your journey starts with the first log</div>';
      }
      h += '<div class="jstats" style="margin-top:14px">' +
        '<div class="jstat"><b>' + (lost != null ? fmtSign(-lost, '').trim() : '—') + '</b><span>kg total</span></div>' +
        '<div class="jstat"><b>' + (tb ? fmtSign(tb.cm, '', fmtCm).trim() : '—') + '</b><span>cm total</span></div>' +
        '<div class="jstat"><b>' + Store.state.injections.length + '</b><span>injections</span></div>' +
        '<div class="jstat"><b>' + longestStreak(Store.state.injections) + '</b><span>best streak</span></div>' +
        '</div></div>';

      /* metabolism entry */
      const mMet = metabolism();
      h += '<button class="card press" data-act="open-metab" style="width:100%;text-align:left">' +
        '<div class="card-head" style="margin:0">' + iconChip('sun', 'coral') + '<h3>Metabolism</h3><span class="chev-ico">' + ic('chevR', 17) + '</span></div>' +
        (mMet ? '<div class="kv" style="border:0;padding:6px 0 0"><span>Daily energy use (TDEE)</span><b>' + Math.round(mMet.tdee) + ' kcal</b></div>'
          : '<div style="font-size:13.5px;color:var(--muted);margin-top:6px">Add your details to estimate BMR — it updates as you lose weight.</div>') +
        '</button>';

      /* insights */
      if (ins.length) {
        h += '<div class="sec-label">Right now</div><div class="card">' +
          ins.map(i => '<div class="insight"><span class="ii">' + ic(i.icon, 14) + '</span><span>' + esc(i.text) + '</span></div>').join('') +
          '</div>';
      }

      /* personal records */
      if (recs.length) {
        h += '<div class="sec-label">Personal records</div><div class="card">' +
          recs.map(r => '<div class="recrow"><span class="rl">' + esc(r.label) + '</span>' +
            '<span class="rv">' + esc(r.value) + '<span class="rd">' + esc(r.date) + '</span></span></div>').join('') +
          '</div>';
      }

      /* pace & goal projection */
      const proj = goalProjection();
      const tr = weightTrend(28) || weightTrend(56);
      if (tr || proj) {
        h += '<div class="sec-label">Pace &amp; goal</div><div class="card">';
        if (tr) {
          const dir = tr.perWeek < -0.02 ? 'down' : tr.perWeek > 0.02 ? 'up' : 'flat';
          h += '<div class="kv"><span>Recent pace</span><b class="delta ' + dir + '">' +
            (Math.abs(tr.perWeek) < 0.02 ? 'holding steady' : fmtSign(tr.perWeek, 'kg/wk')) + '</b></div>' +
            '<div class="footnote" style="margin:2px 0 0">from the last ' + Math.max(1, Math.round(tr.spanDays)) + ' days · ' + tr.n + ' weigh-ins</div>';
        }
        if (proj) {
          h += '<div class="divider"></div>';
          if (proj.status === 'reached') h += '<div class="insight"><span class="ii">' + ic('trophy', 14) + '</span><span>You\u2019ve reached your goal of ' + fmtKg(proj.goal) + ' kg. 🎉</span></div>';
          else if (proj.status === 'eta') h += '<div class="kv" style="border:0"><span>Goal ' + fmtKg(proj.goal) + ' kg · ' + fmtKg(Math.abs(proj.remaining)) + ' kg to go</span><b>' + (proj.weeks < 1.5 ? 'about a week' : Math.round(proj.weeks) + ' weeks') + '</b></div><div class="footnote" style="margin:0">at this pace, around ' + fmtDate(proj.date) + '</div>';
          else if (proj.status === 'flat') h += '<div class="insight"><span class="ii">' + ic('flag', 14) + '</span><span>' + fmtKg(Math.abs(proj.remaining)) + ' kg from your goal. Your weight is holding steady right now — no arrival estimate yet.</span></div>';
          else if (proj.status === 'wrongway') h += '<div class="insight"><span class="ii">' + ic('flag', 14) + '</span><span>' + fmtKg(Math.abs(proj.remaining)) + ' kg from your goal. The recent trend is moving the other way, so there\u2019s no estimate — this happens, keep going.</span></div>';
          else if (proj.status === 'slow') h += '<div class="kv" style="border:0"><span>Goal ' + fmtKg(proj.goal) + ' kg</span><b>very gradual</b></div><div class="footnote" style="margin:0">the current pace is gentle — an estimate wouldn\u2019t be meaningful yet</div>';
          else h += '<div class="footnote" style="margin:0">Log a few weigh-ins over a couple of weeks to project your goal date.</div>';
        }
        h += '</div>';
      }

      /* plateau note — a calm one, not an alarm */
      const trShort = weightTrend(21);
      if (trShort && trShort.n >= 3 && Math.abs(trShort.perWeek) < 0.12 && cw && Store.state.weights.length >= 5) {
        h += '<div class="card" style="background:var(--mint-soft)"><div class="insight" style="padding:2px"><span class="ii">' + ic('sun', 14) + '</span><span>Your weight has been level for about three weeks. Plateaus are a normal part of the process — your body adjusting, not you doing anything wrong.</span></div></div>';
      }

      /* kg <-> cm relationship */
      const ratio = kgCmRatio();
      if (ratio) {
        h += '<div class="card"><div class="insight" style="padding:2px"><span class="ii">' + ic('tape', 14) + '</span><span>For every kg you\u2019ve lost, you\u2019ve dropped about ' + fmtCm(ratio.cmPerKg) + ' cm across your measurements — the scale and the tape moving together.</span></div></div>';
      }

      /* body change highlights */
      const changed = MEAS_FIELDS.map(f => deltas[f[0]]).filter(d => d && d.n >= 2 && Math.abs(d.delta) >= 0.1)
        .sort((a, b) => a.delta - b.delta).slice(0, 5);
      if (changed.length) {
        h += '<div class="sec-label">Body changes</div><div class="card">' +
          changed.map(d => '<div class="kv"><span>' + esc(d.label) + '</span>' +
            '<b class="delta ' + (d.delta < 0 ? 'down' : 'up') + '">' + fmtSign(d.delta, 'cm', fmtCm) + '</b></div>').join('') +
          (tb ? '<div class="divider"></div><div class="kv" style="border:0"><span><b>Total body change</b></span><b class="delta ' + (tb.cm < 0 ? 'down' : tb.cm > 0 ? 'up' : 'flat') + '" style="font-size:16px">' + fmtSign(tb.cm, 'cm', fmtCm) + '</b></div>' : '') +
          '</div>';
      }

      if (!fi && !Store.state.weights.length) {
        h += '<div class="card"><div class="empty"><div class="big">🌱</div>Log your first injection or weight —<br>this page grows with you.</div></div>';
      }
      h += '<div class="footnote">These are your own milestones, computed from your logs — nothing to collect, just progress to notice.</div>';
      body.innerHTML = h;
    }
  });
}

    render(body) {
      const set = Store.state.settings;
      const m = metabolism();
      const cw = currentWeight();
      let h = '';
      const missing = [];
      if (!set.sex) missing.push('sex');
      if (!set.birthYear) missing.push('date of birth');
      if (!set.heightCm) missing.push('height');
      if (!cw) missing.push('a logged weight');

      if (!m) {
        h += '<div class="card"><div class="empty"><div class="big">🔥</div>Add ' + esc(missing.join(', ')) +
          ' to estimate your metabolism.</div>' +
          (missing.indexOf('a logged weight') < 0 ? '<button class="btn btn-primary" style="width:100%" data-act="metab-setup">Add details</button>' :
            '<button class="btn btn-primary" style="width:100%" data-act="add-weight">Log a weight</button>') +
          '</div>';
        body.innerHTML = h;
        return;
      }

      /* hero: BMR + TDEE */
      h += '<div class="card"><div class="hero"><div style="flex:none;width:84px;height:84px;border-radius:50%;background:var(--coral-soft);display:flex;align-items:center;justify-content:center;font-size:34px">🔥</div>' +

        '<div class="hero-sub">estimated daily energy use (TDEE) at ' + fmtKg(m.kg) + ' kg</div></div></div>' +
        '<div class="divider"></div>' +
        '<div class="kv"><span>Base metabolism (BMR)</span><b>' + Math.round(m.bmr) + ' kcal/day</b></div>' +
        '<div class="kv"><span>Activity factor</span><b>' + (ACTIVITY_LEVELS.find(a => a[0] === set.activity) || [,'—'])[1] + ' ×' + (set.activity || 1.375) + '</b></div>' +
        '<div class="kv"><span>At rest, per hour</span><b>' + Math.round(m.bmr / 24) + ' kcal</b></div>' +
        '</div>';

      /* how it moves with weight */
      h += '<div class="sec-label">As your weight changes</div><div class="card">';
      const sw = startWeight();
      if (sw != null && Math.abs(sw - m.kg) >= 0.5) {
        const mStart = metabolism(sw);
        if (mStart) {
          const dB = Math.round(m.bmr - mStart.bmr);
          h += '<div class="kv"><span>BMR at start (' + fmtKg(sw) + ' kg)</span><b>' + Math.round(mStart.bmr) + ' kcal</b></div>' +
            '<div class="kv"><span>BMR now (' + fmtKg(m.kg) + ' kg)</span><b>' + Math.round(m.bmr) + ' kcal</b></div>' +
            '<div class="kv" style="border:0"><span>Change</span><b class="delta ' + (dB < 0 ? 'down' : dB > 0 ? 'up' : 'flat') + '">' + (dB > 0 ? '+' : '') + dB + ' kcal/day</b></div>' +
            '<div class="footnote">As you lose weight your body needs a little less energy — normal, and part of why pace can slow. Recalculated from your latest weight every time.</div>';
        }
      } else {
        h += '<div class="footnote" style="margin:0">Each 1 kg of body weight changes your BMR by about 10 kcal/day. As your weight moves, this screen updates automatically from your newest weigh-in.</div>';
      }
      h += '</div>';

      /* projection at goal */
      if (set.goalKg) {
        const mGoal = metabolism(+set.goalKg);
        if (mGoal) {
          h += '<div class="sec-label">At your goal</div><div class="card">' +
            '<div class="kv"><span>BMR at ' + fmtKg(+set.goalKg) + ' kg</span><b>' + Math.round(mGoal.bmr) + ' kcal/day</b></div>' +
            '<div class="kv" style="border:0"><span>TDEE at goal</span><b>' + Math.round(mGoal.tdee) + ' kcal/day</b></div>' +
            '<div class="footnote">A rough guide to your energy needs once you reach your goal weight.</div></div>';
        }
      }

      /* activity picker */
      h += '<div class="sec-label">Activity level</div><div class="card">' +
        ACTIVITY_LEVELS.map(a =>
          '<button class="row" style="width:100%;text-align:left" data-act="set-activity" data-v="' + a[0] + '">' +
          '<div class="rmain"><div class="rtitle">' + a[1] + (set.activity === a[0] ? ' <span class="badge-day">current</span>' : '') + '</div>' +
          '<div class="rsub">' + a[2] + '</div></div>' +
          '<div class="rside"><div class="rval">×' + a[0] + '</div></div></button>'
        ).join('') + '</div>';

      h += '<div class="card"><button class="btn btn-tonal" style="width:100%" data-act="metab-setup">Edit sex, birth date &amp; height</button></div>';
      h += '<div class="footnote">Mifflin-St Jeor equation — the current clinical standard. An estimate to guide you, not a medical prescription.</div>';
      body.innerHTML = h;
    }
  });
}

/* ---------------- calendar ---------------- */
const calState = { y: null, m: null, selKey: null };
function dayRecords(key) {
  const out = [];
  Store.state.injections.forEach(x => { if (dateKey(x.dateTime) === key) out.push({ type: 'inj', x }); });
  Store.state.weights.forEach(x => { if (dateKey(x.dateTime) === key) out.push({ type: 'w', x }); });
  Store.state.symptoms.forEach(x => { if (dateKey(x.dateTime) === key) out.push({ type: 'sym', x }); });
  Store.state.measurements.forEach(x => { if (dateKey(x.dateTime) === key) out.push({ type: 'm', x }); });
  Store.state.checkIns.forEach(x => { if (x.dateKey === key) out.push({ type: 'ci', x: Object.assign({ dateTime: x.dateKey + 'T12:00:00' }, x) }); });
  Store.state.cycles.forEach(x => { if (cycleCoversDay(x, key)) out.push({ type: 'cyc', x }); });
  return out.sort((p, q) => new Date(p.x.dateTime) - new Date(q.x.dateTime));
}
function openCalendarPage() {
  const now = new Date();

  Pages.push({
    title: 'Calendar',
    render(body) {
      const { y, m } = calState;
      const cells = monthMatrix(y, m);
      const todayK = dateKey(new Date());

      const dots = {};
      const addDot = (k, color) => { (dots[k] = dots[k] || new Set()).add(color); };
      Store.state.injections.forEach(x => addDot(dateKey(x.dateTime), 'coral'));
      Store.state.weights.forEach(x => addDot(dateKey(x.dateTime), 'pink'));
      Store.state.symptoms.forEach(x => addDot(dateKey(x.dateTime), 'peach'));
      Store.state.measurements.forEach(x => addDot(dateKey(x.dateTime), 'mint'));
      Store.state.checkIns.forEach(x => addDot(x.dateKey, 'lav'));
      Store.state.cycles.forEach(x => {
        const n = x.endDate ? Math.min(30, Math.max(0, daysBetween(new Date(x.startDate), new Date(x.endDate)))) : 0;
        for (let i = 0; i <= n; i++) addDot(dateKey(new Date(new Date(x.startDate).getTime() + i * DAY)), 'teal');

      h += '<div class="cal-grid">' + ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => '<div class="cal-dow">' + d + '</div>').join('');

      h += '</div>';

function checkInHasData(c) {
  if (!c) return false;
  return !!(c.appetite != null || (c.gi && c.gi.length) || c.energy != null || c.sleepHours != null || c.proteinG != null || c.kcal != null || (c.note && c.note.trim()));
}
function logNothingToReportToday() {
  const dk = dateKey(new Date());
  const existing = Store.state.checkIns.find(c => c.dateKey === dk);
  if (checkInHasData(existing)) { toast('Today already has a check-in with data — edit it instead of overwriting it.'); return; }
  Actions.saveCheckIn({ id: existing ? existing.id : null, dateKey: dk, nothingToReport: true, appetite: null, gi: [], energy: null, sleepHours: null, proteinG: null, kcal: null, note: '' });

function openPeriodLogPage() {
  Pages.push({
    title: 'Period Log',
    right: '<button class="tbtn" data-act="add-cycle" style="width:36px;height:36px">' + ic('plus', 18) + '</button>',
    render(body) {
      const info = cycleInfo();
      let h = '';
      if (!info.starts.length) {
        h = '<div class="card"><div class="empty"><div class="big">🔴</div>Log your first period start date — predictions appear after your second.</div></div>';
      } else {
        h += '<div class="card">' + (info.cycleDay != null ? '<div class="kv"><span>Cycle day</span><b>' + info.cycleDay + '</b></div>' : '') +
          (info.predictedStart ? '<div class="kv" style="border:0"><span>Predicted window</span><b>' + fmtDate(new Date(info.predictedStart.getTime() - 2 * DAY)) + ' – ' + fmtDate(new Date(info.predictedStart.getTime() + 2 * DAY)) + '</b></div><div class="footnote">Centered on ' + fmtDate(info.predictedStart) + ', based on your last ' + info.intervalsUsed + ' interval' + (info.intervalsUsed === 1 ? '' : 's') + ' (avg ' + info.avgInterval + ' days). Cycles vary — this is a rough window, not a guarantee.</div>' : '<div class="footnote">Log one more start date to see a predicted window.</div>') +
          '</div>';
      }
      const now = new Date();
      const lastC = info.starts.length ? info.starts[info.starts.length - 1] : null;
      const sinceStart = lastC ? daysBetween(new Date(lastC.startDate), now) : null;
      const ongoing = !!lastC && !lastC.endDate && sinceStart >= 0 && sinceStart <= 10;
      const ls = periodLengthStats();
      if (ls) h += '<div class="card"><div class="kv" style="border:0"><span>Average period length</span><b>' + fmtNumTR(ls.avgLength) + ' days</b></div><div class="footnote">From your last ' + ls.lengthsUsed + ' period' + (ls.lengthsUsed === 1 ? '' : 's') + ' with an end date.</div></div>';
      if (ongoing) h += '<div class="card"><div class="kv" style="border:0"><span>Current period</span><b>Day ' + (sinceStart + 1) + '</b></div>' +
        '<div class="btnrow" style="margin-top:10px"><button class="btn btn-primary btn-sm" data-act="cycle-end-today" data-id="' + lastC.id + '">It ended today</button>' +
        '<button class="btn btn-tonal btn-sm" data-act="edit-cycle" data-id="' + lastC.id + '">Pick the end date</button></div></div>';
      h += '<div class="sec-label">History</div><div class="list">' + info.starts.slice().reverse().map(c => {
        const len = periodLengthDays(c);
        const isOngoing = c === lastC && ongoing;
        return '<button class="row" style="width:100%;text-align:left" data-act="edit-cycle" data-id="' + c.id + '"><div class="rmain"><div class="rtitle">' + fmtDate(c.startDate) + (c.endDate ? ' → ' + fmtDate(c.endDate) : '') + '</div>' +
          (len ? '<div class="rsub">' + len + ' day' + (len === 1 ? '' : 's') + '</div>' : isOngoing ? '<div class="rsub">ongoing · day ' + (sinceStart + 1) + '</div>' : '<div class="rsub">length not recorded</div>') +
          '</div><span class="chev-ico">' + ic('chevR', 15) + '</span></button>';
      }).join('') + '</div>';
      body.innerHTML = h;
    }
  });
}

        const totalMg = parseNum($('#vial-mg', el).value);
        if (!totalMg || totalMg <= 0) return toast('Enter the vial’s total mg content');
        const cost = parseNum($('#vial-cost', el).value);
        const d = $('#vial-date', el).value; if (!d) return toast('Set a date');
        /* backfilling an old vial whose price you already logged as an expense: with "Counts as
           spend" on, that price would be counted twice — say so instead of silently doubling */
        if (countsTowardPlan && cost != null) {
          const dup = Store.state.spends.find(sp => Math.abs((+sp.amount || 0) - cost) < 0.005);
          if (dup && !(await confirmDlg('Already logged as an expense', Store.state.settings.currency + fmtMoney(dup.amount) + ' on ' + fmtDate(dup.date) + ' is already in your expenses. Counting this vial too would double it.', 'Count it anyway', true))) return;
        }
        Actions.saveVial({ id: existing ? existing.id : null, totalMg, costAmount: cost, countsTowardPlan, addedDate: d + 'T12:00:00' });

/* -------- Journey Bingo: 4×4 board of milestones, every square derived from real logs

  u.forEach(k => {
    const t = new Date(k + 'T12:00:00').getTime();
    run = (prev != null && Math.round((t - prev) / DAY) === 1) ? run + 1 : 1;
    prev = t; if (run > best) best = run;

}

  weeks.forEach(w => { run = (prev != null && w - prev === 1) ? run + 1 : 1; prev = w; if (run > best) best = run; });
  return best;
}

}

/* -------- Goal Road: stops between start and goal, with sealed notes to future-you -------- */
function goalRoad() {
  const set = Store.state.settings, sw = startWeight(), goal = +set.goalKg;
  if (!goal || sw == null) return { reason: 'nogoal' };
  if (!(goal < sw)) return { reason: 'direction' };
  const range = sw - goal;
  const step = [1, 2, 2.5, 5, 10, 20].find(st => Math.floor(range / st) + 1 <= 10) || 20;
  const r1 = v => Math.round(v * 10) / 10;
  const kgs = [];
  for (let k = 1; sw - k * step > goal + 0.2; k++) kgs.push(r1(sw - k * step));
  kgs.push(r1(goal));
  const daily = dailyWeightSeries(), rolling = weightRollingAvg(7, 3, daily);
  const notes = set.roadNotes || {};
  const stops = kgs.map((kg, i) => {
    const c = firstCrossBelow(kg, rolling, daily);
    return { kg, key: kg.toFixed(1), isGoal: i === kgs.length - 1, reached: !!c, at: c ? c.atT : null, note: notes[kg.toFixed(1)] || '' };
  });
  return { start: sw, goal, stops, current: daily.length ? daily[daily.length - 1].kg : null };
}

/* -------- Daily mood line (from today's check-in only) -------- */
function moodLine(now) {
  const dk = dateKey(now || new Date());
  const c = Store.state.checkIns.find(x => x.dateKey === dk);
  if (!c) return null;
  const seed = new Date(dk + 'T12:00:00').getDate();
  const pick = a => a[seed % a.length];
  if (c.nothingToReport) return { emoji: '🌿', text: pick(['Quiet day logged — those count too.', 'Nothing to report is a perfectly good report.', 'Smooth day. Noted.']) };
  const gi = c.gi || [];
  if (gi.indexOf('Vomiting') >= 0) return { emoji: '🫖', text: 'Rough gut day. Small sips, nothing heavy — and if you can’t keep fluids down, tell your doctor.' };
  if (gi.indexOf('Nausea') >= 0) return { emoji: '🫖', text: 'Nausea today: small, bland bites and slow sips usually sit easier. If it keeps up, mention it to your doctor.' };
  if (gi.length) return { emoji: '🫖', text: 'Your gut is voting today. Go easy — warm, simple food and water.' };
  if (c.energy != null && c.energy <= 2) return { emoji: '🔋', text: pick(['Low-battery day. Protein, water, and permission to do less are all valid plans.', 'Running low today — keep the bar small and count the basics as a win.', 'Low energy is information, not failure. Something easy and protein-y, then rest.']) };
  if (c.appetite != null && c.appetite <= 2) return { emoji: '🥣', text: pick(['Low appetite is common around shot days. Something easy — yoghurt, eggs, a protein shake — beats skipping.', 'Not hungry? Small and often still counts. Aim for protein first.']) };
  if (c.energy != null && c.energy >= 4) return { emoji: '⚡', text: pick(['High-energy day — a great one for a walk or a workout.', 'You’ve got fuel today. Use it on something you’ve been putting off.', 'Good energy. Bank it: move a bit, eat well.']) };
  return { emoji: '✨', text: pick(['Solid day. Showing up is most of the work.', 'Steady. That’s exactly the point.', 'Logged and moving. Nice.']) };
}

/* the first run only records what you already have (no flood of old achievements) */
function achievementsCheck() {
  try {
    const items = achievementItems();
    const keys = items.map(i => i.key);
    const seen = Store.state.meta.achSeen;
    if (!Array.isArray(seen)) { Store.state.meta.achSeen = keys; Store.save(); return; }
    const fresh = items.filter(i => seen.indexOf(i.key) < 0);
    if (!fresh.length) return;
    Store.state.meta.achSeen = Array.from(new Set(seen.concat(keys)));
    Store.save();
    Celebrate.show(fresh);
  } catch (e) {}
}

/* -------- What Changed? -------- */
function renderWhatChangedResult(cmp, labelA, labelB) {
  let h = '<div class="sec-label">Weight</div><div class="card">';
  if (cmp.weightA && cmp.weightB) {
    h += '<div class="kv"><span>' + esc(labelA) + '</span><b>' + fmtSign(cmp.weightA.delta, 'kg') + ' (n=' + cmp.weightA.n + ')</b></div>' +
      '<div class="kv" style="border:0"><span>' + esc(labelB) + '</span><b>' + fmtSign(cmp.weightB.delta, 'kg') + ' (n=' + cmp.weightB.n + ')</b></div>';
  } else h += '<div class="footnote" style="margin:0">Not enough weigh-ins in one or both windows to compare.</div>';
  h += '</div>';
  h += '<div class="sec-label">Check-ins &amp; logging</div><div class="card">' +
    '<div class="kv"><span>Injections logged</span><b>' + cmp.injectionCountA + ' vs ' + cmp.injectionCountB + '</b></div>' +
    '<div class="kv"><span>Check-ins logged</span><b>' + cmp.checkInCountA + ' vs ' + cmp.checkInCountB + '</b></div>' +
    (cmp.proteinA || cmp.proteinB ? '<div class="kv"><span>Avg protein</span><b>' + (cmp.proteinA ? Math.round(cmp.proteinA.avg) + 'g' : '—') + ' vs ' + (cmp.proteinB ? Math.round(cmp.proteinB.avg) + 'g' : '—') + '</b></div>' : '') +
    (cmp.kcalA || cmp.kcalB ? '<div class="kv"><span>Avg calories</span><b>' + (cmp.kcalA ? Math.round(cmp.kcalA.avg) : '—') + ' vs ' + (cmp.kcalB ? Math.round(cmp.kcalB.avg) : '—') + '</b></div>' : '') +
    '<div class="kv" style="border:0"><span>Measurements logged</span><b>' + cmp.measurementCountA + ' vs ' + cmp.measurementCountB + '</b></div></div>';
  h += '<div class="sec-label">Symptoms</div><div class="card">';
  if (cmp.symptomsSufficient) h += '<div class="kv" style="border:0"><span>Symptom entries</span><b>' + cmp.symptomCountA + ' vs ' + cmp.symptomCountB + '</b></div>';
  else h += '<div class="footnote" style="margin:0">Not enough symptom entries in one or both windows to compare (need at least 2 each).</div>';
  h += '</div>';
  h += '<div class="footnote">This compares what you logged in each window — it doesn’t mean one caused the other.</div>';
  return h;
}

/* -------- Send to Coach (English) -------- */
function buildCoachSummary() {
  const now = new Date();
  const lines = [];
  lines.push('Tempo summary — ' + fmtDate(now));
  lines.push('');
  /* weight: last 14 days, daily average + 7-day trend */
  const daily = dailyWeightSeries();
  if (daily.length) {
    const roll = weightRollingAvg(7, 3, daily);
    const rollByT = {}; roll.forEach(r => rollByT[r.x] = r.y);
    const recent = daily.slice(-14);
    lines.push('Weight, last 14 days (daily average, with 7-day avg where available):');
    recent.forEach(d => {
      lines.push('- ' + fmtDate(new Date(d.t)) + ': ' + d.kg.toFixed(1) + ' kg' + (rollByT[d.t] != null ? ' (7d avg ' + rollByT[d.t].toFixed(1) + ')' : ''));
    });
    lines.push('');
  }
  /* check-ins: last 7 calendar days */
  const cut7 = now.getTime() - 7 * DAY;
  const ci = Store.state.checkIns.filter(c => new Date(c.dateKey + 'T12:00:00').getTime() >= cut7).slice().sort((a, b) => a.dateKey.localeCompare(b.dateKey));
  if (ci.length) {
    lines.push('Check-ins, last 7 days:');
    ci.forEach(c => {
      const parts = [];
      if (c.nothingToReport) parts.push('nothing to report');
      if (c.appetite != null) parts.push('appetite ' + c.appetite + '/5');
      if (c.energy != null) parts.push('energy ' + c.energy + '/5');
      if (c.proteinG != null) parts.push('protein ' + c.proteinG + 'g');
      if (c.kcal != null) parts.push('kcal ' + c.kcal);
      if (c.gi && c.gi.length) parts.push('GI: ' + c.gi.join(', '));
      lines.push('- ' + fmtDate(c.dateKey + 'T12:00:00') + ': ' + (parts.join(', ') || '—'));
    });
    lines.push('');
  }
  /* injections: last 3, plus the current (ongoing) dose period */
  const injs = injectionsSorted(false);
  if (injs.length) {
    lines.push('Last 3 injections:');
    injs.slice(-3).forEach(i => lines.push('- ' + fmtDate(i.dateTime) + ': ' + fmtMg(i.doseMg) + ' mg' + (i.site ? ' (' + i.site + ')' : '')));
    lines.push('');
  }
  const activePeriod = dosePeriods().slice(-1)[0];
  if (activePeriod) lines.push('Current dose period: ' + fmtMg(activePeriod.doseMg) + ' mg since ' + fmtDate(activePeriod.startDate));
  /* symptoms: last 14 days */
  const cut14 = now.getTime() - 14 * DAY;
  const recentSym = Store.state.symptoms.filter(s => new Date(s.dateTime).getTime() >= cut14).slice().sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));
  if (recentSym.length) {
    lines.push('');
    lines.push('Symptoms, last 14 days:');
    recentSym.forEach(s => {
      const d = dayAfterInjection(Store.state.injections, s.dateTime);
      lines.push('- ' + fmtDate(s.dateTime) + (d ? ' (day ' + d + ')' : '') + ': ' + s.name + ', severity ' + s.severity + '/5' + (s.note ? ' - ' + s.note : ''));
    });
  }
  const cyc = cycleInfo(now);
  if (cyc.show && cyc.cycleDay != null) lines.push('Cycle day: ' + cyc.cycleDay);
  const logged = loggedCheckInDates();
  let missing = 0;
  for (let i = 0; i < 7; i++) { const k = dateKey(new Date(now.getTime() - i * DAY)); if (!logged.has(k)) missing++; }
  lines.push('Days with no check-in (last 7): ' + missing);
  return lines.join('\n');
}
function openSendCoachPage() {
  Pages.push({
    title: 'Send to Coach',
    render(body) {
      const text = buildCoachSummary();
      body.innerHTML = '<div class="card"><textarea class="field" rows="14" readonly style="font-family:ui-monospace,monospace;font-size:12.5px">' + esc(text) + '</textarea></div>' +
        '<div class="btnrow" style="margin-bottom:14px"><button class="btn btn-primary btn-sm" style="flex:1" data-act="copy-coach">Copy to clipboard</button>' +
        '<button class="btn btn-tonal btn-sm" data-act="share-coach">Share</button></div>' +
        '<div class="footnote">Plain text, no markdown — safe to paste anywhere.</div>';
    }
  });
}

/* -------- Doctor Summary (Turkish) -------- */
function buildDoctorSummaryTR() {
  const lines = [];
  lines.push('Takip Özeti — ' + fmtDateTR(new Date()));
  lines.push('');
  const sw = startWeight(), cw = currentWeight();
  if (sw != null && cw) {
    lines.push('Başlangıç kilosu: ' + fmtNumTR(sw) + ' kg');
    lines.push('Güncel kilo: ' + fmtNumTR(cw.kg) + ' kg (' + fmtDateTR(cw.dateTime) + ')');
    const tr = weightTrend(28);
    if (tr) lines.push('Son eğilim (28 gün): ' + (tr.perWeek < 0 ? '-' : '+') + fmtNumTR(Math.abs(tr.perWeek)) + ' kg/hafta');
    lines.push('');
  }
  const periods = dosePeriods();
  if (periods.length) {
    lines.push('Doz zaman çizelgesi:');
    periods.forEach(p => {
      const chg = weightChangeForPeriod(p);
      lines.push('- ' + fmtNumTR(p.doseMg) + ' mg: ' + fmtDateTR(p.startDate) + (p.endDate ? ' → ' + fmtDateTR(p.endDate) : ' → günümüz') + (chg ? ' (' + (chg.delta < 0 ? '-' : '+') + fmtNumTR(Math.abs(chg.delta)) + ' kg)' : ''));
    });
    lines.push('');
  }
  if (injectionsSorted(false).length) {
    lines.push('Enjeksiyonlar (tarih / mg / bölge):');
    injectionsSorted(false).forEach(i => lines.push('- ' + fmtDateTR(i.dateTime) + ' / ' + fmtNumTR(i.doseMg) + ' mg' + (i.site ? ' / ' + siteTR(i.site) : '')));
    lines.push('');
  }
  if (Store.state.symptoms.length) {
    lines.push('Yan etkiler (tarih / enjeksiyondan sonraki gün / şiddet / not):');
    Store.state.symptoms.slice().sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime)).forEach(s => {
      const d = dayAfterInjection(Store.state.injections, s.dateTime);
      lines.push('- ' + fmtDateTR(s.dateTime) + ' / ' + (d != null ? 'gün ' + d : '—') + ' / ' + s.severity + '/5 / ' + symptomTR(s.name) + (s.note ? ' - ' + s.note : ''));
    });
    lines.push('');
  }
  const ci7 = checkInAverages(7);
  lines.push('Son 7 gün ortalamaları:');
  lines.push('- Protein: ' + (ci7.protein ? fmtNumTR(ci7.protein.avg, 0) + ' g (n=' + ci7.protein.n + ')' : 'veri yok'));
  lines.push('- Kalori: ' + (ci7.kcal ? fmtNumTR(ci7.kcal.avg, 0) + ' kcal (n=' + ci7.kcal.n + ')' : 'veri yok'));
  lines.push('- İştah (1-5): ' + (ci7.appetite ? fmtNumTR(ci7.appetite.avg, 1) + ' (n=' + ci7.appetite.n + ')' : 'veri yok'));
  lines.push('- Enerji (1-5): ' + (ci7.energy ? fmtNumTR(ci7.energy.avg, 1) + ' (n=' + ci7.energy.n + ')' : 'veri yok'));
  lines.push('- Günlük kayıt sayısı: ' + ci7.n + '/7');
  lines.push('');
  const flags = headsUpFlags();
  if (flags.length) {
    lines.push('Dikkat edilmesi önerilen noktalar:');
    flags.forEach(f => lines.push('- ' + (f.textTR || f.text)));
    lines.push('');
  }
  lines.push('Not: Kayıt yapılmayan günler için veri eksiktir; eksik günler "belirti yok" anlamına gelmez.');
  lines.push('Bu özet bir takip aracından alınmıştır, tıbbi tavsiye yerine geçmez.');
  return lines.join('\n');
}

  Pages.push({

      body.innerHTML = '<div class="card"><textarea class="field" rows="16" readonly style="font-family:ui-monospace,monospace;font-size:12.5px" dir="auto">' + esc(text) + '</textarea></div>' +

/* ---------------- Google Drive sync (optional) ----------------
   Drive sync merge (per-record, by id + updatedAt, tombstone-aware)
   A sync is always a two-way MERGE, never an overwrite in either direction: every record collection
   is merged key-by-key, the newer updatedAt wins, and a tombstone (recorded on every local delete)
   beats a record whose updatedAt is no newer than the delete. Settings are the one deliberate
   simplification: there's no per-field timestamp for them, so this device's settings always carry
   over as-is on a sync rather than being merged field-by-field. */
function mergeTombstones(a, b) {
  const map = new Map();
  (a || []).concat(b || []).forEach(t => {
    if (!t || !t.type || !t.id) return;
    const key = t.type + '|' + t.id;
    const cur = map.get(key);
    if (!cur || new Date(t.deletedAt).getTime() > new Date(cur.deletedAt).getTime()) map.set(key, t);
  });
  const cut = Date.now() - 180 * DAY;
  return Array.from(map.values()).filter(t => new Date(t.deletedAt).getTime() >= cut);
}
function mergeRecordCollection(localArr, remoteArr, tombstones, type) {
  const tombByKey = new Map();
  (tombstones || []).forEach(t => { if (t.type === type) tombByKey.set(t.id, t.deletedAt); });
  const byId = new Map();
  (remoteArr || []).forEach(r => { if (r && r.id) byId.set(r.id, r); });
  (localArr || []).forEach(l => {
    if (!l || !l.id) return;
    const r = byId.get(l.id);
    if (!r) { byId.set(l.id, l); return; }
    const lt = new Date(l.updatedAt || l.createdAt || 0).getTime();
    const rt = new Date(r.updatedAt || r.createdAt || 0).getTime();
    byId.set(l.id, lt >= rt ? l : r);
  });
  const out = [];
  byId.forEach((rec, id) => {
    const delAt = tombByKey.get(id);
    if (delAt && new Date(delAt).getTime() >= new Date(rec.updatedAt || rec.createdAt || 0).getTime()) return;
    out.push(rec);
  });

}
const DRIVE_RECORD_TYPES = { injections: 'injection', weights: 'weight', symptoms: 'symptom', measurements: 'measurement', checkIns: 'checkIn', dosePlans: 'dosePlan', vials: 'vial', spends: 'spend', cycles: 'cycle' };

      const q2 = encodeURIComponent("name='tempo-backup.json' and '" + dr.folderId + "' in parents and trashed=false");
      const r2 = await (await this.api(this.API + '/files?q=' + q2 + '&fields=files(id)')).json();
      if (r2.files && r2.files.length) { dr.fileId = r2.files[0].id; return r2.files[0]; }
    }
    Store.persist();
    return null;
  },
  multipartBody(meta, json, boundary) {
    return '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' +
      JSON.stringify(meta) + '\r\n--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' +
      json + '\r\n--' + boundary + '--';
  },
  /* downloads the remote file (if any), merges it into local state record-by-record, persists the
     merge locally, then uploads the merged result back — so the file on Drive and this device
     always converge, and a sync can never make either side silently lose a record. */
  async sync(manual) {
    const dr = Store.state.settings.drive;
    if (!dr.enabled || this.busy) return;
    this.busy = true;
    try {
      await this.ensureSetup();
      if (dr.fileId) {
        let remoteData = null;
        try {
          const r = await this.api(this.API + '/files/' + dr.fileId + '?alt=media');
          remoteData = await r.json();
        } catch (e) { remoteData = null; /* unreadable or offline — sync falls back to local-only, nothing lost */ }
        if (remoteData && looksLikeBackup(remoteData)) {
          if (typeof remoteData.schemaVersion === 'number' && remoteData.schemaVersion > SCHEMA) {
            this.busy = false;
            if (manual) toast('The Drive backup is from a newer app version — update the app before syncing.');
            return;
          }
          let remoteMigrated = null;
          try { remoteMigrated = Store.migrate(JSON.parse(JSON.stringify(remoteData))); } catch (e) { remoteMigrated = null; }
          if (remoteMigrated) {
            Store.state = mergeDriveState(Store.state, remoteMigrated);
            Store.persist();
          }
        }
      }
      const json = JSON.stringify(dataOnlyPayload());
      const hash = fnv1a(json);
      const boundary = 'tb' + uid();
      if (dr.fileId) {
        await this.api(this.UP + '/files/' + dr.fileId + '?uploadType=multipart', {
          method: 'PATCH',
          headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
          body: this.multipartBody({ appProperties: { hash } }, json, boundary)
        });
      } else {
        const r = await (await this.api(this.UP + '/files?uploadType=multipart', {
          method: 'POST',
          headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
          body: this.multipartBody({ name: 'tempo-backup.json', parents: [dr.folderId], appProperties: { hash } }, json, boundary)
        })).json();
        dr.fileId = r.id;
      }
      dr.lastHash = hash;
      dr.lastSync = new Date().toISOString();
      Store.persist();
      if (manual) { toast('Synced with Drive ✓'); Pages.popAll(); }
      App.refresh();
    } catch (e) {
      if (manual) toast(e.message || 'Sync failed');
    } finally { this.busy = false; }
  },
  scheduleAutoSync() {
    const dr = Store.state.settings.drive;
    if (!dr.enabled || !dr.clientId) return;
    clearTimeout(this.syncTimer);
    this.syncTimer = setTimeout(() => this.sync(false), 4000);
  },
  async connect() {
    const cid = ($('#drive-cid') ? $('#drive-cid').value.trim() : Store.state.settings.drive.clientId || '').trim();
    if (!cid || cid.indexOf('.apps.googleusercontent.com') < 0) return toast('Paste a valid OAuth Client ID first');
    Store.state.settings.drive.clientId = cid;
    Store.persist();
    toast('Opening Google sign-in…');
    try {
      await this.getToken(true);
      await this.ensureSetup();
      Store.state.settings.drive.enabled = true;
      Store.persist();
      /* a sync here is a merge, never a one-sided overwrite, so there's nothing to ask the person
         to choose between — whatever's on Drive and whatever's on this device both survive. */
      await this.sync(true);
    } catch (e) { toast(e.message || 'Could not connect'); }
  },
  disconnect() {
    const dr = Store.state.settings.drive;
    dr.enabled = false;
    this.token = null; this.tokenExp = 0;
    clearTimeout(this.syncTimer);
    Store.persist();
    App.refresh();
    toast('Drive sync off — file stays in your Drive');
  }
};

function applyTheme() {
  try {
    const id = (Store.state && Store.state.settings && Store.state.settings.theme) || 'classic';
    const t = THEMES.find(x => x.id === id) || THEMES[0];
    const root = document.documentElement;
    if (t.id === 'classic') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t.id);
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t.color);
  } catch (e) {}
}

function installPwaBits() {
  /* optional companion service worker for offline (iOS needs a real file) */
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        reg.update().catch(() => {});
        /* a newer build finished downloading while the app was open */
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              Dlg.show({
                title: 'Update ready',
                msg: 'A newer version of the app has been downloaded. Reload now to use it? Your data is untouched.',
                buttons: [
                  { label: 'Reload', key: 'go', style: 'btn-primary' },
                  { label: 'Later', key: 'later', style: 'btn-ghost' }
                ]
              }).then(k => { if (k === 'go') { try { sw.postMessage('skipWaiting'); } catch (e) {} location.reload(); } });
            }
          });
        });
        /* check again whenever the app comes back to the foreground */
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) reg.update().catch(() => {});
        });
      }).catch(() => {});
    }
  } catch (e) {}
}
let lastDayKey = dateKey(new Date());
function boot() {
  Store.load();
  applyTheme();
  setTimeout(achievementsCheck, 900);
  renderTopbar();
  renderDashboard();
  installPwaBits();
  handleLegacyPhotos().catch(() => {});
  if (Store.corruptRecovered) {
    setTimeout(() => Dlg.show({
      title: 'Data recovered',
      msg: 'Stored data was corrupted and has been quarantined. The app restarted fresh — you can export the quarantined snapshot from Settings → About.',
      buttons: [{ label: 'OK', key: 'ok', style: 'btn-primary' }]
    }), 400);
  }
  if (Store.newerSchemaBlocked) {
    setTimeout(() => Dlg.show({
      title: 'Newer data found',
      msg: 'The data saved on this device was written by a newer version of Tempo and could not be opened here. Nothing was lost — it has been kept safely and the app started fresh. Update the app, or export the saved snapshot from Settings → About.',
      buttons: [{ label: 'OK', key: 'ok', style: 'btn-primary' }]
    }), 400);
  }
  if (Store.pendingPhotoPrompt) {
    const pp = Store.pendingPhotoPrompt;
    Store.pendingPhotoPrompt = null;
    setTimeout(() => {
      shareFile('tempo-legacy-photos-' + stamp() + '.json', 'application/json', JSON.stringify({
        photos: pp.photos, exportedAt: new Date().toISOString(),
        note: 'Progress Photos was removed from Tempo in v1.33. These were found embedded in your saved data and are preserved here exactly as they were.'
      })).then(() => toast(pp.count + ' photo(s) found in your saved data were exported to a file since Progress Photos is no longer part of the app'))
        .catch(() => toast(pp.count + ' photo(s) found in your saved data could not be auto-exported'));
    }, 700);
  }
  /* keep "days until" and shot-day state fresh */
  setInterval(() => {
    const k = dateKey(new Date());
    if (k !== lastDayKey) { lastDayKey = k; App.refresh(); }
  }, 60000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !Sheet.current) App.refresh();
  });
}
