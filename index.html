/* -------- Send to Coach (English) -------- */
function buildCoachSummary() {
  const now = new Date();
  const lines = [];
  lines.push('Tempo summary — ' + fmtDate(now));
  lines.push('');
  /* weight: last 14 days, daily average + 7-day trend */
  const daily = dailyWeightSeries();
  if (daily.length) {
    const roll = weightRollingAvg(7, 3, daily);
    const rollByT = {}; roll.forEach(r => rollByT[r.x] = r.y);
    const recent = daily.slice(-14);
    lines.push('Weight, last 14 days (daily average, with 7-day avg where available):');
    recent.forEach(d => {
      lines.push('- ' + fmtDate(new Date(d.t)) + ': ' + d.kg.toFixed(1) + ' kg' + (rollByT[d.t] != null ? ' (7d avg ' + rollByT[d.t].toFixed(1) + ')' : ''));
    });
    lines.push('');
  }
  /* check-ins: last 7 calendar days */
  const cut7 = now.getTime() - 7 * DAY;
  const ci = Store.state.checkIns.filter(c => new Date(c.dateKey + 'T12:00:00').getTime() >= cut7).slice().sort((a, b) => a.dateKey.localeCompare(b.dateKey));
  if (ci.length) {
    lines.push('Check-ins, last 7 days:');
    ci.forEach(c => {
      const parts = [];
      if (c.nothingToReport) parts.push('nothing to report');
      if (c.appetite != null) parts.push('appetite ' + c.appetite + '/5');
      if (c.energy != null) parts.push('energy ' + c.energy + '/5');
      if (c.proteinG != null) parts.push('protein ' + c.proteinG + 'g');
      if (c.kcal != null) parts.push('kcal ' + c.kcal);
      if (c.gi && c.gi.length) parts.push('GI: ' + c.gi.join(', '));
      lines.push('- ' + fmtDate(c.dateKey + 'T12:00:00') + ': ' + (parts.join(', ') || '—'));
    });
    lines.push('');
  }
  /* injections: last 3, plus the current (ongoing) dose period */
  const injs = injectionsSorted(false);
  if (injs.length) {
    lines.push('Last 3 injections:');
    injs.slice(-3).forEach(i => lines.push('- ' + fmtDate(i.dateTime) + ': ' + fmtMg(i.doseMg) + ' mg' + (i.site ? ' (' + i.site + ')' : '')));
    lines.push('');
  }
  const activePeriod = dosePeriods().slice(-1)[0];
  if (activePeriod) lines.push('Current dose period: ' + fmtMg(activePeriod.doseMg) + ' mg since ' + fmtDate(activePeriod.startDate));
  /* symptoms: last 14 days */
  const cut14 = now.getTime() - 14 * DAY;
  const recentSym = Store.state.symptoms.filter(s => new Date(s.dateTime).getTime() >= cut14).slice().sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));
  if (recentSym.length) {
    lines.push('');
    lines.push('Symptoms, last 14 days:');
    recentSym.forEach(s => {
      const d = dayAfterInjection(Store.state.injections, s.dateTime);
      lines.push('- ' + fmtDate(s.dateTime) + (d ? ' (day ' + d + ')' : '') + ': ' + s.name + ', severity ' + s.severity + '/5' + (s.note ? ' - ' + s.note : ''));
    });
  }
  const cyc = cycleInfo(now);
  if (cyc.show && cyc.cycleDay != null) lines.push('Cycle day: ' + cyc.cycleDay);
  const logged = loggedCheckInDates();
  let missing = 0;
  for (let i = 0; i < 7; i++) { const k = dateKey(new Date(now.getTime() - i * DAY)); if (!logged.has(k)) missing++; }
  lines.push('Days with no check-in (last 7): ' + missing);
  return lines.join('\n');
}
function openSendCoachPage() {
  Pages.push({
    title: 'Send to Coach',
    render(body) {
      const text = buildCoachSummary();
      body.innerHTML = '<div class="card"><textarea class="field" rows="14" readonly style="font-family:ui-monospace,monospace;font-size:12.5px">' + esc(text) + '</textarea></div>' +
        '<div class="btnrow" style="margin-bottom:14px"><button class="btn btn-primary btn-sm" style="flex:1" data-act="copy-coach">Copy to clipboard</button>' +
        '<button class="btn btn-tonal btn-sm" data-act="share-coach">Share</button></div>' +
        '<div class="footnote">Plain text, no markdown — safe to paste anywhere.</div>';
    }
  });
}

/* -------- Doctor Summary (Turkish) -------- */
function buildDoctorSummaryTR() {
  const lines = [];
  lines.push('Takip Özeti — ' + fmtDateTR(new Date()));
  lines.push('');
  const sw = startWeight(), cw = currentWeight();
  if (sw != null && cw) {
    lines.push('Başlangıç kilosu: ' + fmtNumTR(sw) + ' kg');
    lines.push('Güncel kilo: ' + fmtNumTR(cw.kg) + ' kg (' + fmtDateTR(cw.dateTime) + ')');
    const tr = weightTrend(28);
    if (tr) lines.push('Son eğilim (28 gün): ' + (tr.perWeek < 0 ? '-' : '+') + fmtNumTR(Math.abs(tr.perWeek)) + ' kg/hafta');
    lines.push('');
  }
  const periods = dosePeriods();
  if (periods.length) {
    lines.push('Doz zaman çizelgesi:');
    periods.forEach(p => {
      const chg = weightChangeForPeriod(p);
      lines.push('- ' + fmtNumTR(p.doseMg) + ' mg: ' + fmtDateTR(p.startDate) + (p.endDate ? ' → ' + fmtDateTR(p.endDate) : ' → günümüz') + (chg ? ' (' + (chg.delta < 0 ? '-' : '+') + fmtNumTR(Math.abs(chg.delta)) + ' kg)' : ''));
    });
    lines.push('');
  }
  if (injectionsSorted(false).length) {
    lines.push('Enjeksiyonlar (tarih / mg / bölge):');
    injectionsSorted(false).forEach(i => lines.push('- ' + fmtDateTR(i.dateTime) + ' / ' + fmtNumTR(i.doseMg) + ' mg' + (i.site ? ' / ' + siteTR(i.site) : '')));
    lines.push('');
  }
  if (Store.state.symptoms.length) {
    lines.push('Yan etkiler (tarih / enjeksiyondan sonraki gün / şiddet / not):');
    Store.state.symptoms.slice().sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime)).forEach(s => {
      const d = dayAfterInjection(Store.state.injections, s.dateTime);
      lines.push('- ' + fmtDateTR(s.dateTime) + ' / ' + (d != null ? 'gün ' + d : '—') + ' / ' + s.severity + '/5 / ' + symptomTR(s.name) + (s.note ? ' - ' + s.note : ''));
    });
    lines.push('');
  }
  const ci7 = checkInAverages(7);
  lines.push('Son 7 gün ortalamaları:');
  lines.push('- Protein: ' + (ci7.protein ? fmtNumTR(ci7.protein.avg, 0) + ' g (n=' + ci7.protein.n + ')' : 'veri yok'));
  lines.push('- Kalori: ' + (ci7.kcal ? fmtNumTR(ci7.kcal.avg, 0) + ' kcal (n=' + ci7.kcal.n + ')' : 'veri yok'));
  lines.push('- İştah (1-5): ' + (ci7.appetite ? fmtNumTR(ci7.appetite.avg, 1) + ' (n=' + ci7.appetite.n + ')' : 'veri yok'));
  lines.push('- Enerji (1-5): ' + (ci7.energy ? fmtNumTR(ci7.energy.avg, 1) + ' (n=' + ci7.energy.n + ')' : 'veri yok'));
  lines.push('- Günlük kayıt sayısı: ' + ci7.n + '/7');
  lines.push('');
  const flags = headsUpFlags();
  if (flags.length) {
    lines.push('Dikkat edilmesi önerilen noktalar:');
    flags.forEach(f => lines.push('- ' + (f.textTR || f.text)));
    lines.push('');
  }
  lines.push('Not: Kayıt yapılmayan günler için veri eksiktir; eksik günler "belirti yok" anlamına gelmez.');
  lines.push('Bu özet bir takip aracından alınmıştır, tıbbi tavsiye yerine geçmez.');
  return lines.join('\n');
}

  Pages.push({

      body.innerHTML = '<div class="card"><textarea class="field" rows="16" readonly style="font-family:ui-monospace,monospace;font-size:12.5px" dir="auto">' + esc(text) + '</textarea></div>' +

function csvEsc(v) {
  v = v == null ? '' : String(v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}
function dataURLtoBlob(durl) {
  const m = durl.split(',');
  const mime = (m[0].match(/data:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(m[1]);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function shareFile(filename, mime, text) {
  const blob = new Blob([text], { type: mime });
  if (navigator.share && navigator.canShare) {
    try {
      const file = new File([blob], filename, { type: mime });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function dataOnlyPayload() {
  const d = JSON.parse(JSON.stringify(Store.state));
  d.exportedAt = new Date().toISOString();
  d.appVersion = APP_VERSION;

}
async function exportData(includeLegacyPhotos) {
  const d = dataOnlyPayload();
  /* Progress Photos is no longer a feature, but if this device still has photos from before the
     v1.33 upgrade sitting in IndexedDB, "full backup" carries them along so a backup taken today
     is still a complete snapshot of everything on the device — nothing is silently left behind. */
  if (includeLegacyPhotos && PhotoDB.available) {
    let metas = [];
    try { metas = await PhotoDB.allMeta(); } catch (e) {}
    if (metas.length) {
      d.photos = [];
      for (const p of metas) {
        try {
          const full = await PhotoDB.getFull(p.id);
          d.photos.push({
            id: p.id, dateTime: p.dateTime, note: p.note || '', weightKg: p.weightKg || null,
            thumbData: p.thumb ? await blobToDataURL(p.thumb) : null,
            fullData: full ? await blobToDataURL(full) : null
          });
        } catch (e) {}
      }
    }
  }
  return JSON.stringify(d);
}

function looksLikeBackup(d) {

const RESTORE_COUNT_KEYS = ['injections', 'weights', 'symptoms', 'measurements', 'checkIns', 'dosePlans', 'vials', 'spends', 'cycles', 'equipment', 'programs', 'workouts'];
async function doRestore(file) {
  let text;
  try { text = await file.text(); } catch (e) { return toast('Could not read file'); }
  let data;
  try { data = JSON.parse(text); } catch (e) { return toast('Not a valid backup file'); }
  if (!looksLikeBackup(data)) return toast('That file doesn’t look like a Tempo backup');
  if (typeof data.schemaVersion === 'number' && data.schemaVersion > SCHEMA) {
    return toast('That backup is from a newer version of the app (schema ' + data.schemaVersion + ') — update the app before restoring it.');
  }
  /* an older backup (pre-1.33.4) still carries its vials under the old key "pens" — count those too,
     since the real migration below converts them regardless of what this summary shows */
  const counts = RESTORE_COUNT_KEYS.map(k => Array.isArray(data[k]) ? data[k].length : (k === 'vials' && Array.isArray(data.pens) ? data.pens.length : 0));
  const nPhotos = Array.isArray(data.photos) ? data.photos.length : 0;
  const summary = 'Injections ' + counts[0] + ', weights ' + counts[1] + ', symptoms ' + counts[2] + ', measurements ' + counts[3] +
    ', check-ins ' + counts[4] + ', dose plan ' + counts[5] + ', vials ' + counts[6] + ', expenses ' + counts[7] + ', period log ' + counts[8] + ', workouts ' + counts[11] +
    (nPhotos ? ', ' + nPhotos + ' legacy photo(s)' : '') + '. Current data on this device will be replaced.';
  const ok = await confirmDlg('Restore this backup?', summary, 'Restore', true);
  if (!ok) return;
  try { localStorage.setItem(KEY_PREFIX + 'prerestore_' + Date.now(), JSON.stringify(Store.state)); } catch (e) {}
  /* Progress Photos is gone as a feature, so an old-style full backup's embedded photos array is
     never written back into the app — but it's never thrown away either: it's repackaged into its
     own file immediately, so restoring an old backup can't make those photos disappear for good. */
  const legacyPhotos = Array.isArray(data.photos) ? data.photos : null;
  delete data.photos;
  let migrated;
  try { migrated = Store.migrate(data); }
  catch (e) {
    const msg = String(e && e.message || '');
    if (msg.indexOf('NEWER_SCHEMA') === 0) return toast('That backup is from a newer version of the app — update the app before restoring it.');
    return toast('Could not restore that backup (' + (msg || 'unknown error') + ')');
  }
  Store.state = migrated;
  Store.persist();
  if (legacyPhotos && legacyPhotos.length) {
    try {
      await shareFile('tempo-legacy-photos-' + stamp() + '.json', 'application/json', JSON.stringify({
        photos: legacyPhotos, exportedAt: new Date().toISOString(),
        note: 'Progress Photos was removed from Tempo in v1.33. These photos were found in the backup you restored and were not imported, but nothing was discarded — this file preserves them exactly as they were.'
      }));
    } catch (e) {}
    toast(legacyPhotos.length + ' photo(s) from the backup were saved to a separate file (Progress Photos is no longer part of the app)');
  }
  Pages.popAll();
  App.refresh();
  toast('Backup restored ✓');
}

function oldPremigrateSnapshots(now) {

  if (PhotoDB.available) await PhotoDB.clearAll().catch(() => {});

/* ---------------- Google Drive sync (optional) ----------------
   Drive sync merge (per-record, by id + updatedAt, tombstone-aware)
   A sync is always a two-way MERGE, never an overwrite in either direction: every record collection
   is merged key-by-key, the newer updatedAt wins, and a tombstone (recorded on every local delete)
   beats a record whose updatedAt is no newer than the delete. Settings are the one deliberate
   simplification: there's no per-field timestamp for them, so this device's settings always carry
   over as-is on a sync rather than being merged field-by-field. */
function mergeTombstones(a, b) {
  const map = new Map();
  (a || []).concat(b || []).forEach(t => {
    if (!t || !t.type || !t.id) return;
    const key = t.type + '|' + t.id;
    const cur = map.get(key);
    if (!cur || new Date(t.deletedAt).getTime() > new Date(cur.deletedAt).getTime()) map.set(key, t);
  });
  const cut = Date.now() - 180 * DAY;
  return Array.from(map.values()).filter(t => new Date(t.deletedAt).getTime() >= cut);
}
function mergeRecordCollection(localArr, remoteArr, tombstones, type) {
  const tombByKey = new Map();
  (tombstones || []).forEach(t => { if (t.type === type) tombByKey.set(t.id, t.deletedAt); });
  const byId = new Map();
  (remoteArr || []).forEach(r => { if (r && r.id) byId.set(r.id, r); });
  (localArr || []).forEach(l => {
    if (!l || !l.id) return;
    const r = byId.get(l.id);
    if (!r) { byId.set(l.id, l); return; }
    const lt = new Date(l.updatedAt || l.createdAt || 0).getTime();
    const rt = new Date(r.updatedAt || r.createdAt || 0).getTime();
    byId.set(l.id, lt >= rt ? l : r);
  });
  const out = [];
  byId.forEach((rec, id) => {
    const delAt = tombByKey.get(id);
    if (delAt && new Date(delAt).getTime() >= new Date(rec.updatedAt || rec.createdAt || 0).getTime()) return;
    out.push(rec);
  });
  return out;
}
const DRIVE_RECORD_TYPES = { injections: 'injection', weights: 'weight', symptoms: 'symptom', measurements: 'measurement', checkIns: 'checkIn', dosePlans: 'dosePlan', vials: 'vial', spends: 'spend', cycles: 'cycle', equipment: 'equipment', programs: 'program', workouts: 'workout' };
function mergeDriveState(localState, remoteData) {
  const merged = JSON.parse(JSON.stringify(localState));
  if (!remoteData || typeof remoteData !== 'object') return merged;
  const tombstones = mergeTombstones(localState.tombstones, remoteData.tombstones);
  merged.tombstones = tombstones;
  RECORD_COLLECTIONS.forEach(col => {
    merged[col] = mergeRecordCollection(localState[col], remoteData[col], tombstones, DRIVE_RECORD_TYPES[col]);
  });
  return merged;
}
const Drive = {
  token: null, tokenExp: 0, tokenClient: null, gisLoading: null, syncTimer: null, busy: false,
  API: 'https://www.googleapis.com/drive/v3',

      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.onload = () => res();
      s.onerror = () => { Drive.gisLoading = null; rej(new Error('Could not load Google sign-in (offline?)')); };
      document.head.appendChild(s);
    });
    return this.gisLoading;
  },
  getToken(interactive) {
    if (this.token && Date.now() < this.tokenExp) return Promise.resolve(this.token);
    const cid = Store.state.settings.drive.clientId;
    if (!cid) return Promise.reject(new Error('Missing Client ID'));
    return this.loadGis().then(() => new Promise((res, rej) => {
      try {
        this.tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: cid,
          scope: 'https://www.googleapis.com/auth/drive.file',
          callback: (resp) => {
            if (resp && resp.access_token) {
              Drive.token = resp.access_token;

  async api(url, opts, retried) {

    const r = await fetch(url, opts);
    if (r.status === 401 && !retried) {
      this.token = null;
      return this.api(url, opts, true);
    }
    if (!r.ok) throw new Error('Drive error ' + r.status);
    return r;
  },
  async ensureSetup() {
    const dr = Store.state.settings.drive;
    if (!dr.folderId) {
      const q = encodeURIComponent("name='Tempo' and mimeType='application/vnd.google-apps.folder' and trashed=false");
      const r = await (await this.api(this.API + '/files?q=' + q + '&fields=files(id)')).json();
      if (r.files && r.files.length) dr.folderId = r.files[0].id;
      else {
        const c = await (await this.api(this.API + '/files', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'Tempo', mimeType: 'application/vnd.google-apps.folder' })
        })).json();
        dr.folderId = c.id;
      }
    }
    if (!dr.fileId) {
      const q2 = encodeURIComponent("name='tempo-backup.json' and '" + dr.folderId + "' in parents and trashed=false");
      const r2 = await (await this.api(this.API + '/files?q=' + q2 + '&fields=files(id)')).json();
      if (r2.files && r2.files.length) { dr.fileId = r2.files[0].id; return r2.files[0]; }
    }

    return null;
  },
  multipartBody(meta, json, boundary) {

  /* downloads the remote file (if any), merges it into local state record-by-record, persists the
     merge locally, then uploads the merged result back — so the file on Drive and this device
     always converge, and a sync can never make either side silently lose a record. */
  async sync(manual) {
    const dr = Store.state.settings.drive;
    if (!dr.enabled || this.busy) return;
    this.busy = true;
    try {
      await this.ensureSetup();
      if (dr.fileId) {
        let remoteData = null;
        try {
          const r = await this.api(this.API + '/files/' + dr.fileId + '?alt=media');
          remoteData = await r.json();
        } catch (e) { remoteData = null; /* unreadable or offline — sync falls back to local-only, nothing lost */ }
        if (remoteData && looksLikeBackup(remoteData)) {
          if (typeof remoteData.schemaVersion === 'number' && remoteData.schemaVersion > SCHEMA) {
            this.busy = false;
            if (manual) toast('The Drive backup is from a newer app version — update the app before syncing.');
            return;
          }
          let remoteMigrated = null;
          try { remoteMigrated = Store.migrate(JSON.parse(JSON.stringify(remoteData))); } catch (e) { remoteMigrated = null; }

      const hash = fnv1a(json);
      const boundary = 'tb' + uid();
      if (dr.fileId) {
        await this.api(this.UP + '/files/' + dr.fileId + '?uploadType=multipart', {
          method: 'PATCH',
          headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
          body: this.multipartBody({ appProperties: { hash } }, json, boundary)

      } else {

          method: 'POST',

      }
      dr.lastHash = hash;
      dr.lastSync = new Date().toISOString();

      if (manual) { toast('Synced with Drive ✓'); Pages.popAll(); }
      App.refresh();
    } catch (e) {
      if (manual) toast(e.message || 'Sync failed');
    } finally { this.busy = false; }
  },
  scheduleAutoSync() {
    const dr = Store.state.settings.drive;

  },
  async connect() {
    const cid = ($('#drive-cid') ? $('#drive-cid').value.trim() : Store.state.settings.drive.clientId || '').trim();

    } catch (e) { toast(e.message || 'Could not connect'); }
  },
  disconnect() {

      reorderLeadDays: lead && lead > 0 ? Math.round(lead) : Store.state.settings.reorderLeadDays
    });
    toast('Saved');
  },
  'do-icsexport': () => {
    try { shareFile('tempo-calendar-' + stamp() + '.ics', 'text/calendar', generateIcs()); Store.save(); }
    catch (e) { toast('Could not build calendar file'); }
  },
  'copy-coach': async () => {
    try { await navigator.clipboard.writeText(buildCoachSummary()); toast('Copied to clipboard'); }
    catch (e) { toast('Could not copy — try Share instead'); }
  },
  'share-coach': () => shareFile('tempo-coach-summary-' + stamp() + '.txt', 'text/plain', buildCoachSummary()),
  'copy-doctor': async () => {
    try { await navigator.clipboard.writeText(buildDoctorSummaryTR()); toast('Kopyalandı'); }
    catch (e) { toast('Kopyalanamadı — Paylaşı deneyin'); }
  },
  'share-doctor': () => shareFile('tempo-doktor-ozeti-' + stamp() + '.txt', 'text/plain', buildDoctorSummaryTR()),
  'dismiss-flag': el => Actions.dismissFlag(el.dataset.id),
  'snooze-measurement': () => Actions.snoozeMeasurementReminder(14),
  'export-legacy-photos': () => exportLegacyPhotosNow(),
  'clear-legacy-photos': () => clearLegacyPhotosNow(),
  'check': el => Actions.toggleChecklist(+el.dataset.i),
  'dismiss-setup': (el, e) => { e.stopPropagation(); Actions.patchSettings({ setupDismissed: true }); },
  'wrange': el => { weightRange = el.dataset.r; Pages.render(); },
  'w-toggle-avg': () => { weightShowAvg = !weightShowAvg; Pages.render(); },
  'w-toggle-inj': () => { weightShowInj = !weightShowInj; Pages.render(); },
  'w-toggle-cycle': () => { weightShowCycle = !weightShowCycle; Pages.render(); },
  'cal-prev': () => { calState.m--; if (calState.m < 0) { calState.m = 11; calState.y--; } Pages.render(); },
  'cal-next': () => { calState.m++; if (calState.m > 11) { calState.m = 0; calState.y++; } Pages.render(); },
  'cal-day': el => { calState.selKey = el.dataset.k; Pages.render(); },
  'edit-schedule': () => openScheduleSheet(),
  'save-body': () => {
    const hv = parseNum($('#set-height').value), gv = parseNum($('#set-goal').value), sv = parseNum($('#set-start').value);
    if ($('#set-height').value && (!hv || hv < 90 || hv > 250)) return toast('Height should be 90–250 cm');
    if ($('#set-goal').value && (!gv || gv < 20 || gv > 400)) return toast('Goal should be 20–400 kg');
    if ($('#set-start').value && (!sv || sv < 20 || sv > 400)) return toast('Start weight should be 20–400 kg');
    Actions.patchSettings({ heightCm: hv || null, goalKg: gv || null, startKgOverride: sv || null });
    toast('Saved');
  },
  'save-goals': () => {
    const pt = parseNum($('#set-protein').value);
    const td = $('#set-targetdate') ? $('#set-targetdate').value : '';
    const cur = $('#set-currency') ? $('#set-currency').value : Store.state.settings.currency;
    Actions.patchSettings({ proteinTarget: pt || null, currency: cur });
    if (td !== undefined) Actions.setTargetDate(td || null);
    toast('Saved');
  },
  'save-checklist': () => {
    const items = $('#set-checklist').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 12);
    if (!items.length) return toast('Add at least one item');
    Actions.patchSettings({ checklistItems: items });
    Store.state.checklist = { dateKey: null, done: [] };
    Store.save();
    toast('Checklist saved');
  },
  'cycle-end-today': el => {
    const c = Store.state.cycles.find(i => i.id === el.dataset.id);
    if (!c) return;
    Actions.saveCycle(Object.assign({}, c, { endDate: dateKey(new Date()) + 'T12:00:00' }));
    toast('Period end saved');
  },
  'snooze-backup-nudge': () => {
    Store.state.meta.backupNudgeSnoozeUntil = new Date(Date.now() + 7 * DAY).toISOString();
    Store.save(); App.refresh();
  },
  'export-full': () => doExport(true),
  'export-data': () => doExport(false),
  'export-csv': () => doExportCsv(),
  'restore': () => {
    const inp = $('#restore-file');
    if (!inp) return;
    inp.onchange = () => { if (inp.files && inp.files[0]) doRestore(inp.files[0]); inp.value = ''; };
    inp.click();
  },
  'erase-all': () => eraseAll(),
  'delete-premigrate-snapshots': () => {
    premigrateOffer().forEach(s => { try { localStorage.removeItem(s.key); } catch (e) {} });
    toast('Old snapshot deleted'); Pages.render();
  },
  'dismiss-premigrate-offer': () => {
    Store.state.meta.premigrateOfferDismissedAt = nowISO();
    Store.save(); Pages.render();
  },
  'drive-connect': () => Drive.connect(),
  'drive-sync': () => Drive.sync(true),
  'drive-disconnect': () => Drive.disconnect(),
  'export-quarantine': () => {
    const k = Store.state.meta.quarantineKey;
    let raw = null;
    try { raw = k && localStorage.getItem(k); } catch (e) {}
    if (raw) shareFile('tempo-quarantined.json', 'application/json', raw);
    else toast('No quarantined data found');
  }

};
document.addEventListener('input', e => { const t = e.target; if (t && t.dataset && t.dataset.wk) workoutInput(t); });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = Handlers[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});

/* ---------------- boot ---------------- */
/* ---------- themes (opt-in; 'classic' = the original look and the default) ---------- */
const THEMES = [
  { id: 'classic',  name: 'Classic',  note: 'The original terracotta & indigo', color: '#F7F0E8', sw: ['#F7F0E8', '#C96A3A', '#3E4DBA', '#9AA17B'] },
  { id: 'planner',  name: 'Planner',  note: 'Paper, ink blue and a red pen',    color: '#FBF9F4', sw: ['#FBF9F4', '#D4513D', '#2C5C8F', '#5E9C7C'] },
  { id: 'midnight', name: 'Midnight', note: 'Dark mode for late-night logging', color: '#13151F', sw: ['#13151F', '#F0905F', '#8E9CF2', '#A9B58A'] },
  { id: 'sage',     name: 'Sage',     note: 'Calm greens and clay',             color: '#EEF1E8', sw: ['#EEF1E8', '#B8704A', '#3F7A68', '#7F9A5C'] },
  { id: 'sunset',   name: 'Sunset',   note: 'Warm peach, plum and gold',        color: '#FDEEE6', sw: ['#FDEEE6', '#E0583A', '#B03A6E', '#D99A32'] }
];
function applyTheme() {
  try {
    const id = (Store.state && Store.state.settings && Store.state.settings.theme) || 'classic';
    const t = THEMES.find(x => x.id === id) || THEMES[0];
    const root = document.documentElement;
    if (t.id === 'classic') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t.id);
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t.color);
  } catch (e) {}
}
const App = {
  refresh() {
    applyTheme();
    renderDashboard();
    if (Pages.stack.length) Pages.render();
    setTimeout(achievementsCheck, 350);
  },
  actions: Actions, store: Store, pk: PK,
  exportData, Pages, Sheet, Dlg, Drive
};
window.App = App;

function installPwaBits() {
  /* optional companion service worker for offline (iOS needs a real file) */
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        reg.update().catch(() => {});
        /* a newer build finished downloading while the app was open */
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              Dlg.show({
                title: 'Update ready',
                msg: 'A newer version of the app has been downloaded. Reload now to use it? Your data is untouched.',
                buttons: [
                  { label: 'Reload', key: 'go', style: 'btn-primary' },
                  { label: 'Later', key: 'later', style: 'btn-ghost' }
                ]
              }).then(k => { if (k === 'go') { try { sw.postMessage('skipWaiting'); } catch (e) {} location.reload(); } });
            }
          });
        });
        /* check again whenever the app comes back to the foreground */
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) reg.update().catch(() => {});
        });
      }).catch(() => {});
    }
  } catch (e) {}
}
let lastDayKey = dateKey(new Date());
function boot() {
  Store.load();
  applyTheme();
  setTimeout(achievementsCheck, 900);
  renderTopbar();
  renderDashboard();
  installPwaBits();
  handleLegacyPhotos().catch(() => {});
  if (Store.corruptRecovered) {
    setTimeout(() => Dlg.show({
      title: 'Data recovered',
      msg: 'Stored data was corrupted and has been quarantined. The app restarted fresh — you can export the quarantined snapshot from Settings → About.',
      buttons: [{ label: 'OK', key: 'ok', style: 'btn-primary' }]
    }), 400);
  }
  if (Store.newerSchemaBlocked) {
    setTimeout(() => Dlg.show({
      title: 'Newer data found',
      msg: 'The data saved on this device was written by a newer version of Tempo and could not be opened here. Nothing was lost — it has been kept safely and the app started fresh. Update the app, or export the saved snapshot from Settings → About.',
      buttons: [{ label: 'OK', key: 'ok', style: 'btn-primary' }]
    }), 400);
  }
  if (Store.pendingPhotoPrompt) {
    const pp = Store.pendingPhotoPrompt;
    Store.pendingPhotoPrompt = null;
    setTimeout(() => {
      shareFile('tempo-legacy-photos-' + stamp() + '.json', 'application/json', JSON.stringify({
        photos: pp.photos, exportedAt: new Date().toISOString(),
        note: 'Progress Photos was removed from Tempo in v1.33. These were found embedded in your saved data and are preserved here exactly as they were.'
      })).then(() => toast(pp.count + ' photo(s) found in your saved data were exported to a file since Progress Photos is no longer part of the app'))
        .catch(() => toast(pp.count + ' photo(s) found in your saved data could not be auto-exported'));
    }, 700);
  }
  /* keep "days until" and shot-day state fresh */
  setInterval(() => {
    const k = dateKey(new Date());
    if (k !== lastDayKey) { lastDayKey = k; App.refresh(); }
  }, 60000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !Sheet.current) App.refresh();
  });
}
boot();
</script>
