<style>
:root{
  /* board: Terracotta #C96A3A · Indigo #3E4DBA · Dusty Rose #A55C7A · Sage #9AA17B · Cream #F7F0E8 */
  --bg:#F7F0E8; --surface:#FFFFFF; --surface2:#EFE6DA; --line:#E7DCCE;
  --text:#3A332B; --muted:#8D8374; --faint:#B5AA97;
  --coral:#C96A3A; --coral-soft:#F6E3D5; --coral-deep:#9A4E26;      /* terracotta */
  --teal:#3E4DBA; --teal-soft:#E4E6F8; --teal-deep:#2E3A96;         /* indigo */
  --pink:#A55C7A; --pink-soft:#F2E1E9; --pink-deep:#82425E;         /* dusty rose */
  --mint:#9AA17B; --mint-soft:#EBEDDE; --mint-deep:#6E7552;         /* sage */
  --lav:#8A4E68; --lav-soft:#F0E2E9; --lav-deep:#6D3A51;            /* plum — dusty rose, darkened */
  --peach:#6C79D6; --peach-soft:#E9EBFA; --peach-deep:#4553A8;      /* periwinkle — indigo, lightened */
  --shadow:0 10px 30px rgba(92,72,48,.09), 0 1px 3px rgba(92,72,48,.05);
  --shadow-sm:0 4px 14px rgba(92,72,48,.07), 0 1px 2px rgba(92,72,48,.04);
  --r-lg:26px; --r-md:20px; --r-sm:14px;
  --ease:cubic-bezier(.32,.72,.33,1);
  /* theme hooks — values below are the default look; html[data-theme=...] overrides them */
  --on-text:#fff; --glass:rgba(255,253,248,.7); --glass2:rgba(255,253,248,.45); --glass3:rgba(255,253,248,.72);
  --fade:rgba(246,243,237,0);
  --tint-coral:#FBF2EA; --tint-teal:#EFF1FB; --tint-mint:#F4F6EC; --tint-peach:#F2F3FC; --tint-week:#EDEFFA;
  --check-a:#FBEDE6; --check-b:#F9E4DA; --tile-coral-text:#7E3F1C; --tile-teal-text:#28348E;
  --warn-bg:#FBF0DC; --warn-fg:#8A6420; --err-bg:#FBE9E5; --err-fg:#B8432E;
  --trend:#8A5A33; --bandp:#5B7FA6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{height:100%}
body{
  background:var(--bg); color:var(--text); min-height:100dvh;
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative}
.screen{padding:0 18px calc(34px + env(safe-area-inset-bottom))}
.topbar{
  position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 18px 10px;
  background:linear-gradient(180deg,var(--bg) 72%,var(--fade));
}
.topbar .title{font-size:22px;font-weight:700;letter-spacing:-.02em;flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.topbar .title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo-img{width:24px;height:24px;border-radius:7px;display:block}
.logo-dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(160deg,#EE947A,#DE705C);flex:none;box-shadow:0 2px 6px rgba(222,112,92,.4)}
.tbtn{
  width:40px;height:40px;border-radius:14px;background:var(--surface);flex:none;
  box-shadow:var(--shadow-sm);display:grid;place-items:center;color:var(--text);
  transition:transform .18s var(--ease);
}
.tbtn:active{transform:scale(.92)}
.back-btn{display:flex;align-items:center;gap:2px;height:40px;padding:0 14px 0 8px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm);font-weight:600;font-size:15px;flex:none}
.back-btn:active{transform:scale(.95)}
.datebar{padding:2px 18px 14px;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600}
.pill.coral{background:var(--coral-soft);color:var(--coral-deep)}
.pill.teal{background:var(--teal-soft);color:var(--teal-deep)}
.pill.mint{background:var(--mint-soft);color:var(--mint-deep)}
.pill.pink{background:var(--pink-soft);color:var(--pink-deep)}
.pill.lav{background:var(--lav-soft);color:var(--lav-deep)}
.pill.peach{background:var(--peach-soft);color:var(--peach-deep)}
.pill.gray{background:var(--surface2);color:var(--muted)}

/* ---------- cards ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;position:relative}
.card.press{transition:transform .18s var(--ease)}
.card.press:active{transform:scale(.98)}
.card-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.card-head .dot{width:9px;height:9px;border-radius:50%;flex:none}
.card-head h3{font-size:16.5px;font-weight:700;letter-spacing:-.01em;flex:1}
.dot.coral{background:var(--coral)} .dot.teal{background:var(--teal)} .dot.pink{background:var(--pink)}
.dot.mint{background:var(--mint)} .dot.lav{background:var(--lav)} .dot.peach{background:var(--peach)}
.mini-add{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);color:var(--muted);transition:transform .15s var(--ease)}
.mini-add:active{transform:scale(.88)}
.chev-ico{color:var(--faint);flex:none}
.sec-label{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:22px 4px 10px}
.sec-label:first-child{margin-top:4px}

/* ---------- stats grid ---------- */
/* --- icon chips: soft colored containers giving each section its character --- */
.ichip{width:31px;height:31px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.ichip.coral{background:var(--coral-soft);color:var(--coral-deep)}
.ichip.teal{background:var(--teal-soft);color:var(--teal-deep)}
.ichip.pink{background:var(--pink-soft);color:var(--pink-deep)}
.ichip.mint{background:var(--mint-soft);color:var(--mint-deep)}
.ichip.lav{background:var(--lav-soft);color:var(--lav-deep)}
.ichip.peach{background:var(--peach-soft);color:var(--peach-deep)}
/* --- hero tiles (priority row) --- */
.tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.tile{border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:14px 15px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .18s var(--ease)}
.tile:active{transform:scale(.96)}
.tile .tk{font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px}
.tile .tv{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts{display:block;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.terra{background:linear-gradient(150deg,var(--coral-soft),var(--tint-coral))}
.tile.terra .tk,.tile.terra .ts{color:var(--coral-deep)}.tile.terra .tv{color:var(--tile-coral-text)}
.tile.indigo{background:linear-gradient(150deg,var(--teal-soft),var(--tint-teal))}
.tile.indigo .tk,.tile.indigo .ts{color:var(--teal-deep)}.tile.indigo .tv{color:var(--tile-teal-text)}
.tile .ring-txt{font-size:9.5px}
/* --- journey card --- */
.journey{background:linear-gradient(155deg,var(--mint-soft),var(--tint-mint))}
.jstats{display:flex;gap:6px;margin:10px 0 2px;flex-wrap:wrap}
.jstat{flex:1;min-width:70px;background:var(--glass3);border-radius:13px;padding:9px 10px}
.jstat b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--mint-deep)}
.jstat span{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.insight{display:flex;gap:9px;align-items:flex-start;padding:9px 2px;font-size:14px;line-height:1.45;color:var(--text)}
.insight+.insight{border-top:1px dashed var(--line)}
.insight .ii{flex:none;width:26px;height:26px;border-radius:9px;background:var(--mint-soft);color:var(--mint-deep);display:flex;align-items:center;justify-content:center;margin-top:-1px}
.recrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 2px}
.recrow+.recrow{border-top:1px solid var(--line)}
.recrow .rl{font-size:13.5px;color:var(--muted);font-weight:600}
.recrow .rv{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.recrow .rd{display:block;font-size:11.5px;color:var(--faint);font-weight:500;margin-top:1px}
/* --- dynamic today cards --- */
.todaycard{border-radius:var(--r-lg);padding:16px 17px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.todaycard.sympt{background:linear-gradient(150deg,var(--peach-soft),var(--tint-peach))}
.todaycard.week{background:linear-gradient(150deg,var(--teal-soft),var(--tint-week))}
.todaycard h3{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.todaycard p{font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.wkrow{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.wkrow:last-of-type{border-bottom:0}
.wkrow b{font-variant-numeric:tabular-nums}
.mgroup{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:14px 0 2px}
.mgroup:first-child{margin-top:0}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:14px 15px;transition:transform .18s var(--ease);min-height:86px;display:flex;flex-direction:column;justify-content:space-between}
.stat:active{transform:scale(.96)}
.stat .k{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .k .sdot{width:7px;height:7px;border-radius:50%;flex:none}
.stat .v{display:block;font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .s{display:block;font-size:12px;color:var(--faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- checklist ---------- */
.check-card{background:linear-gradient(150deg,var(--check-a),var(--check-b));border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.check-row{display:flex;align-items:center;gap:13px;padding:11px 2px;border-bottom:1px solid rgba(192,95,71,.1)}
.check-row:last-child{border-bottom:0}
.checkbox{width:27px;height:27px;border-radius:50%;border:2px solid rgba(192,95,71,.4);flex:none;display:grid;place-items:center;color:#fff;background:transparent;transition:all .2s var(--ease)}
.check-row.done .checkbox{background:var(--coral);border-color:var(--coral)}
.check-row .txt{flex:1;font-size:15.5px;font-weight:500;transition:color .2s,opacity .2s}
.check-row.done .txt{color:var(--coral-deep);opacity:.55;text-decoration:line-through}
.check-prog{font-size:13px;font-weight:700;color:var(--coral-deep)}

/* ---------- lists & rows ---------- */
.list{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--surface2);transition:background .15s}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface2)}
.row .rmain{flex:1;min-width:0}
.row .rtitle{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .rsub{font-size:13px;color:var(--muted);margin-top:2px}
.row .rside{text-align:right;flex:none}
.row .rval{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums}
.rnote{font-size:13px;color:var(--muted);margin-top:4px;background:var(--surface2);border-radius:10px;padding:7px 10px;white-space:pre-wrap;word-break:break-word}
.sev{display:inline-flex;gap:3px}
.sev i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.sev i.on{background:var(--peach)}
.badge-day{font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--muted);border-radius:7px;padding:2px 7px}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:51px;border-radius:16px;font-size:16px;font-weight:650;transition:transform .15s var(--ease),opacity .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45}
.btn-primary{background:var(--text);color:var(--on-text);box-shadow:0 6px 18px rgba(56,50,44,.25)}
.btn-tonal{background:var(--surface2);color:var(--text)}
.btn-ghost{background:transparent;color:var(--muted);height:44px}
.btn-danger{background:var(--err-bg);color:var(--err-fg)}
.btn-sm{height:40px;font-size:14.5px;border-radius:13px;width:auto;padding:0 16px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

/* ---------- forms ---------- */
.f-label{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:16px 2px 7px;display:block}
.f-label:first-child{margin-top:0}
.field{width:100%;background:var(--surface2);border:1.5px solid transparent;border-radius:var(--r-sm);padding:13px 14px;font-size:16px;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none;color:var(--text)}
.field:focus{border-color:var(--faint);background:var(--surface)}
textarea.field{resize:vertical;min-height:74px;font-family:inherit}
select.field{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238E857A' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:38px}
.f-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f-hint{font-size:12.5px;color:var(--faint);margin:7px 3px 0;line-height:1.45}
input[type="datetime-local"].field,input[type="time"].field{min-height:49px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 15px;border-radius:999px;background:var(--surface2);font-size:14.5px;font-weight:600;color:var(--text);border:1.5px solid transparent;transition:all .15s var(--ease)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--text);color:var(--on-text)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.sitegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sitebtn{padding:13px 10px;border-radius:var(--r-sm);background:var(--surface2);font-size:14px;font-weight:600;border:1.5px solid transparent;position:relative;text-align:center;transition:all .15s var(--ease)}
.sitebtn.on{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-deep)}
.sitebtn .tag{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:3px;color:var(--faint)}
.sitebtn.on .tag{color:var(--coral)}
/* severity */
.sevpick{display:flex;gap:8px}
.sevbtn{flex:1;height:48px;border-radius:var(--r-sm);background:var(--surface2);font-weight:700;font-size:16px;border:1.5px solid transparent;transition:all .15s var(--ease)}
.sevbtn.on{background:var(--peach-soft);border-color:var(--peach);color:var(--peach-deep)}

/* ---------- hero blocks ---------- */
.hero{display:flex;align-items:center;gap:18px}
.hero-num{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.hero-num small{font-size:19px;font-weight:700;color:var(--muted);letter-spacing:0}
.hero-sub{font-size:13.5px;color:var(--muted);margin-top:4px}
.delta{font-weight:700}
.delta.down{color:var(--mint-deep)} .delta.up{color:var(--coral-deep)} .delta.flat{color:var(--muted)}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--surface2);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums;font-weight:700}
.kv span{color:var(--muted)}
.progressbar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:10px}
.progressbar i{display:block;height:100%;border-radius:99px;transition:width .5s var(--ease)}

/* ---------- charts ---------- */
.chartwrap{margin:6px -4px 2px}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.chart-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.5}
.empty .big{font-size:30px;margin-bottom:8px}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 14px}
.cal-head b{font-size:18px;letter-spacing:-.01em}
.cal-nav{width:38px;height:38px;border-radius:13px;background:var(--surface);box-shadow:var(--shadow-sm);display:grid;place-items:center}
.cal-nav:active{transform:scale(.9)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;font-size:11.5px;font-weight:700;color:var(--faint);padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.cal-cell{aspect-ratio:1/1.12;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;position:relative;transition:all .15s var(--ease)}
.cal-cell.day{background:var(--surface);box-shadow:var(--shadow-sm)}
.cal-cell.day:active{transform:scale(.9)}
.cal-cell.today{outline:2px solid var(--text);outline-offset:-2px}
.cal-cell.sel{background:var(--text);color:var(--on-text)}
.cal-dots{display:flex;gap:3px;height:5px}
.cal-dots i{width:5px;height:5px;border-radius:50%}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:16px 4px 0;font-size:12.5px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:7px;height:7px;border-radius:50%}

/* ---------- photos ---------- */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pcell{aspect-ratio:3/4;border-radius:15px;overflow:hidden;position:relative;background:var(--surface2);transition:transform .15s var(--ease)}
.pcell:active{transform:scale(.95)}
.pcell img{width:100%;height:100%;object-fit:cover}
.pcell .pdate{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;font-size:10.5px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(30,20,15,.55));text-align:center}
.pcell.selmode::after{content:"";position:absolute;inset:0;border-radius:15px;border:2.5px solid transparent}
.pcell.selected::after{border-color:var(--lav)}
.pcell .selnum{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--lav);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.pstrip{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pstrip::-webkit-scrollbar{display:none}
.pstrip .pcell{flex:none;width:88px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare img{width:100%;border-radius:15px;aspect-ratio:3/4;object-fit:cover;background:var(--surface2)}
.compare .cinfo{text-align:center;font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5}
.compare .cinfo b{display:block;color:var(--text);font-size:14px}
.photoview img{width:100%;border-radius:18px;background:var(--surface2)}

/* ---------- pages ---------- */
.page{
  position:fixed;inset:0;margin:0 auto;max-width:520px;background:var(--bg);z-index:20;
  transform:translateX(105%);transition:transform .26s var(--ease);
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.page.in{transform:translateX(0)}
.page-body{padding:2px 18px calc(40px + env(safe-area-inset-bottom))}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(45,36,28,.38);opacity:0;transition:opacity .24s}
.sheet-wrap.in .sheet-back{opacity:1}
.sheet{
  position:relative;width:100%;max-width:520px;background:var(--bg);border-radius:28px 28px 0 0;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:90dvh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  transform:translateY(102%);transition:transform .28s var(--ease);box-shadow:0 -12px 40px rgba(60,48,38,.18);
}
.sheet-wrap.in .sheet{transform:translateY(0)}
.grab{width:38px;height:5px;border-radius:99px;background:var(--line);margin:2px auto 14px}
.sheet h2{font-size:20px;font-weight:750;letter-spacing:-.02em;margin-bottom:4px}
.sheet .sheet-sub{font-size:13.5px;color:var(--muted);margin-bottom:10px}
.sheet-actions{margin-top:22px;display:flex;flex-direction:column;gap:9px}

/* ---------- dialog / toast ---------- */
.dlg-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:28px}
.dlg-back{position:absolute;inset:0;background:rgba(45,36,28,.42);opacity:0;transition:opacity .2s}
.dlg{position:relative;width:100%;max-width:330px;background:var(--surface);border-radius:22px;padding:22px 20px 16px;text-align:center;transform:scale(.92);opacity:0;transition:all .2s var(--ease);box-shadow:0 20px 60px rgba(50,40,30,.3)}
.dlg-wrap.in .dlg-back{opacity:1}
.dlg-wrap.in .dlg{transform:scale(1);opacity:1}
.dlg h4{font-size:17px;font-weight:750;margin-bottom:7px}
.dlg p{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:16px;white-space:pre-line}
.dlg .btn{height:46px;font-size:15px;margin-bottom:8px}
.dlg .btn:last-child{margin-bottom:0}
#toasts{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--text);color:var(--on-text);font-size:14px;font-weight:600;padding:11px 19px;border-radius:999px;box-shadow:0 8px 24px rgba(40,32,26,.3);opacity:0;transform:translateY(12px);transition:all .25s var(--ease);max-width:86%;text-align:center}
.toast.in{opacity:1;transform:translateY(0)}

/* ---------- misc ---------- */
.ring-wrap{position:relative;flex:none}
.ring-txt{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.banner{border-radius:var(--r-md);padding:13px 15px;font-size:13.5px;line-height:1.5;margin-bottom:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn-fg)}
.banner.err{background:var(--err-bg);color:var(--err-fg)}
.footnote{font-size:12px;color:var(--faint);line-height:1.55;margin:14px 6px 0}
.divider{height:1px;background:var(--surface2);margin:14px 0}
.iconbtn-sm{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);color:var(--muted);flex:none}
.iconbtn-sm:active{transform:scale(.88)}
.tag-last{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--lav-deep);background:var(--lav-soft);border-radius:6px;padding:2px 6px;text-transform:uppercase}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;z-index:2;margin:0}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.switch input:checked + i{background:var(--mint)}
.switch input:checked + i::after{transform:translateX(20px)}
.setrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--surface2)}
.setrow:last-child{border-bottom:0}
.setrow .smain{flex:1;min-width:0}
.setrow .stitle{font-size:15.5px;font-weight:600}
.setrow .ssub{font-size:12.5px;color:var(--muted);margin-top:1px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fadeup{animation:fadeup .3s var(--ease)}

/* ---------- opt-in themes (default look = :root above; chosen in Settings → Appearance) ---------- */
html[data-theme="planner"]{
  --bg:#FBF9F4; --surface:#FFFFFF; --surface2:#F1EEE6; --line:#E2DDCF;
  --text:#1F2A3A; --muted:#6B7482; --faint:#A7ABB3;
  --coral:#D4513D; --coral-soft:#FBE4DF; --coral-deep:#A63A2A;
  --teal:#2C5C8F; --teal-soft:#E1ECF7; --teal-deep:#1E4571;
  --pink:#C2577F; --pink-soft:#F8E3EB; --pink-deep:#963B5E;
  --mint:#5E9C7C; --mint-soft:#E2F1E8; --mint-deep:#3F7558;
  --lav:#6E5BA0; --lav-soft:#ECE7F6; --lav-deep:#51407D;
  --peach:#4F88BE; --peach-soft:#E3EEF8; --peach-deep:#35679A;
  --shadow:0 1px 0 rgba(31,42,58,.04), 0 6px 18px rgba(31,42,58,.06); --shadow-sm:0 1px 0 rgba(31,42,58,.04), 0 3px 10px rgba(31,42,58,.05);
  --glass:rgba(255,255,255,.72); --glass2:rgba(255,255,255,.5); --glass3:rgba(255,255,255,.74); --fade:rgba(251,249,244,0);
  --tint-coral:#FDF1EE; --tint-teal:#EFF5FB; --tint-mint:#F0F7F3; --tint-peach:#EFF5FB; --tint-week:#EBF2FA;
  --check-a:#FCE9E4; --check-b:#FADDD6; --tile-coral-text:#8E3022; --tile-teal-text:#1B3F66;
  --warn-bg:#FFF3D6; --warn-fg:#8A6420; --err-bg:#FCE8E4; --err-fg:#B23A28; --trend:#8A5A33; --bandp:#4F88BE;
}
html[data-theme="planner"] body{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(44,92,143,.06) 31px,rgba(44,92,143,.06) 32px);background-attachment:fixed}
html[data-theme="planner"] .card{border:1px solid var(--line)}
html[data-theme="planner"] .topbar .title,html[data-theme="planner"] .sheet h2,html[data-theme="planner"] .tile .tv{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif}

html[data-theme="midnight"]{
  color-scheme:dark;
  --bg:#13151F; --surface:#1C1F2D; --surface2:#262A3B; --line:#2F3447;
  --text:#ECE8E0; --muted:#A0A1B5; --faint:#6F7390;
  --coral:#F0905F; --coral-soft:#3B2B28; --coral-deep:#F6AE88;
  --teal:#8E9CF2; --teal-soft:#242A4A; --teal-deep:#AEB9F8;
  --pink:#E58BAA; --pink-soft:#3D2733; --pink-deep:#F0A8C0;
  --mint:#A9B58A; --mint-soft:#2A3025; --mint-deep:#C0CBA3;
  --lav:#D08AAE; --lav-soft:#3A2634; --lav-deep:#E3A8C6;

}

.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme-opt{border:2px solid var(--line);border-radius:16px;padding:9px;text-align:left;background:var(--surface);display:block;width:100%}
.theme-opt.on{border-color:var(--text)}
.theme-opt .sw{display:flex;height:34px;border-radius:10px;overflow:hidden;margin-bottom:7px;border:1px solid rgba(0,0,0,.06)}
.theme-opt .sw i{flex:1}
.theme-opt b{display:block;font-size:14px}
.theme-opt small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:1px}

/* ---------- Dose Story (full-screen swipeable recap) ---------- */
#story{position:fixed;inset:0;margin:0 auto;max-width:520px;z-index:30;display:flex;flex-direction:column;background:var(--bg)}
#story .st-bars{display:flex;gap:4px;padding:calc(12px + env(safe-area-inset-top)) 14px 0;position:relative;z-index:3}
#story .st-bars i{flex:1;height:3.5px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
#story .st-bars i.done,#story .st-bars i.cur{background:var(--text)}
#story .st-bars i.cur{opacity:.55}
#story .st-close{position:absolute;right:12px;top:calc(22px + env(safe-area-inset-top));z-index:4;width:34px;height:34px;border-radius:50%;background:var(--glass);display:grid;place-items:center;font-size:18px;font-weight:700}
#story .st-card{flex:1;margin:12px 14px calc(18px + env(safe-area-inset-bottom));border-radius:30px;padding:34px 26px;display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
#story .st-card>*{animation:stIn .5s var(--ease) both}
#story .st-card>*:nth-child(2){animation-delay:.07s}#story .st-card>*:nth-child(3){animation-delay:.14s}#story .st-card>*:nth-child(4){animation-delay:.21s}#story .st-card>*:nth-child(5){animation-delay:.28s}
@keyframes stIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#story .st-emoji{font-size:54px;line-height:1;margin-bottom:14px}
#story .st-kicker{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
#story .st-big{font-size:clamp(40px,14vw,64px);font-weight:850;letter-spacing:-.035em;line-height:1.02;margin:14px 0 10px;font-variant-numeric:tabular-nums;word-break:break-word}
#story .st-sub{font-size:17px;font-weight:600;line-height:1.4}
#story .st-foot{font-size:13.5px;opacity:.72;margin-top:16px;line-height:1.45}
#story .st-lines{margin-top:6px;text-align:left;display:inline-block;align-self:center}
#story .st-lines div{font-size:17px;font-weight:650;padding:5px 0}
#story .st-lines b{font-weight:850;font-variant-numeric:tabular-nums}
#story .st-tap{position:absolute;top:0;bottom:0;z-index:2;background:none}
#story .st-tap.l{left:0;width:34%}#story .st-tap.r{right:0;width:66%}
#story .st-cta{position:relative;z-index:4;margin-top:22px;align-self:center}
.st-coral{background:linear-gradient(160deg,var(--coral-soft),var(--surface));color:var(--coral-deep)}
.st-teal{background:linear-gradient(160deg,var(--teal-soft),var(--surface));color:var(--teal-deep)}
.st-mint{background:linear-gradient(160deg,var(--mint-soft),var(--surface));color:var(--mint-deep)}
.st-lav{background:linear-gradient(160deg,var(--lav-soft),var(--surface));color:var(--lav-deep)}
.st-peach{background:linear-gradient(160deg,var(--peach-soft),var(--surface));color:var(--peach-deep)}
.st-pink{background:linear-gradient(160deg,var(--pink-soft),var(--surface));color:var(--pink-deep)}

/* ---------- Journey Bingo ---------- */
.bingo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bsq{aspect-ratio:1/1;border-radius:16px;background:var(--surface2);border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;text-align:center;position:relative;transition:transform .15s var(--ease)}
.bsq:active{transform:scale(.95)}
.bsq .be{font-size:24px;line-height:1;filter:grayscale(1);opacity:.45}
.bsq .bt{font-size:10.5px;font-weight:700;line-height:1.15;color:var(--muted)}
.bsq.done{background:linear-gradient(150deg,var(--mint-soft),var(--surface));border:2px solid var(--mint)}
.bsq.done .be{filter:none;opacity:1}
.bsq.done .bt{color:var(--mint-deep)}
.bsq.line{border-color:var(--coral);background:linear-gradient(150deg,var(--coral-soft),var(--surface));box-shadow:0 0 0 3px var(--coral-soft)}
.bsq.line .bt{color:var(--coral-deep)}
.bsq .bnew{position:absolute;top:-6px;right:-4px;background:var(--coral);color:var(--on-text);font-size:9px;font-weight:800;padding:2px 6px;border-radius:999px}
.bingo-head{display:flex;gap:10px;margin-bottom:12px}
.bingo-head .jstat{text-align:center;background:var(--surface);box-shadow:var(--shadow-sm)}

/* ---------- celebration overlay ---------- */
#celebrate{position:fixed;inset:0;z-index:65;display:grid;place-items:center;padding:28px;background:rgba(30,22,16,.55);overflow:hidden}
#celebrate .cel-card{position:relative;z-index:2;background:var(--surface);border-radius:28px;padding:30px 24px 22px;text-align:center;max-width:340px;width:100%;box-shadow:var(--shadow);animation:celPop .5s var(--ease) both}
#celebrate .cel-emoji{font-size:64px;line-height:1;margin-bottom:10px}
#celebrate .cel-kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--coral-deep)}
#celebrate .cel-title{font-size:23px;font-weight:850;letter-spacing:-.02em;margin:8px 0 6px}
#celebrate .cel-sub{font-size:14.5px;color:var(--muted);line-height:1.45}
#celebrate .cel-more{margin-top:14px;display:flex;flex-direction:column;gap:6px}
#celebrate .cel-more div{font-size:13.5px;font-weight:650;background:var(--surface2);border-radius:12px;padding:7px 10px}
#celebrate .cel-note{margin-top:14px;background:var(--coral-soft);color:var(--coral-deep);border-radius:14px;padding:11px 12px;font-size:14px;text-align:left;line-height:1.45}
#celebrate .confetti{position:absolute;top:-24px;width:9px;height:15px;border-radius:2px;opacity:0;animation:confFall linear forwards}
@keyframes confFall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:.9;transform:translateY(110vh) rotate(720deg)}}
@keyframes celPop{from{opacity:0;transform:scale(.85) translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#celebrate .confetti{display:none}#celebrate .cel-card{animation:none}}
/* ---------- badges ---------- */
.bdg{display:flex;gap:12px;align-items:center;padding:12px 14px}
.bdg .be{font-size:30px;line-height:1;flex:none;width:40px;text-align:center}
.bdg.t0 .be{filter:grayscale(1);opacity:.4}
.bdg .bm{flex:1;min-width:0}
.bdg .bn{font-weight:750;font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bdg .bs{font-size:12.5px;color:var(--muted);margin-top:2px}
.bdg-bar{height:6px;border-radius:6px;background:var(--surface2);margin-top:7px;overflow:hidden}
.bdg-bar i{display:block;height:100%;border-radius:6px;background:var(--mint)}
.tier{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tier.g1{background:#EBD7C4;color:#7A4A22}.tier.g2{background:#E3E5EA;color:#4B5565}.tier.g3{background:#F6E3A8;color:#7A5A06}
/* ---------- then & now ---------- */
.tn{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;padding:14px 10px}
.tn .tl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tn .tv2{font-size:26px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px}
.tn .tv2 small{font-size:13px;font-weight:650;color:var(--muted)}
.tn .ts2{font-size:12px;color:var(--muted);margin-top:2px}
.tn .ar{font-size:20px;color:var(--faint)}
.tn-lab{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 4px 6px}
/* ---------- goal road ---------- */
.road{position:relative;padding-left:6px}
.rd-node{display:flex;gap:14px;position:relative;padding-bottom:18px}
.rd-node:not(:last-child)::before{content:"";position:absolute;left:17px;top:36px;bottom:0;width:3px;border-radius:3px;background:var(--line)}
.rd-node.reached:not(:last-child)::before{background:var(--mint)}
.rd-dot{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface2);color:var(--muted);border:2px solid var(--line);z-index:1}
.rd-node.reached .rd-dot{background:var(--mint);color:var(--on-text);border-color:var(--mint)}
.rd-node.next .rd-dot{background:var(--coral-soft);color:var(--coral-deep);border-color:var(--coral);box-shadow:0 0 0 4px var(--coral-soft)}
.rd-body{flex:1;min-width:0;padding-top:2px}
.rd-title{font-weight:800;font-size:16px}
.rd-sub{font-size:13px;color:var(--muted);margin-top:1px}
.rd-note{margin-top:8px;padding:9px 11px;border-radius:12px;background:var(--coral-soft);color:var(--coral-deep);font-size:14px;line-height:1.45}
.rd-note.sealed{background:var(--surface2);color:var(--muted)}
.rd-body .btn{margin-top:8px}
</style>

const PK = {
  halfLifeDays: 5,      // elimination half-life ~5 days (~120 h)
  ka: 3.36,             // /day absorption rate -> tmax ~= 24 h
  F: 0.80,              // subcutaneous bioavailability
  get ke() { return Math.LN2 / this.halfLifeDays; },
  contribution(doseMg, days) {
    if (days < 0 || days > 60) return 0;
    const ke = this.ke, ka = this.ka;
    const v = doseMg * this.F * (ka / (ka - ke)) * (Math.exp(-ke * days) - Math.exp(-ka * days));
    return v > 0 ? v : 0;
  },
  totalAt(injections, when) {
    const t = typeof when === 'number' ? when : when.getTime();
    let s = 0;
    for (const inj of injections) {
      const days = (t - new Date(inj.dateTime).getTime()) / DAY;
      s += this.contribution(inj.doseMg, days);
    }
    return s;
  },
  peakInfo(injections, fromMs, horizonDays) {
    horizonDays = horizonDays || 10;
    let peak = 0, at = fromMs;
    for (let t = fromMs; t <= fromMs + horizonDays * DAY; t += 2 * 3600000) {
      const v = this.totalAt(injections, t);
      if (v > peak) { peak = v; at = t; }
    }
    return { peak: peak, at: at };
  }
};

  let delta = (weekday - d.getDay() + 7) % 7;

  d.setDate(d.getDate() + delta);

  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(null);

  const out = {};

  return {
    weekNo: weeksSinceStart(now),

  const latestDateKeyOf = list => list.reduce((m, x) => { const k = dateKey(x.dateTime); return (!m || k > m) ? k : m; }, null);

    triggerDate: latestDateKeyOf(vomit)

}

    .map(periodLengthDays).filter(n => n != null && n > 0).slice(-4);

  now = now || new Date();
  const cycles = Store.state.cycles.slice().sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
  if (cycles.length < 2) return { show: cycles.length >= 1, starts: cycles, cycleDay: cycles.length ? daysBetween(new Date(cycles[cycles.length - 1].startDate), now) + 1 : null, predicted: null };
  const last = cycles[cycles.length - 1];

/* -------- Vial & Supply --------
   A vial holds a total mg amount, not a fixed per-dose strength — injections draw whatever
   mg was actually dosed that day, oldest-eligible-vial first, spilling into the next vial if
   one runs short mid-injection. A vial can only cover injections from on/after the date it was
   added — an injection taken before you had the vial can never draw from it, so adding a new
   vial today never retroactively "eats" your older, already-unaccounted doses. */
function vialConsumption() {
  const vials = Store.state.vials.slice().sort((a, b) => new Date(a.addedDate) - new Date(b.addedDate));
  const remaining = {};
  vials.forEach(v => remaining[v.id] = +v.totalMg || 0);

  vials.forEach(v => vialDay[v.id] = dateKey(v.addedDate));

    let need = +i.doseMg || 0;
    for (const v of vials) {
      if (need <= 0) break;
      if (vialDay[v.id] > ik) continue; /* vial didn't exist yet on the day of the injection */
      if (remaining[v.id] <= 0) continue;
      const take = Math.min(remaining[v.id], need);
      remaining[v.id] -= take; need -= take;
    }
    if (need > 0) unaccountedMg += need;

    vials: vials.map(v => Object.assign({}, v, { mgLeft: Math.round(Math.max(0, remaining[v.id]) * 100) / 100 })),
    unaccountedMg: Math.round(unaccountedMg * 100) / 100

function vialReorderInfo(now) {
  now = now || new Date();

  const set = Store.state.settings;
  const recent = injectionsSorted(false).slice(-6);
  let mgPerDay = null;
  if (recent.length >= 2) {
    const spanDays = daysBetween(new Date(recent[0].dateTime), new Date(recent[recent.length - 1].dateTime));
    const totalMg = recent.reduce((a, i) => a + (+i.doseMg || 0), 0);
    if (spanDays > 0) mgPerDay = totalMg / spanDays;
  }
  const mgLeft = Math.round(vials.reduce((a, v) => a + v.mgLeft, 0) * 100) / 100;
  if (!mgLeft || !mgPerDay) return { mgLeft, vials, unaccountedMg, mgPerDay, reorderBy: null };
  const daysOfSupply = mgLeft / mgPerDay;
  const reorderBy = new Date(now.getTime() + Math.max(0, daysOfSupply - set.reorderLeadDays) * DAY);

}
/* dashboard note when tracked vial content is about to run short — silent unless vials are being

function vialSupplyNote(now) {

  const li = lastInjection();
  if (!li || daysBetween(new Date(li.dateTime), now) > 21) return null;
  const info = vialReorderInfo(now);
  if (info.mgLeft <= 0) return 'Your tracked vials are used up — add a new vial (or reorder) before your next shot.';
  const nextDose = doseForDate(nextInjectionDate(now, set.weekday, set.time));
  if (nextDose && info.mgLeft < nextDose) return 'Your vials have ' + fmtMg(info.mgLeft) + ' mg left — less than your next ' + fmtMg(nextDose) + ' mg dose.';
  if (info.mgPerDay) {
    const days = Math.floor(info.mgLeft / info.mgPerDay);
    if (days <= set.reorderLeadDays) return 'At your current pace your vials last about ' + days + ' more day' + (days === 1 ? '' : 's') + ' — worth reordering now.';
  }
  return null;
}
/* gentle reminder that data only lives on this device: shown when there's data and no backup

function backupNudge(now) {
  now = now || new Date();

  if (!(s.injections.length || s.weights.length || s.checkIns.length)) return null;
  if (m.backupNudgeSnoozeUntil && new Date(m.backupNudgeSnoozeUntil) > now) return null;
  const stamps = [m.lastBackupAt, s.settings.drive && s.settings.drive.enabled ? s.settings.drive.lastSync : null]

/* -------- Dose Journey / Future Plan / Budget -------- */
function suggestPlanLinks() {
  return Store.state.dosePlans.filter(p => !p.linkedInjectionId).map(p => {
    const startT = new Date(p.startDate).getTime(), endT = p.endDate ? new Date(p.endDate).getTime() : Infinity;
    const match = Store.state.injections.find(i => +i.doseMg === +p.doseMg && new Date(i.dateTime).getTime() >= startT && new Date(i.dateTime).getTime() <= endT);

/* actual spend logged within [startDate, endDate) — a vial's cost only counts if the vial was

function spendForPeriod(startDate, endDate) {
  const startT = new Date(startDate).getTime(), endT = endDate ? new Date(endDate).getTime() : Infinity;
  const spends = Store.state.spends.filter(s => { const t = new Date(s.date).getTime(); return t >= startT && t < endT; });
  const spendTotal = spends.reduce((a, s) => a + (+s.amount || 0), 0);
  const countedVials = Store.state.vials.filter(v => v.countsTowardPlan && v.costAmount != null && (() => { const t = new Date(v.addedDate).getTime(); return t >= startT && t < endT; })());
  const vialTotal = countedVials.reduce((a, v) => a + (+v.costAmount || 0), 0);

function doseBudgetBreakdown() {
  const periods = dosePeriods();

    const sp = spendForPeriod(p.startDate, p.endDate);
    return { period: p, actual: sp.actual, spendN: sp.n, vialN: sp.vialN };
  });
  const byDose = new Map();
  perPeriod.forEach(x => {
    const k = +x.period.doseMg;
    if (!byDose.has(k)) byDose.set(k, { doseMg: k, actual: 0, periods: 0 });
    const e = byDose.get(k);

/* -------- Calendar Export (.ics) -------- */
function icsDate(d) { d = new Date(d); return d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) + 'T' + pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + 'Z'; }

   never a future plan's dose applied to an earlier event */
function doseForDate(d) {
  const t = +new Date(d);

    .filter(p => new Date(p.startDate).getTime() <= t)
    .sort((a, b) => new Date(b.startDate) - new Date(a.startDate))[0];

function generateIcs() {
  const set = Store.state.settings, now = new Date();
  const seqMap = Store.state.meta.icsSeq = Store.state.meta.icsSeq || {};
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Tempo//EN', 'CALSCALE:GREGORIAN'];
  function addEvent(uidKey, dtstart, summary, alarms) {
    const fp = fnv1a(dtstart.toISOString() + '|' + summary);
    const prev = seqMap[uidKey];
    const seq = (prev && prev.fp === fp) ? prev.seq : (prev ? prev.seq + 1 : 0);
    seqMap[uidKey] = { fp, seq };
    lines.push('BEGIN:VEVENT', 'UID:' + uidKey + '@tempo-app', 'SEQUENCE:' + seq, 'DTSTAMP:' + icsDate(now),
      'DTSTART:' + icsDate(dtstart), 'DTEND:' + icsDate(new Date(dtstart.getTime() + 15 * 60000)), 'SUMMARY:' + icsEsc(summary));
    (alarms || []).forEach(a => lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(a.desc), 'TRIGGER:' + a.trigger, 'END:VALARM'));
    lines.push('END:VEVENT');
  }
  let d = nextInjectionDate(now, set.weekday, set.time);
  for (let i = 0; i < 12; i++) {
    const doseMg = doseForDate(d);
    addEvent('t-dose-' + dateKey(d), d, 'Planned dose' + (doseMg ? ' – ' + fmtMg(doseMg) + ' mg' : ''),
      [{ desc: 'Injection tomorrow', trigger: '-P1D' }, { desc: 'Injection now', trigger: 'PT0M' }]);
    d = new Date(d.getTime() + 7 * DAY);
  }
  if (set.measurementIntervalDays) {
    const lastM = Store.state.measurements.slice().sort((a, b) => new Date(b.dateTime) - new Date(a.dateTime))[0];
    let md = new Date((lastM ? new Date(lastM.dateTime).getTime() : now.getTime()) + set.measurementIntervalDays * DAY);
    for (let i = 0; i < 6; i++) {
      addEvent('t-meas-' + dateKey(md), md, 'Body measurements reminder', [{ desc: 'Measurement reminder', trigger: 'PT0M' }]);
      md = new Date(md.getTime() + set.measurementIntervalDays * DAY);
    }
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

/* ---------------- legacy PhotoDB (removal support only) ----------------
   Progress Photos is gone as a feature in v1.33 — no add/view/compare UI,
   nothing in dashboard/calendar/backup/sync touches it any more. This
   trimmed-down object exists ONLY to let a device that still has photos
   from before the upgrade export them (never silently discard) and then
   clear the store once. See handleLegacyPhotos() in the boot sequence. */
const PhotoDB = {
  db: null, available: false,
  open() {
    return new Promise((res) => {
      if (typeof indexedDB === 'undefined') return res(false);
      let req;
      try { req = indexedDB.open(LEGACY_PREFIX + 'photos', 1); } catch (e) { return res(false); }
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('full')) db.createObjectStore('full', { keyPath: 'id' });
      };
      req.onsuccess = e => { PhotoDB.db = e.target.result; PhotoDB.available = true; res(true); };
      req.onerror = () => res(false);
      req.onblocked = () => res(false);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      if (!this.db) return rej(new Error('Photo storage unavailable'));
      const t = this.db.transaction(store, mode);
      const s = t.objectStore(store);
      let out;
      try { out = fn(s); } catch (e) { return rej(e); }
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('aborted'));
    });
  },
  allMeta() {
    return new Promise((res, rej) => {
      if (!this.db) return res([]);
      const t = this.db.transaction('meta', 'readonly');
      const req = t.objectStore('meta').getAll();
      req.onsuccess = () => res(req.result || []);
      req.onerror = () => rej(req.error);
    });
  },
  getFull(id) {
    return new Promise((res, rej) => {
      if (!this.db) return rej(new Error('unavailable'));
      const t = this.db.transaction('full', 'readonly');
      const req = t.objectStore('full').get(id);
      req.onsuccess = () => res(req.result ? req.result.blob : null);
      req.onerror = () => rej(req.error);
    });
  },
  clearAll() {
    return this.tx('meta', 'readwrite', s => s.clear())
      .then(() => this.tx('full', 'readwrite', s => s.clear()));
  }
};
let legacyPhotoCount = 0;
async function exportLegacyPhotosNow() {
  if (!PhotoDB.available) return toast('No legacy photos found');
  let metas = [];
  try { metas = await PhotoDB.allMeta(); } catch (e) {}
  if (!metas.length) return toast('No legacy photos found');
  toast('Preparing export…');
  const photos = [];
  for (const m of metas) {
    try {
      const full = await PhotoDB.getFull(m.id);
      photos.push({
        id: m.id, dateTime: m.dateTime, note: m.note || '', weightKg: m.weightKg || null,
        thumbData: m.thumb ? await blobToDataURL(m.thumb) : null,
        fullData: full ? await blobToDataURL(full) : null
      });
    } catch (e) {}
  }
  try {
    await shareFile('tempo-legacy-photos-' + stamp() + '.json', 'application/json', JSON.stringify({ photos, exportedAt: new Date().toISOString() }));
    toast('Exported ' + photos.length + ' photo(s)');
  } catch (e) { toast('Export failed'); }
}
async function clearLegacyPhotosNow() {
  if (!await confirmDlg('Delete these photos from this device?', 'This only removes the old on-device photo storage — export them first if you want to keep them.', 'Delete', true)) return;
  try { await PhotoDB.clearAll(); } catch (e) {}
  legacyPhotoCount = 0;
  Pages.popAll(); App.refresh();
  toast('Legacy photos removed from this device');
}
/* Progress Photos has no UI any more, but a device upgraded from an older version may still have
   photos sitting in IndexedDB from before. We never want those to just vanish unexplained, so once
   per device we tell the person plainly and offer to export them; after that, the same option stays
   reachable from Settings → About for as long as anything is still stored. */
async function handleLegacyPhotos() {
  let ok = false;
  try { ok = await PhotoDB.open(); } catch (e) {}
  if (!ok) return;
  let metas = [];
  try { metas = await PhotoDB.allMeta(); } catch (e) {}
  legacyPhotoCount = metas.length;
  if (!metas.length) return;
  renderDashboard();
  if (Pages.stack.length) Pages.render();
  if (Store.state.meta.photoPromptHandled) return;
  Store.state.meta.photoPromptHandled = true;
  Store.save();
  setTimeout(() => {
    Dlg.show({
      title: 'Progress Photos removed',
      msg: metas.length + ' photo' + (metas.length === 1 ? '' : 's') + ' from before this update ' + (metas.length === 1 ? 'is' : 'are') +
        ' still stored on this device. Progress Photos is no longer part of the app, but nothing has been deleted — export ' + (metas.length === 1 ? 'it' : 'them') + ' now, or do it later from Settings → About.',
      dismissable: true,
      buttons: [
        { label: 'Export now', key: 'export', style: 'btn-primary' },
        { label: 'Later', key: 'later', style: 'btn-ghost' }
      ]
    }).then(k => { if (k === 'export') exportLegacyPhotosNow(); });
  }, 500);
}

/* ---------------- UI kit ---------------- */
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  $('#toasts').appendChild(t);
  requestAnimationFrame(() => t.classList.add('in'));
  setTimeout(() => { t.classList.remove('in'); setTimeout(() => t.remove(), 300); }, 2300);
}

/* history integration: hardware/edge back closes sheets & pages */
const Nav = {
  expectedPops: 0,
  push() { try { history.pushState({ app: 1 }, ''); } catch (e) {} },
  consume() { this.expectedPops++; try { history.back(); } catch (e) { this.expectedPops--; } }
};
window.addEventListener('popstate', () => {
  if (Nav.expectedPops > 0) { Nav.expectedPops--; return; }
  if (Dlg.current) { Dlg.current.resolve(null); return; }
  if (Sheet.current) { Sheet.current.close(true); return; }
  if (Pages.stack.length) { Pages.pop(true); }
});

const Pages = {
  stack: [],
  push(opts) { /* {title, color, render(body,page), right} */
    const page = document.createElement('div');
    page.className = 'page';
    page.innerHTML =
      '<div class="topbar">' +
      '<button class="back-btn" data-act="page-back">' + ic('back', 19) + 'Back</button>' +
      '<div class="title" style="justify-content:center"><span>' + esc(opts.title) + '</span></div>' +
      '<div style="width:64px;display:flex;justify-content:flex-end">' + (opts.right || '') + '</div>' +
      '</div><div class="page-body"></div>';
    $('#pages').appendChild(page);
    const entry = { page, opts };
    this.stack.push(entry);
    this.render(entry);
    requestAnimationFrame(() => requestAnimationFrame(() => page.classList.add('in')));
    Nav.push();
    return entry;
  },
  render(entry) {
    entry = entry || this.stack[this.stack.length - 1];
    if (!entry) return;
    const body = $('.page-body', entry.page);
    const st = entry.page.scrollTop;
    body.innerHTML = '';
    entry.opts.render(body, entry);
    entry.page.scrollTop = st;
  },
  pop(fromHistory) {
    const entry = this.stack.pop();
    if (!entry) return;
    entry.page.classList.remove('in');
    setTimeout(() => entry.page.remove(), 300);
    if (entry.opts.onClose) { try { entry.opts.onClose(); } catch (e) {} }
    if (!fromHistory) Nav.consume();
  },
  popAll() { while (this.stack.length) this.pop(false); }
};

const Sheet = {
  current: null,
  open(opts) { /* {title, sub, html, mount(el, close), noGrab} */
    const reuseEntry = !!this.current;      /* replacing an open sheet: keep its history entry */
    if (this.current) this.current.close(true);
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    wrap.innerHTML =
      '<div class="sheet-back"></div>' +
      '<div class="sheet">' + (opts.noGrab ? '' : '<div class="grab"></div>') +
      (opts.title ? '<h2>' + esc(opts.title) + '</h2>' : '') +
      (opts.sub ? '<div class="sheet-sub">' + opts.sub + '</div>' : '') +
      '<div class="sheet-content">' + (opts.html || '') + '</div></div>';
    $('#overlays').appendChild(wrap);
    let closed = false;
    const api = {
      el: $('.sheet', wrap),
      close(fromHistory) {
        if (closed) return; closed = true;
        Sheet.current = null;
        wrap.classList.remove('in');
        setTimeout(() => wrap.remove(), 300);
        if (!fromHistory) Nav.consume();
      }
    };
    $('.sheet-back', wrap).addEventListener('click', () => api.close(false));
    this.current = api;
    requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('in')));
    if (!reuseEntry) Nav.push();
    if (opts.mount) opts.mount(api.el, api.close.bind(api));
    return api;
  }
};

const Dlg = {
  current: null,
  show(opts) { /* {title, msg, buttons:[{label, key, style}]} -> Promise<key|null> */
    return new Promise(resolve => {
      const wrap = document.createElement('div');
      wrap.className = 'dlg-wrap';
      const btns = opts.buttons.map(b =>
        '<button class="btn ' + (b.style || 'btn-tonal') + '" data-key="' + esc(b.key) + '">' + esc(b.label) + '</button>'
      ).join('');
      wrap.innerHTML = '<div class="dlg-back"></div><div class="dlg"><h4>' + esc(opts.title) + '</h4>' +
        (opts.msg ? '<p>' + esc(opts.msg) + '</p>' : '') + btns + '</div>';
      $('#overlays').appendChild(wrap);
      let done = false;
      const finish = key => {
        if (done) return; done = true;
        Dlg.current = null;
        wrap.classList.remove('in');
        setTimeout(() => wrap.remove(), 220);
        if (key !== null) Nav.consume(); /* history entry pushed on open */
        resolve(key);
      };
      Dlg.current = { resolve: finish };
      wrap.addEventListener('click', e => {
        const b = e.target.closest('[data-key]');
        if (b) finish(b.dataset.key);
        else if (e.target.classList.contains('dlg-back') && opts.dismissable !== false) finish('cancel');
      });
      requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('in')));
      Nav.push();
    });
  }
};
function confirmDlg(title, msg, confirmLabel, danger) {
  return Dlg.show({
    title, msg,
    buttons: [
      { label: confirmLabel || 'Confirm', key: 'ok', style: danger ? 'btn-danger' : 'btn-primary' },
      { label: 'Cancel', key: 'cancel', style: 'btn-ghost' }
    ]
  }).then(k => k === 'ok');
}

/* ---------------- charts ---------------- */
function lineChart(cfg) {
  const w = cfg.w || 336, h = cfg.h || 168;
  const p = { l: cfg.padL || 38, r: 12, t: 14, b: 24 };
  const series = (cfg.series || []).filter(s => s.pts && s.pts.length);
  const all = series.reduce((a, s) => a.concat(s.pts), []);
  if (!all.length) return '<div class="empty">Not enough data for a chart yet.</div>';
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  all.forEach(pt => { if (pt.x < minX) minX = pt.x; if (pt.x > maxX) maxX = pt.x; if (pt.y < minY) minY = pt.y; if (pt.y > maxY) maxY = pt.y; });
  /* bands (recorded or predicted windows) extend the x-domain too, so a predicted window that
     falls after the last data point is still visible instead of being clamped away */
  (cfg.bands || []).forEach(b => { if (b.from < minX) minX = b.from; if (b.to > maxX) maxX = b.to; });
  if (cfg.goal != null) { minY = Math.min(minY, cfg.goal); maxY = Math.max(maxY, cfg.goal); }
  if (cfg.minY0) minY = Math.min(minY, 0);
  if (minX === maxX) { minX -= DAY; maxX += DAY; }
  const spanY = (maxY - minY) || 1;
  minY -= spanY * 0.1; maxY += spanY * 0.1;
  if (cfg.minY0 && minY < 0) minY = 0;
  const X = x => p.l + (x - minX) / (maxX - minX) * (w - p.l - p.r);
  const Y = y => h - p.b - (y - minY) / (maxY - minY) * (h - p.t - p.b);
  const yF = cfg.yFmt || (v => String(Math.round(v * 10) / 10));
  let out = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="height:auto" preserveAspectRatio="xMidYMid meet">';
  const gid = 'g' + uid();
  out += '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="' + (series[0].color || '#888') + '" stop-opacity=".22"/>' +
    '<stop offset="1" stop-color="' + (series[0].color || '#888') + '" stop-opacity="0"/></linearGradient></defs>';
  // shaded bands (e.g. cycle windows) — drawn first, behind everything else
  (cfg.bands || []).forEach(b => {
    const bx0 = clamp(X(Math.max(b.from, minX)), p.l, w - p.r), bx1 = clamp(X(Math.min(b.to, maxX)), p.l, w - p.r);
    if (bx1 <= bx0) return;
    /* a predicted (not-yet-happened) window is drawn visually distinct from recorded ones:
       dashed outline, lighter fill, different hue — never mistakable for an actual record */
    out += '<rect x="' + bx0.toFixed(1) + '" y="' + p.t + '" width="' + (bx1 - bx0).toFixed(1) + '" height="' + (h - p.t - p.b) + '" fill="' + (b.color || 'var(--lav)') + '" opacity="' + (b.opacity != null ? b.opacity : 0.1) + '"' +
      (b.dashed ? ' stroke="' + (b.strokeColor || b.color || 'var(--lav)') + '" stroke-width="1.5" stroke-dasharray="4 3"' : '') + '/>';
  });
  // gridlines + y labels
  for (let i = 0; i <= 2; i++) {
    const gy = minY + (maxY - minY) * i / 2;
    const yy = Y(gy).toFixed(1);
    out += '<line x1="' + p.l + '" x2="' + (w - p.r) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"' + (i > 0 ? ' stroke-dasharray="1 4"' : '') + ' stroke-linecap="round"/>';
    out += '<text x="' + (p.l - 7) + '" y="' + yy + '" font-size="10" fill="var(--faint)" text-anchor="end" dominant-baseline="middle">' + esc(yF(gy)) + '</text>';
  }
  // x labels: first, mid, last
  const xf = cfg.xFmt || (x => DTF.md.format(new Date(x)));
  [[minX, 'start'], [(minX + maxX) / 2, 'middle'], [maxX, 'end']].forEach(a => {
    out += '<text x="' + X(a[0]).toFixed(1) + '" y="' + (h - 7) + '" font-size="10" fill="var(--faint)" text-anchor="' + a[1] + '">' + esc(xf(a[0])) + '</text>';
  });
  // goal line
  if (cfg.goal != null) {
    out += '<line x1="' + p.l + '" x2="' + (w - p.r) + '" y1="' + Y(cfg.goal).toFixed(1) + '" y2="' + Y(cfg.goal).toFixed(1) + '" stroke="var(--mint)" stroke-width="1.5" stroke-dasharray="4 4"/>';
  }
  // today marker
  if (cfg.todayX != null && cfg.todayX >= minX && cfg.todayX <= maxX) {
    out += '<line x1="' + X(cfg.todayX).toFixed(1) + '" x2="' + X(cfg.todayX).toFixed(1) + '" y1="' + p.t + '" y2="' + (h - p.b) + '" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 4"/>';
    out += '<text x="' + X(cfg.todayX).toFixed(1) + '" y="' + (p.t - 3) + '" font-size="9" fill="var(--faint)" text-anchor="middle">now</text>';
  }
  series.forEach((s, si) => {
    const path = s.pts.map((pt, i) => (i ? 'L' : 'M') + X(pt.x).toFixed(1) + ' ' + Y(pt.y).toFixed(1)).join('');
    if (si === 0 && s.fill !== false) {
      out += '<path d="' + path + 'L' + X(s.pts[s.pts.length - 1].x).toFixed(1) + ' ' + (h - p.b) + 'L' + X(s.pts[0].x).toFixed(1) + ' ' + (h - p.b) + 'Z" fill="url(#' + gid + ')"/>';
    }
    out += '<path d="' + path + '" fill="none" stroke="' + (s.color || '#888') + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"' + (s.dash ? ' stroke-dasharray="3 5"' : '') + '/>';
    if (s.dots) s.pts.forEach(pt => {
      /* a point can override its own color (e.g. a weigh-in that falls inside a predicted cycle window) */
      out += '<circle cx="' + X(pt.x).toFixed(1) + '" cy="' + Y(pt.y).toFixed(1) + '" r="2.7" fill="#fff" stroke="' + (pt.c || s.color || '#888') + '" stroke-width="1.8"/>';
    });
    if (s.endDot) {
      const lp = s.pts[s.pts.length - 1];
      out += '<circle cx="' + X(lp.x).toFixed(1) + '" cy="' + Y(lp.y).toFixed(1) + '" r="4" fill="' + (s.color || '#888') + '" stroke="#fff" stroke-width="2"/>';
    }
  });
  // event markers (e.g. injections)
  (cfg.marks || []).forEach(m => {
    if (m.x < minX || m.x > maxX) return;
    out += '<circle cx="' + X(m.x).toFixed(1) + '" cy="' + (h - p.b) + '" r="3" fill="' + (m.color || 'var(--coral)') + '"/>';
  });
  out += '</svg>';
  return '<div class="chartwrap">' + out + '</div>';
}

/* ---------------- actions ---------------- */
/* generic save/delete for a flat array-of-records collection, with honest id/createdAt/updatedAt stamping
   and a tombstone recorded on every delete (so Drive sync can propagate it instead of a merge resurrecting it) */
function genericSave(collection, d) {
  const arr = Store.state[collection];
  if (d.id) {
    const i = arr.findIndex(x => x.id === d.id);
    if (i >= 0) { d.createdAt = arr[i].createdAt; arr[i] = stampUpdate(d); }
    else arr.push(stampNew(d)); /* id was supplied (e.g. restore) but doesn't exist locally yet */
  } else arr.push(stampNew(d));
  Store.save(); App.refresh();
  return d;
}
function genericDelete(collection, type, id) {
  Store.state[collection] = Store.state[collection].filter(x => x.id !== id);
  Store.recordTombstone(type, id);
  Store.save(); App.refresh();
}
const Actions = {
  saveInjection(d) { return genericSave('injections', d); },
  deleteInjection(id) { genericDelete('injections', 'injection', id); },
  saveWeight(d) { return genericSave('weights', d); },
  deleteWeight(id) { genericDelete('weights', 'weight', id); },
  saveSymptom(d) { return genericSave('symptoms', d); },
  deleteSymptom(id) { genericDelete('symptoms', 'symptom', id); },
  saveMeasurement(d) { return genericSave('measurements', d); },
  deleteMeasurement(id) { genericDelete('measurements', 'measurement', id); },
  /* -------- check-ins: at most one per calendar date; saving with a bare dateKey upserts that date -------- */
  saveCheckIn(d) {
    const arr = Store.state.checkIns;
    if (!d.id) {
      const existing = arr.find(x => x.dateKey === d.dateKey);
      if (existing) d.id = existing.id;
    }
    if (!d.loggedAt) d.loggedAt = nowISO();
    return genericSave('checkIns', d);
  },
  deleteCheckIn(id) { genericDelete('checkIns', 'checkIn', id); },
  /* -------- dose plans (future plan — never shown as confirmed, never auto-linked) -------- */
  saveDosePlan(d) { return genericSave('dosePlans', d); },
  deleteDosePlan(id) { genericDelete('dosePlans', 'dosePlan', id); },
  linkDosePlan(planId, injectionId) {
    const p = Store.state.dosePlans.find(x => x.id === planId);
    if (p) { p.linkedInjectionId = injectionId; stampUpdate(p); Store.save(); App.refresh(); }
  },
  /* -------- vials / supply -------- */
  saveVial(d) { return genericSave('vials', d); },
  deleteVial(id) { genericDelete('vials', 'vial', id); },
  /* -------- spend (actual cost entries) -------- */
  saveSpend(d) { return genericSave('spends', d); },
  deleteSpend(id) { genericDelete('spends', 'spend', id); },
  /* -------- period log (start date only) -------- */
  saveCycle(d) { return genericSave('cycles', d); },
  deleteCycle(id) { genericDelete('cycles', 'cycle', id); },
  toggleChecklist(idx) {
    const c = checklistState();
    c.done[idx] = !c.done[idx];
    Store.state.checklist = c;
    Store.save(); App.refresh();
  },
  patchSettings(patch) { Object.assign(Store.state.settings, patch); Store.save(); App.refresh(); },
  setTargetDate(dateStr) {
    const set = Store.state.settings;
    if (!dateStr) { Object.assign(set, { targetDate: null, targetDateAnchorKg: null, targetDateAnchorAt: null }); Store.save(); App.refresh(); return; }
    const cw = currentWeight();
    set.targetDate = dateStr;
    set.targetDateAnchorKg = cw ? cw.kg : (startWeight() != null ? startWeight() : null);
    set.targetDateAnchorAt = nowISO();
    Store.save(); App.refresh();
  },
  dismissFlag(id) {
    /* record the triggerDate of the occurrence being dismissed, not just the id, so the flag
       can resurface once a newer triggering event appears instead of staying hidden forever */
    const current = headsUpFlags().find(f => f.id === id);
    Store.state.meta.dismissedFlags[id] = { triggerDate: current ? current.triggerDate : dateKey(new Date()), dismissedAt: nowISO() };
    Store.save(); App.refresh();
  },
  snoozeMeasurementReminder(days) {
    Store.state.meta.measurementReminderSnoozeUntil = new Date(Date.now() + (days || 14) * DAY).toISOString();
    Store.save(); App.refresh();
  }
};

  /* Your Journey — kept reachable, appended after the brief's explicit order */

    const tb = totalBodyChange();
    const ins = buildInsights();

  html += '<div class="footnote" style="text-align:center">Everything is stored on this device.' + (Store.state.settings.drive.enabled ? ' Google Drive sync is on.' : '') + ' This is a tracking tool, not medical advice.</div>';

function sevDots(n) {
  let out = '<span class="sev">';

}

/* ---------------- medication page ---------------- */
function medChartHtml() {
  const injs = injectionsSorted(false);
  if (!injs.length) return '<div class="empty"><div class="big">💧</div>Log your first injection and the level curve appears here.</div>';
  const now = Date.now();
  const first = new Date(injs[0].dateTime).getTime();
  const from = Math.max(first, now - 42 * DAY);
  const to = now + 7 * DAY;
  const past = [], future = [];
  for (let t = from; t <= to; t += 6 * 3600000) {
    const pt = { x: t, y: PK.totalAt(injs, t) };
    if (t <= now) past.push(pt); else future.push(pt);
  }
  const nowPt = { x: now, y: PK.totalAt(injs, now) };
  past.push(nowPt); future.unshift(nowPt);
  return lineChart({
    series: [
      { pts: past, color: 'var(--teal)', endDot: true },
      { pts: future, color: 'var(--teal)', dash: true, fill: false }
    ],
    marks: injs.filter(i => { const t = new Date(i.dateTime).getTime(); return t >= from && t <= to; }).map(i => ({ x: new Date(i.dateTime).getTime(), color: 'var(--coral)' })),
    todayX: now, yFmt: v => fmtMg(v), minY0: true
  }) + '<div class="chart-legend"><span><i style="background:var(--teal)"></i>estimated level (mg)</span><span><i style="background:var(--teal);opacity:.4"></i>next 7 days</span><span><i style="background:var(--coral);height:7px;width:7px;border-radius:50%"></i>injections</span></div>';
}

  return ws.filter(w => new Date(w.dateTime).getTime() >= cut).map(w => ({ x: new Date(w.dateTime).getTime(), y: +w.kg }));
