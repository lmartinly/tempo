}

/* ---------------- charts ---------------- */
function lineChart(cfg) {
  const w = cfg.w || 336, h = cfg.h || 168;
  const p = { l: cfg.padL || 38, r: 12, t: 14, b: 24 };
  const series = (cfg.series || []).filter(s => s.pts && s.pts.length);
  const all = series.reduce((a, s) => a.concat(s.pts), []);
  if (!all.length) return '<div class="empty">Not enough data for a chart yet.</div>';
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  all.forEach(pt => { if (pt.x < minX) minX = pt.x; if (pt.x > maxX) maxX = pt.x; if (pt.y < minY) minY = pt.y; if (pt.y > maxY) maxY = pt.y; });
  /* bands (recorded or predicted windows) extend the x-domain too, so a predicted window that
     falls after the last data point is still visible instead of being clamped away */
  (cfg.bands || []).forEach(b => { if (b.from < minX) minX = b.from; if (b.to > maxX) maxX = b.to; });
  if (cfg.goal != null) { minY = Math.min(minY, cfg.goal); maxY = Math.max(maxY, cfg.goal); }
  if (cfg.minY0) minY = Math.min(minY, 0);
  if (minX === maxX) { minX -= DAY; maxX += DAY; }
  const spanY = (maxY - minY) || 1;
  minY -= spanY * 0.1; maxY += spanY * 0.1;
  if (cfg.minY0 && minY < 0) minY = 0;
  const X = x => p.l + (x - minX) / (maxX - minX) * (w - p.l - p.r);
  const Y = y => h - p.b - (y - minY) / (maxY - minY) * (h - p.t - p.b);
  const yF = cfg.yFmt || (v => String(Math.round(v * 10) / 10));
  let out = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="height:auto" preserveAspectRatio="xMidYMid meet">';
  const gid = 'g' + uid();
  out += '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="' + (series[0].color || '#888') + '" stop-opacity=".22"/>' +
    '<stop offset="1" stop-color="' + (series[0].color || '#888') + '" stop-opacity="0"/></linearGradient></defs>';
  // shaded bands (e.g. cycle windows) — drawn first, behind everything else
  (cfg.bands || []).forEach(b => {
    const bx0 = clamp(X(Math.max(b.from, minX)), p.l, w - p.r), bx1 = clamp(X(Math.min(b.to, maxX)), p.l, w - p.r);
    if (bx1 <= bx0) return;
    /* a predicted (not-yet-happened) window is drawn visually distinct from recorded ones:
       dashed outline, lighter fill, different hue — never mistakable for an actual record */
    out += '<rect x="' + bx0.toFixed(1) + '" y="' + p.t + '" width="' + (bx1 - bx0).toFixed(1) + '" height="' + (h - p.t - p.b) + '" fill="' + (b.color || 'var(--lav)') + '" opacity="' + (b.opacity != null ? b.opacity : 0.1) + '"' +
      (b.dashed ? ' stroke="' + (b.strokeColor || b.color || 'var(--lav)') + '" stroke-width="1.5" stroke-dasharray="4 3"' : '') + '/>';
  });
  // gridlines + y labels
  for (let i = 0; i <= 2; i++) {
    const gy = minY + (maxY - minY) * i / 2;
    const yy = Y(gy).toFixed(1);
    out += '<line x1="' + p.l + '" x2="' + (w - p.r) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"' + (i > 0 ? ' stroke-dasharray="1 4"' : '') + ' stroke-linecap="round"/>';
    out += '<text x="' + (p.l - 7) + '" y="' + yy + '" font-size="10" fill="var(--faint)" text-anchor="end" dominant-baseline="middle">' + esc(yF(gy)) + '</text>';
  }
  // x labels: first, mid, last
  const xf = cfg.xFmt || (x => DTF.md.format(new Date(x)));
  [[minX, 'start'], [(minX + maxX) / 2, 'middle'], [maxX, 'end']].forEach(a => {
    out += '<text x="' + X(a[0]).toFixed(1) + '" y="' + (h - 7) + '" font-size="10" fill="var(--faint)" text-anchor="' + a[1] + '">' + esc(xf(a[0])) + '</text>';
  });
  // goal line
  if (cfg.goal != null) {
    out += '<line x1="' + p.l + '" x2="' + (w - p.r) + '" y1="' + Y(cfg.goal).toFixed(1) + '" y2="' + Y(cfg.goal).toFixed(1) + '" stroke="var(--mint)" stroke-width="1.5" stroke-dasharray="4 4"/>';
  }
  // today marker
  if (cfg.todayX != null && cfg.todayX >= minX && cfg.todayX <= maxX) {
    out += '<line x1="' + X(cfg.todayX).toFixed(1) + '" x2="' + X(cfg.todayX).toFixed(1) + '" y1="' + p.t + '" y2="' + (h - p.b) + '" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 4"/>';
    out += '<text x="' + X(cfg.todayX).toFixed(1) + '" y="' + (p.t - 3) + '" font-size="9" fill="var(--faint)" text-anchor="middle">now</text>';
  }
  series.forEach((s, si) => {
    const path = s.pts.map((pt, i) => (i ? 'L' : 'M') + X(pt.x).toFixed(1) + ' ' + Y(pt.y).toFixed(1)).join('');
    if (si === 0 && s.fill !== false) {
      out += '<path d="' + path + 'L' + X(s.pts[s.pts.length - 1].x).toFixed(1) + ' ' + (h - p.b) + 'L' + X(s.pts[0].x).toFixed(1) + ' ' + (h - p.b) + 'Z" fill="url(#' + gid + ')"/>';
    }
    out += '<path d="' + path + '" fill="none" stroke="' + (s.color || '#888') + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"' + (s.dash ? ' stroke-dasharray="3 5"' : '') + '/>';
    if (s.dots) s.pts.forEach(pt => {
      /* a point can override its own color (e.g. a weigh-in that falls inside a predicted cycle window) */
      out += '<circle cx="' + X(pt.x).toFixed(1) + '" cy="' + Y(pt.y).toFixed(1) + '" r="2.7" fill="#fff" stroke="' + (pt.c || s.color || '#888') + '" stroke-width="1.8"/>';
    });
    if (s.endDot) {
      const lp = s.pts[s.pts.length - 1];
      out += '<circle cx="' + X(lp.x).toFixed(1) + '" cy="' + Y(lp.y).toFixed(1) + '" r="4" fill="' + (s.color || '#888') + '" stroke="#fff" stroke-width="2"/>';
    }
  });
  // event markers (e.g. injections)
  (cfg.marks || []).forEach(m => {
    if (m.x < minX || m.x > maxX) return;
    out += '<circle cx="' + X(m.x).toFixed(1) + '" cy="' + (h - p.b) + '" r="3" fill="' + (m.color || 'var(--coral)') + '"/>';
  });
  out += '</svg>';
  return '<div class="chartwrap">' + out + '</div>';
}

/* ---------------- actions ---------------- */
/* generic save/delete for a flat array-of-records collection, with honest id/createdAt/updatedAt stamping
   and a tombstone recorded on every delete (so Drive sync can propagate it instead of a merge resurrecting it) */
function genericSave(collection, d) {
  const arr = Store.state[collection];
  if (d.id) {
    const i = arr.findIndex(x => x.id === d.id);
    if (i >= 0) { d.createdAt = arr[i].createdAt; arr[i] = stampUpdate(d); }
    else arr.push(stampNew(d)); /* id was supplied (e.g. restore) but doesn't exist locally yet */
  } else arr.push(stampNew(d));
  Store.save(); App.refresh();
  return d;
}
function genericDelete(collection, type, id) {
  Store.state[collection] = Store.state[collection].filter(x => x.id !== id);
  Store.recordTombstone(type, id);
  Store.save(); App.refresh();
}
const Actions = {
  saveInjection(d) { return genericSave('injections', d); },
  deleteInjection(id) { genericDelete('injections', 'injection', id); },
  saveWeight(d) { return genericSave('weights', d); },
  deleteWeight(id) { genericDelete('weights', 'weight', id); },
  saveSymptom(d) { return genericSave('symptoms', d); },
  deleteSymptom(id) { genericDelete('symptoms', 'symptom', id); },
  saveMeasurement(d) { return genericSave('measurements', d); },
  deleteMeasurement(id) { genericDelete('measurements', 'measurement', id); },
  /* -------- check-ins: at most one per calendar date; saving with a bare dateKey upserts that date -------- */
  saveCheckIn(d) {
    const arr = Store.state.checkIns;
    if (!d.id) {
      const existing = arr.find(x => x.dateKey === d.dateKey);
      if (existing) d.id = existing.id;
    }
    if (!d.loggedAt) d.loggedAt = nowISO();
    return genericSave('checkIns', d);
  },
  deleteCheckIn(id) { genericDelete('checkIns', 'checkIn', id); },
  /* -------- dose plans (future plan — never shown as confirmed, never auto-linked) -------- */
  saveDosePlan(d) { return genericSave('dosePlans', d); },
  deleteDosePlan(id) { genericDelete('dosePlans', 'dosePlan', id); },
  linkDosePlan(planId, injectionId) {
    const p = Store.state.dosePlans.find(x => x.id === planId);
    if (p) { p.linkedInjectionId = injectionId; stampUpdate(p); Store.save(); App.refresh(); }
  },
  /* -------- vials / supply -------- */
  saveVial(d) { return genericSave('vials', d); },
  deleteVial(id) { genericDelete('vials', 'vial', id); },
  /* -------- spend (actual cost entries) -------- */
  saveSpend(d) { return genericSave('spends', d); },
  deleteSpend(id) { genericDelete('spends', 'spend', id); },
  /* -------- period log (start date only) -------- */
  saveCycle(d) { return genericSave('cycles', d); },
  deleteCycle(id) { genericDelete('cycles', 'cycle', id); },
  /* -------- workouts, equipment, programs -------- */
  saveWorkout(d) { return genericSave('workouts', d); },
  deleteWorkout(id) { genericDelete('workouts', 'workout', id); },
  saveEquipment(d) { return genericSave('equipment', d); },
  deleteEquipment(id) { genericDelete('equipment', 'equipment', id); },
  saveProgram(d) { return genericSave('programs', d); },
  deleteProgram(id) { genericDelete('programs', 'program', id); },
  toggleChecklist(idx) {
    const c = checklistState();
    c.done[idx] = !c.done[idx];
    Store.state.checklist = c;
    Store.save(); App.refresh();
  },
  patchSettings(patch) { Object.assign(Store.state.settings, patch); Store.save(); App.refresh(); },
  setTargetDate(dateStr) {
    const set = Store.state.settings;
    if (!dateStr) { Object.assign(set, { targetDate: null, targetDateAnchorKg: null, targetDateAnchorAt: null }); Store.save(); App.refresh(); return; }
    const cw = currentWeight();
    set.targetDate = dateStr;
    set.targetDateAnchorKg = cw ? cw.kg : (startWeight() != null ? startWeight() : null);
    set.targetDateAnchorAt = nowISO();
    Store.save(); App.refresh();
  },
  dismissFlag(id) {
    /* record the triggerDate of the occurrence being dismissed, not just the id, so the flag
       can resurface once a newer triggering event appears instead of staying hidden forever */
    const current = headsUpFlags().find(f => f.id === id);
    Store.state.meta.dismissedFlags[id] = { triggerDate: current ? current.triggerDate : dateKey(new Date()), dismissedAt: nowISO() };
    Store.save(); App.refresh();
  },
  snoozeMeasurementReminder(days) {
    Store.state.meta.measurementReminderSnoozeUntil = new Date(Date.now() + (days || 14) * DAY).toISOString();
    Store.save(); App.refresh();
  }
};

}
function atGoalWeight() {
  const g = +Store.state.settings.goalKg, cw = currentWeight();
  return !!(g > 0 && cw && cw.kg <= g);
}

function renderTodayCard(ctx) {
  const s = Store.state, set = s.settings;
  /* 1 — shot day: the checklist owns the day */
  if (ctx.isShotDay) {
    const c = checklistState();
    const items = set.checklistItems;
    const done = c.done.filter(Boolean).length;
    let h = '<div class="check-card fadeup"><div class="card-head" style="margin-bottom:6px">' +
      iconChip('syringe', 'coral') + '<h3>Shot Day Checklist</h3>' +
      '<span class="check-prog num">' + done + '/' + items.length + '</span></div>' +
      '<div style="font-size:12.5px;color:var(--coral-deep);opacity:.75;margin-bottom:4px">Injection scheduled ' + esc(set.time) + '</div>' +
      items.map((it, i) =>
        '<button class="check-row' + (c.done[i] ? ' done' : '') + '" data-act="check" data-i="' + i + '" style="width:100%;text-align:left">' +
        '<span class="checkbox">' + (c.done[i] ? ic('check', 15) : '') + '</span><span class="txt">' + esc(it) + '</span></button>'
      ).join('');
    /* the checklist owns shot day, but that must never lock you out of the daily check-in:
       same two actions as the regular prompt, right inside the card */
    const todayCI = s.checkIns.find(x => x.dateKey === dateKey(ctx.now));
    if (!todayCI) {
      h += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(192,95,71,.14)">' +
        '<div style="font-size:12.5px;color:var(--coral-deep);opacity:.75;margin-bottom:8px">Daily check-in</div>' +
        '<div class="btnrow">' +
        '<button class="btn btn-sm" style="background:var(--glass);color:var(--coral-deep);flex:1" data-act="add-checkin">Log check-in</button>' +
        '<button class="btn btn-sm" style="background:var(--glass2);color:var(--coral-deep)" data-act="checkin-nothing">Nothing to report</button></div></div>';
    } else {
      h += '<button class="check-row" data-act="edit-checkin" data-id="' + todayCI.id + '" style="width:100%;text-align:left;margin-top:6px;border-top:1px solid rgba(192,95,71,.14)">' +
        '<span class="checkbox" style="background:var(--coral);border-color:var(--coral)">' + ic('check', 15) + '</span>' +
        '<span class="txt" style="color:var(--coral-deep)">Check-in logged today<span style="font-weight:400;opacity:.6"> · tap to edit</span></span></button>';
    }
    const shotLoggedToday = s.injections.some(x => dateKey(x.dateTime) === dateKey(ctx.now));
    if (!shotLoggedToday) h += '<button class="btn btn-sm" style="background:var(--glass);color:var(--coral-deep);margin-top:10px;width:100%" data-act="open-shotday">Open Shot Day →</button>';
    return h + '</div>';
  }
  /* 2 — no check-in logged today: a light prompt (emphasized days 2-3, when side effects tend to show) */
  const todayK = dateKey(ctx.now);
  const checkedInToday = s.checkIns.some(c => c.dateKey === todayK);
  if (!checkedInToday) {
    const emphasize = ctx.cycleDay >= 2 && ctx.cycleDay <= 3;
    return '<div class="todaycard sympt fadeup"><h3>' + iconChip('heart', 'peach') +
      (emphasize ? 'Day ' + ctx.cycleDay + ' after your shot' : 'Daily check-in') + '</h3>' +
      '<p>' + (emphasize ? 'These are the days side effects tend to show up, if they do. How\u2019s your body today?' : 'A quick optional note — appetite, energy, anything worth remembering.') + '</p>' +
      '<div class="btnrow" style="margin-top:12px">' +
      '<button class="btn btn-sm" style="background:var(--peach);color:#fff;flex:1" data-act="add-checkin">Log check-in</button>' +
      '<button class="btn btn-ghost btn-sm" data-act="checkin-nothing">Nothing to report</button></div></div>';
  }
  /* 3 — Sunday: a quiet week in review */
  if (ctx.now.getDay() === 0) {
    const wk = weeklySummary(ctx.now);
    if (wk.weightDelta != null || wk.injectionCount || wk.symptomCount || wk.checkInCount) {
      return '<div class="todaycard week fadeup"><h3>' + iconChip('sun', 'teal') + 'Your week' + (wk.weekNo ? ' · #' + wk.weekNo : '') + '</h3>' +
        '<div style="margin-top:8px">' +
        (wk.weightDelta != null ? '<div class="wkrow"><span>Weight vs last week</span><b class="delta ' + (wk.weightDelta < 0 ? 'down' : wk.weightDelta > 0 ? 'up' : 'flat') + '">' + fmtSign(wk.weightDelta, 'kg') + '</b></div>' : '<div class="wkrow"><span>Weight vs last week</span><b style="color:var(--faint);font-weight:500">Not enough data</b></div>') +
        (wk.proteinAvg != null ? '<div class="wkrow"><span>Avg protein</span><b>' + Math.round(wk.proteinAvg) + ' g/day</b></div>' : '') +
        (wk.kcalAvg != null ? '<div class="wkrow"><span>Avg calories</span><b>' + Math.round(wk.kcalAvg) + ' kcal/day</b></div>' : '') +
        '<div class="wkrow"><span>Injections</span><b>' + wk.injectionCount + '</b></div>' +
        '<div class="wkrow"><span>Check-ins logged</span><b>' + wk.checkInCount + '</b></div>' +
        '<div class="wkrow"><span>Symptoms logged</span><b>' + wk.symptomCount + '</b></div>' +
        '</div></div>';
    }
  }
  return '';
}
function renderDashboard() {
  const root = $('#root');
  const s = Store.state, set = s.settings;
  const now = new Date();
  const isShotDay = now.getDay() === set.weekday;
  const next = nextInjectionDate(now, set.weekday, set.time);
  const daysToNext = daysBetween(now, next);
  const li = lastInjection();
  const med = medicationStatus(now);
  const cw = currentWeight(), sw = startWeight();
  const lost = (cw && sw != null) ? sw - cw.kg : null;
  const cycleDay = li ? daysBetween(new Date(li.dateTime), now) + 1 : null;
  const hasData = s.injections.length || s.weights.length;
  let html = '';

  html += '<div class="datebar"><span>' + DTF.wdl.format(now) + ', ' + DTF.md.format(now) + '</span>' +
    (isShotDay ? '<span class="pill coral">\u{1F489} Shot day</span>'
      : (cycleDay ? '<span class="pill gray">Day ' + cycleDay + ' · next shot ' + relDays(daysToNext).toLowerCase() + '</span>' : '')) +
    '</div>';

  /* first-run setup hint */
  if (!set.setupDismissed && !hasData) {

      '<div style="font-size:14.5px;color:var(--muted);line-height:1.55">Set your injection day, height and goal weight in Settings, then log your first shot. Everything stays on this device.</div>' +
      '<div class="btnrow" style="margin-top:14px"><button class="btn btn-tonal btn-sm" data-act="open-settings">Open Settings</button>' +
      '<button class="btn btn-primary btn-sm" data-act="add-injection">Log injection</button></div></div>';
  }

  /* heads-up flags — descriptive, dismissible, never diagnostic */
  const flags = headsUpFlags(now);
  if (flags.length) {
    html += flags.map(f => '<div class="banner warn fadeup" style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between">' +
      '<span>' + esc(f.text) + '</span><button class="mini-add" data-act="dismiss-flag" data-id="' + esc(f.id) + '" style="flex:none">' + ic('x', 14) + '</button></div>').join('');
  }

    (bk.never ? 'Your data lives only on this device, and you haven’t exported a backup from here yet.' : 'Your data lives only on this device — your last backup was ' + bk.days + ' days ago.') +
    '<div class="btnrow" style="margin-top:8px"><button class="btn btn-tonal btn-sm" style="flex:1" data-act="export-data">Back up now</button>' +
    '<button class="btn btn-ghost btn-sm" data-act="snooze-backup-nudge">Later</button></div></div>';

  html += weekWrappedCard(now);
  html += monthWrappedCard(now);

  /* 1 — today, whatever today needs */

  if (mood) html += '<div class="banner fadeup" style="background:var(--mint-soft);color:var(--mint-deep)">' + mood.emoji + ' ' + esc(mood.text) + '</div>';

  html += workoutDashCard(now);

    '<button class="tile terra" data-act="open-shotday"><span class="tk">' + ic('syringe', 15) + 'Next injection</span>' +

      (bmi ? ' · BMI ' + bmi.toFixed(1) : '') +
      (tr28 && Math.abs(tr28.perWeek) >= 0.03 ? ' · <span class="delta ' + (tr28.perWeek < 0 ? 'down' : 'up') + '">' + fmtSign(tr28.perWeek, 'kg/wk') + '</span>' : '') +
      '</div></div></div>';
    if (set.goalKg && sw != null) {
      const total = sw - set.goalKg;

      html += '<div class="progressbar" style="margin-top:12px"><i style="width:' + doneP + '%;background:var(--pink)"></i></div>' +
        '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:5px"><span>' + fmtKg(sw) + '</span><span>goal ' + fmtKg(+set.goalKg) + '</span></div>';
    }
    const daysSinceW = daysBetween(new Date(cw.dateTime), now);

      '<div class="divider"></div><div class="kv" style="border:0"><span><b>Change</b> · ' + ago.daysApart + ' days apart</span><b class="delta ' + (ago.deltaKg < 0 ? 'down' : ago.deltaKg > 0 ? 'up' : 'flat') + '">' + fmtSign(ago.deltaKg, 'kg') + '</b></div>' +
      (ago.doseThenMg && ago.doseNowMg && ago.doseThenMg !== ago.doseNowMg ? '<div class="footnote">Dose then: ' + fmtMg(ago.doseThenMg) + ' mg · now: ' + fmtMg(ago.doseNowMg) + ' mg.</div>' : '');
  } else {
    html += '<div style="font-size:13.5px;color:var(--muted)">Not enough history yet — ' + esc(ago.reason) + '.</div>';

    if (gp) {
      html += '<div class="kv"><span>Remaining to goal</span><b>' + fmtKg(Math.abs(gp.remaining)) + ' kg</b></div>' +

        (gp.projection ? '<div class="footnote">Projected arrival: ' + fmtDate(gp.projection.low) + ' – ' + fmtDate(gp.projection.high) + '.</div>' : '');

  if (Store.state.checkIns.length) {
    html += '<div class="card" style="padding:14px 16px"><div style="display:flex;justify-content:space-between;align-items:center;font-size:13.5px">' +
      '<span style="color:var(--muted)">' + cons.last7 + ' of last 7 days logged' + (cons.run >= 3 ? ' · current run ' + cons.run + ' days' : '') + '</span>' +
      '<span style="color:var(--faint)">best run ' + cons.best + '</span></div></div>';
  }

  const mr = measurementReminderDue(now);
  if (mr) {
    html += '<div class="banner" style="background:var(--mint-soft);color:var(--mint-deep);display:flex;justify-content:space-between;align-items:center;gap:10px">' +
      '<span>It’s been ' + mr.daysSince + ' days since your last measurements.</span>' +
      '<span style="display:flex;gap:6px;flex:none"><button class="mini-add" data-act="add-measurement">' + ic('plus', 15) + '</button>' +
      '<button class="mini-add" data-act="snooze-measurement">' + ic('x', 14) + '</button></span></div>';
  }

  /* 7 — My Pattern */
  const wbp = myPatternWeightByPeriod();
  html += '<div class="card press" data-act="open-mypattern"><div class="card-head"><div class="ichip lav">' + ic('sparkle', 17) + '</div><h3>My Pattern</h3><span class="chev-ico">' + ic('chevR', 17) + '</span></div>';
  if (wbp.length) {
    const p = wbp[wbp.length - 1];
    html += '<div class="insight" style="padding:2px"><span class="ii">' + ic('scale', 14) + '</span><span>At ' + fmtMg(p.period.doseMg) + ' mg: ' + fmtSign(p.change.delta, 'kg') + ' over ' + p.change.n + ' days logged (' + fmtDate(new Date(p.change.startK + 'T12:00:00')) + ' → ' + fmtDate(new Date(p.change.endK + 'T12:00:00')) + ').</span></div>';
  } else {
    html += '<div style="font-size:13.5px;color:var(--muted)">Not enough data yet — patterns need weight logged across at least one full dose period.</div>';
  }
  html += '</div>';

  /* 8 — symptoms */
  html += '<div class="card press" data-act="open-sym">' + cardHead('heart', 'peach', 'Symptoms',
    '<button class="mini-add" data-act="add-symptom">' + ic('plus', 16) + '</button><span class="chev-ico">' + ic('chevR', 17) + '</span>');
  const sym = latestSymptom();
  const symTodayList = s.symptoms.filter(x => dateKey(x.dateTime) === dateKey(now));
  if (symTodayList.length) {
    const t = symTodayList.sort((a, b) => new Date(b.dateTime) - new Date(a.dateTime))[0];
    const dX = dayAfterInjection(s.injections, t.dateTime);
    html += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="pill peach">' + esc(t.name) + '</span>' +
      sevDots(t.severity) + (dX ? '<span class="badge-day">Day ' + dX + '</span>' : '') +
      '<span style="font-size:13px;color:var(--muted)">' + fmtTime(t.dateTime) + '</span></div>';
  } else {
    html += '<div style="font-size:14.5px;color:var(--muted)">No symptoms today.' + (sym ? ' Last: ' + esc(sym.name) + ' · ' + fmtDate(sym.dateTime) : '') + '</div>';

  /* Your Journey — kept reachable, appended after the brief's explicit order */
  if (hasData) {
    const wk = weeksSinceStart(now);
    const tb = totalBodyChange();
    const ins = buildInsights();
    html += '<div class="card press journey" data-act="open-journey">' + cardHead('sparkle', 'mint', 'Your journey', '<span class="chev-ico">' + ic('chevR', 17) + '</span>') +
      '<div class="jstats">' +

/* ---------------- medication page ---------------- */
function medChartHtml() {
  const injs = injectionsSorted(false);
  if (!injs.length) return '<div class="empty"><div class="big">💧</div>Log your first injection and the level curve appears here.</div>';
  const now = Date.now();
  const first = new Date(injs[0].dateTime).getTime();
  const from = Math.max(first, now - 42 * DAY);
  const to = now + 7 * DAY;
  const past = [], future = [];
  for (let t = from; t <= to; t += 6 * 3600000) {
    const pt = { x: t, y: PK.totalAt(injs, t) };
    if (t <= now) past.push(pt); else future.push(pt);
  }
  const nowPt = { x: now, y: PK.totalAt(injs, now) };
  past.push(nowPt); future.unshift(nowPt);
  return lineChart({
    series: [
      { pts: past, color: 'var(--teal)', endDot: true },
      { pts: future, color: 'var(--teal)', dash: true, fill: false }
    ],
    marks: injs.filter(i => { const t = new Date(i.dateTime).getTime(); return t >= from && t <= to; }).map(i => ({ x: new Date(i.dateTime).getTime(), color: 'var(--coral)' })),
    todayX: now, yFmt: v => fmtMg(v), minY0: true
  }) + '<div class="chart-legend"><span><i style="background:var(--teal)"></i>estimated level (mg)</span><span><i style="background:var(--teal);opacity:.4"></i>next 7 days</span><span><i style="background:var(--coral);height:7px;width:7px;border-radius:50%"></i>injections</span></div>';
}

      /* plateau note — a calm one, not an alarm */
      const trShort = weightTrend(21);
      if (trShort && trShort.n >= 3 && Math.abs(trShort.perWeek) < 0.12 && cw && Store.state.weights.length >= 5) {
        h += '<div class="card" style="background:var(--mint-soft)"><div class="insight" style="padding:2px"><span class="ii">' + ic('sun', 14) + '</span><span>Your weight has been level for about three weeks. Plateaus are a normal part of the process — your body adjusting, not you doing anything wrong.</span></div></div>';
      }

      /* kg <-> cm relationship */
      const ratio = kgCmRatio();
      if (ratio) {
        h += '<div class="card"><div class="insight" style="padding:2px"><span class="ii">' + ic('tape', 14) + '</span><span>For every kg you\u2019ve lost, you\u2019ve dropped about ' + fmtCm(ratio.cmPerKg) + ' cm across your measurements — the scale and the tape moving together.</span></div></div>';
      }

      /* body change highlights */
      const changed = MEAS_FIELDS.map(f => deltas[f[0]]).filter(d => d && d.n >= 2 && Math.abs(d.delta) >= 0.1)
        .sort((a, b) => a.delta - b.delta).slice(0, 5);
      if (changed.length) {
        h += '<div class="sec-label">Body changes</div><div class="card">' +
          changed.map(d => '<div class="kv"><span>' + esc(d.label) + '</span>' +
            '<b class="delta ' + (d.delta < 0 ? 'down' : 'up') + '">' + fmtSign(d.delta, 'cm', fmtCm) + '</b></div>').join('') +
          (tb ? '<div class="divider"></div><div class="kv" style="border:0"><span><b>Total body change</b></span><b class="delta ' + (tb.cm < 0 ? 'down' : tb.cm > 0 ? 'up' : 'flat') + '" style="font-size:16px">' + fmtSign(tb.cm, 'cm', fmtCm) + '</b></div>' : '') +
          '</div>';
      }

      if (!fi && !Store.state.weights.length) {
        h += '<div class="card"><div class="empty"><div class="big">🌱</div>Log your first injection or weight —<br>this page grows with you.</div></div>';
      }
      h += '<div class="footnote">These are your own milestones, computed from your logs — nothing to collect, just progress to notice.</div>';
      body.innerHTML = h;
    }
  });
}

        '<div class="kv"><span>At rest, per hour</span><b>' + Math.round(m.bmr / 24) + ' kcal</b></div>' +

            '<div class="footnote">As you lose weight your body needs a little less energy — normal, and part of why pace can slow. Recalculated from your latest weight every time.</div>';
        }
      } else {
        h += '<div class="footnote" style="margin:0">Each 1 kg of body weight changes your BMR by about 10 kcal/day. As your weight moves, this screen updates automatically from your newest weigh-in.</div>';
      }
      h += '</div>';

      /* projection at goal */
      if (set.goalKg) {
        const mGoal = metabolism(+set.goalKg);
        if (mGoal) {
          h += '<div class="sec-label">At your goal</div><div class="card">' +
            '<div class="kv"><span>BMR at ' + fmtKg(+set.goalKg) + ' kg</span><b>' + Math.round(mGoal.bmr) + ' kcal/day</b></div>' +
            '<div class="kv" style="border:0"><span>TDEE at goal</span><b>' + Math.round(mGoal.tdee) + ' kcal/day</b></div>' +
            '<div class="footnote">A rough guide to your energy needs once you reach your goal weight.</div></div>';
        }
      }

      /* activity picker */
      h += '<div class="sec-label">Activity level</div><div class="card">' +
        ACTIVITY_LEVELS.map(a =>
          '<button class="row" style="width:100%;text-align:left" data-act="set-activity" data-v="' + a[0] + '">' +
          '<div class="rmain"><div class="rtitle">' + a[1] + (set.activity === a[0] ? ' <span class="badge-day">current</span>' : '') + '</div>' +
          '<div class="rsub">' + a[2] + '</div></div>' +
          '<div class="rside"><div class="rval">×' + a[0] + '</div></div></button>'

      h += '<div class="card"><button class="btn btn-tonal" style="width:100%" data-act="metab-setup">Edit sex, birth date &amp; height</button></div>';
      h += '<div class="footnote">Mifflin-St Jeor equation — the current clinical standard. An estimate to guide you, not a medical prescription.</div>';
      body.innerHTML = h;
    }
  });

/* ---------------- calendar ---------------- */
const calState = { y: null, m: null, selKey: null };
function dayRecords(key) {
  const out = [];
  Store.state.injections.forEach(x => { if (dateKey(x.dateTime) === key) out.push({ type: 'inj', x }); });
  Store.state.weights.forEach(x => { if (dateKey(x.dateTime) === key) out.push({ type: 'w', x }); });
  Store.state.symptoms.forEach(x => { if (dateKey(x.dateTime) === key) out.push({ type: 'sym', x }); });
  Store.state.measurements.forEach(x => { if (dateKey(x.dateTime) === key) out.push({ type: 'm', x }); });
  Store.state.checkIns.forEach(x => { if (x.dateKey === key) out.push({ type: 'ci', x: Object.assign({ dateTime: x.dateKey + 'T12:00:00' }, x) }); });
  Store.state.cycles.forEach(x => { if (cycleCoversDay(x, key)) out.push({ type: 'cyc', x }); });
  return out.sort((p, q) => new Date(p.x.dateTime) - new Date(q.x.dateTime));
}
function openCalendarPage() {
  const now = new Date();
  calState.y = now.getFullYear(); calState.m = now.getMonth(); calState.selKey = dateKey(now);
  Pages.push({
    title: 'Calendar',
    render(body) {
      const { y, m } = calState;
      const cells = monthMatrix(y, m);
      const todayK = dateKey(new Date());
      /* dot map */
      const dots = {};
      const addDot = (k, color) => { (dots[k] = dots[k] || new Set()).add(color); };
      Store.state.injections.forEach(x => addDot(dateKey(x.dateTime), 'coral'));
      Store.state.weights.forEach(x => addDot(dateKey(x.dateTime), 'pink'));
      Store.state.symptoms.forEach(x => addDot(dateKey(x.dateTime), 'peach'));
      Store.state.measurements.forEach(x => addDot(dateKey(x.dateTime), 'mint'));
      Store.state.checkIns.forEach(x => addDot(x.dateKey, 'lav'));
      Store.state.cycles.forEach(x => {
        const n = x.endDate ? Math.min(30, Math.max(0, daysBetween(new Date(x.startDate), new Date(x.endDate)))) : 0;
        for (let i = 0; i <= n; i++) addDot(dateKey(new Date(new Date(x.startDate).getTime() + i * DAY)), 'teal');
      });
      let h = '<div class="card">';
      h += '<div class="cal-head"><button class="cal-nav" data-act="cal-prev">' + ic('chevL', 17) + '</button>' +
        '<b>' + DTF.mo.format(new Date(y, m, 1)) + '</b>' +
        '<button class="cal-nav" data-act="cal-next">' + ic('chevR', 17) + '</button></div>';
      h += '<div class="cal-grid">' + ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => '<div class="cal-dow">' + d + '</div>').join('');
      h += cells.map(c => {
        if (!c) return '<div></div>';
        const k = dateKey(c);
        const ds = dots[k] ? [...dots[k]] : [];
        return '<button class="cal-cell day' + (k === todayK ? ' today' : '') + (k === calState.selKey ? ' sel' : '') + '" data-act="cal-day" data-k="' + k + '">' +
          '<span class="num">' + c.getDate() + '</span>' +
          '<span class="cal-dots">' + ds.slice(0, 4).map(cl => '<i style="background:var(--' + cl + ')"></i>').join('') + '</span></button>';
      }).join('');
      h += '</div>';
      h += '<div class="cal-legend">' +
        '<span><i style="background:var(--coral)"></i>💉 shot</span>' +
        '<span><i style="background:var(--pink)"></i>⚖️ weight</span>' +
        '<span><i style="background:var(--peach)"></i>❤️ symptom</span>' +
        '<span><i style="background:var(--mint)"></i>📏 body</span>' +
        '<span><i style="background:var(--lav)"></i>📝 check-in</span>' +
        '<span><i style="background:var(--teal)"></i>🔴 period</span></div>';
      h += '</div>';
      /* selected day detail */
      if (calState.selKey) {
        const recs = dayRecords(calState.selKey);
        const selDate = new Date(calState.selKey + 'T12:00:00');
        h += '<div class="sec-label">' + fmtDate(selDate) + '</div>';
        if (!recs.length) h += '<div class="card"><div style="font-size:14px;color:var(--muted)">Nothing logged this day.</div></div>';
        else {
          h += '<div class="list">' + recs.map(r => {
            if (r.type === 'inj') return '<button class="row" style="width:100%;text-align:left" data-act="edit-injection" data-id="' + r.x.id + '"><div class="rmain"><div class="rtitle">💉 Injection · <span class="num">' + fmtMg(r.x.doseMg) + ' mg</span></div><div class="rsub">' + fmtTime(r.x.dateTime) + (r.x.site ? ' · ' + esc(r.x.site) : '') + '</div></div><span class="chev-ico">' + ic('chevR', 15) + '</span></button>';
            if (r.type === 'w') return '<button class="row" style="width:100%;text-align:left" data-act="edit-weight" data-id="' + r.x.id + '"><div class="rmain"><div class="rtitle">⚖️ Weight · <span class="num">' + fmtKg(r.x.kg) + ' kg</span></div><div class="rsub">' + fmtTime(r.x.dateTime) + '</div></div><span class="chev-ico">' + ic('chevR', 15) + '</span></button>';
            if (r.type === 'sym') return '<button class="row" style="width:100%;text-align:left" data-act="edit-symptom" data-id="' + r.x.id + '"><div class="rmain"><div class="rtitle">❤️ ' + esc(r.x.name) + '</div><div class="rsub" style="display:flex;gap:8px;align-items:center">' + sevDots(r.x.severity) + '<span>' + fmtTime(r.x.dateTime) + '</span></div></div><span class="chev-ico">' + ic('chevR', 15) + '</span></button>';
            if (r.type === 'm') return '<button class="row" style="width:100%;text-align:left" data-act="edit-measurement" data-id="' + r.x.id + '"><div class="rmain"><div class="rtitle">📏 Measurements</div><div class="rsub">' + MEAS_FIELDS.filter(f => r.x[f[0]] != null && r.x[f[0]] !== '').map(f => f[1] + ' ' + fmtCm(r.x[f[0]])).join(' · ') + '</div></div><span class="chev-ico">' + ic('chevR', 15) + '</span></button>';
            if (r.type === 'ci') return '<button class="row" style="width:100%;text-align:left" data-act="edit-checkin" data-id="' + r.x.id + '"><div class="rmain"><div class="rtitle">📝 Daily check-in</div><div class="rsub">' + (r.x.nothingToReport ? 'Nothing to report' : [r.x.appetite != null ? 'Appetite ' + r.x.appetite + '/5' : null, r.x.energy != null ? 'Energy ' + r.x.energy + '/5' : null].filter(Boolean).join(' · ') || 'Logged') + '</div></div><span class="chev-ico">' + ic('chevR', 15) + '</span></button>';
            const isStart = dateKey(r.x.startDate) === calState.selKey;
            const dayN = daysBetween(new Date(r.x.startDate), new Date(calState.selKey + 'T12:00:00')) + 1;
            return '<button class="row" style="width:100%;text-align:left" data-act="edit-cycle" data-id="' + r.x.id + '"><div class="rmain"><div class="rtitle">🔴 ' + (isStart ? 'Period start' : 'Period · day ' + dayN) + '</div><div class="rsub">' + fmtDate(r.x.startDate) + (r.x.endDate ? ' → ' + fmtDate(r.x.endDate) : '') + '</div></div><span class="chev-ico">' + ic('chevR', 15) + '</span></button>';
          }).join('') + '</div>';
        }
      }
      body.innerHTML = h;
    }
  });
}

/* -------- Daily Check-in -------- */
function openCheckInSheet(existingOrDateKey) {
  let existing = null, dateKeyDefault = dateKey(new Date());
  if (existingOrDateKey && typeof existingOrDateKey === 'object') existing = existingOrDateKey;
  else if (typeof existingOrDateKey === 'string') {
    existing = Store.state.checkIns.find(c => c.dateKey === existingOrDateKey) || null;
    dateKeyDefault = existingOrDateKey;
  }
  let appetite = existing ? existing.appetite : null;
  let energy = existing ? existing.energy : null;
  let gi = existing ? (existing.gi || []).slice() : [];
  Sheet.open({
    title: existing ? 'Edit check-in' : 'Daily check-in',
    sub: 'Everything here is optional — fill in only what you want to track.',
    html:
      '<div class="f-label">Date</div>' +
      '<input class="field" type="date" id="ci-date" value="' + (existing ? existing.dateKey : dateKeyDefault) + '">' +
      '<div class="f-label">Appetite</div>' +
      '<div class="sevpick" id="ci-appetite">' + [1, 2, 3, 4, 5].map(n => '<button class="sevbtn' + (n === appetite ? ' on' : '') + '" data-v="' + n + '">' + n + '</button>').join('') + '</div>' +
      '<div class="f-label">GI symptoms <span style="font-weight:400;color:var(--faint)">(optional, multi-select)</span></div>' +
      '<div class="chips" id="ci-gi">' + GI_PRESETS.map(p => '<button class="chip' + (gi.indexOf(p) >= 0 ? ' on' : '') + '" data-v="' + esc(p) + '">' + esc(p) + '</button>').join('') + '</div>' +
      '<div class="f-label">Energy</div>' +
      '<div class="sevpick" id="ci-energy">' + [1, 2, 3, 4, 5].map(n => '<button class="sevbtn' + (n === energy ? ' on' : '') + '" data-v="' + n + '">' + n + '</button>').join('') + '</div>' +
      '<div class="f-2col">' +
      '<div><div class="f-label" style="margin-top:0">Sleep (h:mm)</div><input class="field num" type="text" inputmode="decimal" id="ci-sleep" value="' + (existing && existing.sleepHours != null ? fmtHM(existing.sleepHours) : '') + '" placeholder="e.g. 7:30"></div>' +
      '<div><div class="f-label" style="margin-top:0">Protein (g)</div><input class="field num" type="text" inputmode="decimal" id="ci-protein" value="' + (existing && existing.proteinG != null ? existing.proteinG : '') + '" placeholder="optional"></div>' +
      '</div>' +
      '<div class="f-label">Calories</div>' +
      '<input class="field num" type="text" inputmode="decimal" id="ci-kcal" value="' + (existing && existing.kcal != null ? existing.kcal : '') + '" placeholder="optional">' +
      '<div class="f-label">Note <span style="font-weight:400;color:var(--faint)">(optional)</span></div>' +
      '<textarea class="field" id="ci-note" rows="2">' + esc(existing && existing.note || '') + '</textarea>' +
      '<div class="sheet-actions">' +
      (existing ? '<button class="btn btn-danger" id="ci-del">' + ic('trash', 17) + '</button>' : '') +
      '<button class="btn btn-primary" id="ci-save" style="flex:1">' + (existing ? 'Save changes' : 'Log check-in') + '</button></div>',
    mount(el, close) {
      $('#ci-appetite', el).addEventListener('click', e => { const b = e.target.closest('.sevbtn'); if (!b) return; appetite = +b.dataset.v; $$('.sevbtn', $('#ci-appetite', el)).forEach(x => x.classList.toggle('on', +x.dataset.v === appetite)); });
      $('#ci-energy', el).addEventListener('click', e => { const b = e.target.closest('.sevbtn'); if (!b) return; energy = +b.dataset.v; $$('.sevbtn', $('#ci-energy', el)).forEach(x => x.classList.toggle('on', +x.dataset.v === energy)); });
      $('#ci-gi', el).addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; const v = b.dataset.v; const i = gi.indexOf(v); if (i >= 0) gi.splice(i, 1); else gi.push(v); b.classList.toggle('on'); });
      $('#ci-save', el).addEventListener('click', async () => {
        const dk = $('#ci-date', el).value;
        if (!dk) return toast('Set a date');
        /* validate numbers first so a bad entry never discards an existing check-in */
        const sleepRaw = $('#ci-sleep', el).value.trim(), sleep = parseHM(sleepRaw);
        const protein = parseNumStrict($('#ci-protein', el).value), kcal = parseNumStrict($('#ci-kcal', el).value);
        if (sleepRaw && (sleep == null || sleep > 24)) return toast('Sleep looks like 7:30 (hours:minutes)');
        if (Number.isNaN(protein) || (protein != null && (protein < 0 || protein > 500))) return toast('Protein: enter grams, 0–500');
        if (Number.isNaN(kcal) || (kcal != null && (kcal < 0 || kcal > 10000))) return toast('Calories: enter a number, 0–10,000');
        /* never silently create two check-ins for one date: if this date (new or edited-to)
           already holds a different check-in, ask before replacing it */
        const collision = Store.state.checkIns.find(c => c.dateKey === dk && (!existing || c.id !== existing.id));
        if (collision) {
          const ok = await confirmDlg('Replace existing check-in?', fmtDate(dk + 'T12:00:00') + ' already has a check-in. Replacing it will discard that entry and keep this one instead.', 'Replace', true);
          if (!ok) return;
          Actions.deleteCheckIn(collision.id);
        }
        Actions.saveCheckIn({ id: existing ? existing.id : null, dateKey: dk, appetite, gi, energy, sleepHours: sleep, proteinG: protein, kcal, note: $('#ci-note', el).value.trim(), nothingToReport: false });
        close(); toast(existing ? 'Check-in updated' : 'Check-in logged');
      });
      if (existing) $('#ci-del', el).addEventListener('click', async () => {
        if (await confirmDlg('Delete this check-in?', fmtDate(existing.dateKey + 'T12:00:00'), 'Delete', true)) { Actions.deleteCheckIn(existing.id); close(); toast('Deleted'); }
      });
    }
  });
}

/* -------- Check-ins page: add or fix any recent day (reached from Settings) -------- */
/* earliest day with any logged data (cycles excluded) — nothing before it is worth a check-in row */
function trackingStartKey() {
  const S = Store.state, ks = [];
  S.checkIns.forEach(c => ks.push(c.dateKey));
  ['weights', 'injections', 'symptoms', 'measurements', 'workouts'].forEach(n => S[n].forEach(x => { if (x.dateTime) ks.push(dateKey(x.dateTime)); }));
  return ks.length ? ks.sort()[0] : null;
}
function openCheckInsPage() {
  let days = 14;
  Pages.push({
    title: 'Check-ins',
    render(body) {
      const S = Store.state, now = new Date();
      let h = '<div class="footnote" style="margin:0 0 12px">Tap a day to add or fix its check-in — for a day you missed, or one you dismissed by mistake.</div><div class="list">';
      const floor = trackingStartKey();
      let reachedStart = false;
      for (let i = 0; i < days; i++) {
        const d = new Date(now); d.setDate(d.getDate() - i);
        const k = dateKey(d);
        if (floor && k < floor) { reachedStart = true; break; }
        const c = S.checkIns.find(x => x.dateKey === k);
        let status;
        if (!c) status = 'Not logged';
        else if (c.nothingToReport && !checkInHasData(c)) status = 'Nothing to report';
        else status = [c.appetite != null ? 'Appetite ' + c.appetite + '/5' : null, c.energy != null ? 'Energy ' + c.energy + '/5' : null, c.proteinG != null ? Math.round(c.proteinG) + ' g protein' : null, (c.gi && c.gi.length) ? c.gi.join(', ') : null].filter(Boolean).join(' · ') || 'Logged';
        const label = (i === 0 ? 'Today · ' : i === 1 ? 'Yesterday · ' : '') + fmtDate(k + 'T12:00:00');
        h += '<div class="row"><button class="rmain" style="text-align:left;background:none;border:0;padding:0" data-act="ci-day" data-k="' + k + '"><div class="rtitle">' + esc(label) + '</div>' +
          '<div class="rsub"' + (c ? '' : ' style="color:var(--coral-deep)"') + '>' + esc(status) + '</div></button>' +
          (c ? '<span class="chev-ico">' + ic('chevR', 15) + '</span>' : '<button class="btn btn-tonal btn-sm" style="flex:none" data-act="ci-nothing-day" data-k="' + k + '">Nothing to report</button>') + '</div>';
      }
      h += '</div>' + (reachedStart ? '' : '<button class="btn btn-tonal" style="width:100%;margin-top:12px" data-act="ci-more">Show earlier days</button>') +
        '<button class="btn btn-ghost" style="width:100%;margin-top:8px" data-act="add-checkin">Pick any other date…</button>';
      body.innerHTML = h;
    }
  });
  openCheckInsPage.page = { more() { days += 14; } };
}
function checkInHasData(c) {
  if (!c) return false;
  return !!(c.appetite != null || (c.gi && c.gi.length) || c.energy != null || c.sleepHours != null || c.proteinG != null || c.kcal != null || (c.note && c.note.trim()));
}
function logNothingToReportToday() {
  const dk = dateKey(new Date());
  const existing = Store.state.checkIns.find(c => c.dateKey === dk);
  if (checkInHasData(existing)) { toast('Today already has a check-in with data — edit it instead of overwriting it.'); return; }
  Actions.saveCheckIn({ id: existing ? existing.id : null, dateKey: dk, nothingToReport: true, appetite: null, gi: [], energy: null, sleepHours: null, proteinG: null, kcal: null, note: '' });
  toast('Noted — good days count too 🌿');
}

        '<button class="btn btn-tonal btn-sm" data-act="edit-cycle" data-id="' + lastC.id + '">Pick the end date</button></div></div>';
      h += '<div class="sec-label">History</div><div class="list">' + info.starts.slice().reverse().map(c => {

          '</div><span class="chev-ico">' + ic('chevR', 15) + '</span></button>';

/* -------- Dose Story: a Wrapped-style recap of one confirmed dose period.
   Only real logged data goes in; any slide without enough data is simply skipped. -------- */
function periodPaceKgPerWeek(p, daily) {
  const chg = weightChangeForPeriod(p, daily);
  if (!chg) return null;
  const span = (new Date(chg.endK + 'T12:00:00') - new Date(chg.startK + 'T12:00:00')) / DAY;
  return span >= 7 ? chg.delta / span * 7 : null;
}
function doseStorySlides(idx) {
  const periods = dosePeriods();
  const p = periods[idx];
  if (!p) return [];
  const S = Store.state, cur = S.settings.currency;
  const startMs = new Date(p.startDate).getTime(), endMs = p.endDate ? new Date(p.endDate).getTime() : Date.now();
  const startK = dateKey(p.startDate), endK = dateKey(p.endDate || new Date());
  const inRange = k => k >= startK && (p.endDate ? k < endK : k <= endK);
  const days = Math.max(1, Math.round((endMs - startMs) / DAY));
  const nInj = p.injections.length;
  const slides = [];
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const n1 = v => String(Math.round(v * 10) / 10).replace('.', ',');

  slides.push({ cls: 'st-coral', emoji: '💉', kicker: 'Dose story', big: fmtMg(p.doseMg) + ' mg',
    sub: fmtDate(p.startDate) + (p.endDate ? ' → ' + fmtDate(p.endDate) : ' → now'),
    foot: days + ' day' + (days === 1 ? '' : 's') + ' · ' + nInj + ' injection' + (nInj === 1 ? '' : 's') });

  const daily = dailyWeightSeries();
  const chg = weightChangeForPeriod(p, daily);
  if (chg) {
    const pace = periodPaceKgPerWeek(p, daily);
    slides.push({ cls: 'st-teal', emoji: '⚖️', kicker: 'On the scale', big: fmtSign(chg.delta, 'kg'),
      sub: fmtKg(chg.startKg) + ' → ' + fmtKg(chg.endKg) + ' kg',
      foot: (pace != null ? 'About ' + fmtKg(Math.abs(pace)) + ' kg per week ' + (pace < 0 ? 'down' : pace > 0 ? 'up' : 'steady') + ' · ' : '') + chg.n + ' weigh-in day' + (chg.n === 1 ? '' : 's') });
  }

  const cis = S.checkIns.filter(c => inRange(c.dateKey));
  const withData = cis.filter(c => !c.nothingToReport);
  if (cis.length >= 3) {
    const ap = avg(cis.map(c => c.appetite).filter(v => v != null));
    const en = avg(cis.map(c => c.energy).filter(v => v != null));
    const pr = avg(cis.map(c => c.proteinG).filter(v => v != null));
    const sl = avg(cis.map(c => c.sleepHours).filter(v => v != null));
    const lines = [];
    if (ap != null) lines.push('Appetite <b>' + n1(ap) + '/5</b>');
    if (en != null) lines.push('Energy <b>' + n1(en) + '/5</b>');
    if (pr != null) lines.push('Protein <b>' + Math.round(pr) + ' g</b> a day');

  return keys;

async function finishWorkout() {
  const d = Store.state.meta.workoutDraft; if (!d) return;
  const clean = (kind, s) => {
    const v = k => (s[k] === '' || s[k] == null) ? null : s[k];
    return kind === 'treadmill' ? { incline: v('incline'), min: v('min'), speed: v('speed') } : kind === 'level' ? { level: v('level'), min: v('min') } : kind === 'check' ? {} : { kg: v('kg'), reps: v('reps') };
  };
  const entries = d.entries.map(e => {
    const out = { name: e.name, equipId: e.equipId || null, kind: e.kind, phase: e.phase || 'main', region: e.region || regionOfName(e.name), sets: e.sets.filter(s => s.done).map(s => clean(e.kind, s)) };
    if ((e.note || '').trim()) out.note = e.note.trim();
    return out;
  }).filter(e => e.sets.length);
  if (!entries.length) { toast('Tick at least one item first'); return; }
  const today = dateKey(new Date());
  const dt = d.editingId ? new Date(d.startedAt) : (d.dateKey === today ? new Date(d.startedAt) : new Date(d.dateKey + 'T12:00:00'));
  if (d.editingId && d.dateKey !== dateKey(d.startedAt)) dt.setTime(new Date(d.dateKey + 'T12:00:00').getTime());
  const prs = [];
  entries.forEach(e => {
    if (!isStrength(e.kind)) return;
    const hist = exerciseHistory(e.name, dt.getTime(), d.editingId);
    if (!hist.length) return;
    const before = exerciseBest(hist), now = exerciseBest([{ e }]);
    if (now.e1 > before.e1 + 0.01) prs.push({ name: e.name, set: now.bestSet });
  });
  const rec = { id: d.editingId || null, dateTime: dt.toISOString(), programId: d.programId || null, programName: d.programName || '', dayName: d.dayName || '', note: (d.note || '').trim(), entries };
  Store.state.meta.workoutDraft = null;
  const saved = Actions.saveWorkout(rec);
  Pages.pop(false);
  setTimeout(() => openWorkoutDetailSheet(saved.id, true), 340);
  if (prs.length) Celebrate.show(prs.slice(0, 5).map(p => ({ emoji: '🏅', kicker: 'Personal record', title: p.name, sub: fmtW(p.set.kg) + ' kg × ' + p.set.reps })));
}
function programFromWorkout(w, name) {
  const items = (w.entries || []).map(e => {
    const kind = normKind(e.kind), s0 = e.sets[0] || {};
    const it = { phase: e.phase || 'main', name: e.name, sets: kind === 'strength' ? e.sets.length : 1, reps: '' };
    if (kind === 'strength') { it.reps = s0.reps != null ? String(s0.reps) : ''; it.kg = s0.kg != null ? s0.kg : null; }
    else if (kind === 'treadmill') { it.min = s0.min != null ? s0.min : null; it.incline = s0.incline != null ? s0.incline : null; it.speed = s0.speed != null ? s0.speed : null; it.reps = it.min ? it.min + ' min' : ''; }
    else if (kind === 'level') { it.min = s0.min != null ? s0.min : null; it.level = s0.level != null ? s0.level : null; it.reps = it.min ? it.min + ' min' : ''; }
    return it;
  });
  const order = PHASES.map(p => p[0]);
  items.sort((a, b) => order.indexOf(a.phase) - order.indexOf(b.phase));
  return { name, note: 'Saved from your ' + DTF.mdy.format(new Date(w.dateTime)) + ' workout.', days: [{ id: uid(), name, items }] };
}

/* -------- Records: personal bests, all derived from logs -------- */
function bestRun(keys) {
  const ks = [...new Set(keys)].sort();
  let best = { len: 0, endK: null }, run = 0, prev = null;
  ks.forEach(k => {
    run = (prev && Math.round((new Date(k + 'T12:00:00') - new Date(prev + 'T12:00:00')) / DAY) === 1) ? run + 1 : 1; prev = k;
    if (run > best.len) best = { len: run, endK: k };
  });
  return best;
}
function currentDayStreak(keys) {
  const set = new Set(keys); let d = new Date(); d.setHours(12, 0, 0, 0);
  if (!set.has(dateKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (set.has(dateKey(d)) && n < 1000) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function recordsList() {
  const S = Store.state, out = [];

  const sw = startWeight(), cur = daily.length ? daily[daily.length - 1] : null;
  if (sw != null && cur && sw - cur.kg > 0) add('🪜', 'Total down', fmtKg(sw - cur.kg) + ' kg', cur.k, 'from ' + fmtKg(sw) + ' to ' + fmtKg(cur.kg));
  if (daily.length) { const lo = daily.reduce((b, x) => x.kg < b.kg ? x : b); add('⚖️', 'Lowest weight', fmtKg(lo.kg) + ' kg', lo.k); }
  let best = null;
  for (let i = 0; i < daily.length; i++) for (let j = i + 1; j < daily.length; j++) {
    const span = (new Date(daily[j].k + 'T12:00:00') - new Date(daily[i].k + 'T12:00:00')) / DAY;
    if (span >= 5 && span <= 9) { const d = daily[j].kg - daily[i].kg; if (!best || d < best.d) best = { d, a: daily[i], b: daily[j], span }; }
  }
  if (best && best.d < -0.2) add('📉', 'Steepest week', fmtSign(best.d, 'kg'), best.b.k, DTF.md.format(new Date(best.a.k + 'T12:00:00')) + ' → ' + DTF.md.format(new Date(best.b.k + 'T12:00:00')));
  const prot = S.checkIns.filter(c => c.proteinG != null);

  const ci = bestRun(S.checkIns.map(c => c.dateKey));

  if (target > 0) {

    const wws = maxWeekStreakKeys(wdays);

    let heavy = null, big = null;
    S.workouts.forEach(w => {
      (w.entries || []).forEach(e => { if (!isStrength(e.kind)) return; e.sets.forEach(st => { if (+st.kg > 0 && (!heavy || +st.kg > heavy.kg)) heavy = { kg: +st.kg, reps: st.reps, name: e.name, k: dateKey(w.dateTime) }; }); });
      const v = workoutVolume(w); if (v > 0 && (!big || v > big.v)) big = { v, k: dateKey(w.dateTime) };

  if (ms.length >= 2) {

    MEAS_FIELDS.forEach(f => { const a = ms[0][f[0]], b = ms[ms.length - 1][f[0]]; if (a != null && b != null && (!bestM || (b - a) < bestM.d)) bestM = { d: b - a, label: f[1] }; });
    if (bestM && bestM.d < 0) add('📏', 'Biggest tape change', fmtSign(bestM.d, 'cm', fmtCm), dateKey(ms[ms.length - 1].dateTime), bestM.label + ', first session → latest');
  }
  return out;
}

/* -------- Heatmap: one square per day, week by week -------- */
let heatMetric = 'checkin';
function heatLevel(metric, day) {
  const S = Store.state, c = S.checkIns.find(x => x.dateKey === day);
  const target = +S.settings.proteinTarget || 0;
  if (metric === 'checkin') return !c ? 0 : (c.nothingToReport && !checkInHasData(c)) ? 2 : 4;
  if (metric === 'protein') { if (!c || c.proteinG == null) return 0; if (target > 0) { const r = c.proteinG / target; return r >= 1 ? 4 : r >= .8 ? 3 : r >= .5 ? 2 : 1; } return c.proteinG >= 100 ? 4 : c.proteinG >= 70 ? 3 : c.proteinG >= 40 ? 2 : 1; }
  if (metric === 'energy') return (!c || c.energy == null) ? 0 : Math.max(1, Math.min(4, Math.round(c.energy * 0.8)));
  if (metric === 'sleep') { if (!c || c.sleepHours == null) return 0; const h = +c.sleepHours; return h >= 8 ? 4 : h >= 7 ? 3 : h >= 6 ? 2 : 1; }
  if (metric === 'weight') return dailyWeightSeries().some(d => d.k === day) ? 4 : 0;
  if (metric === 'workout') { const ws = S.workouts.filter(w => dateKey(w.dateTime) === day); if (!ws.length) return 0; const sets = ws.reduce((a, w) => a + strengthSetCount(w), 0); return sets >= 18 ? 4 : sets >= 12 ? 3 : sets >= 6 ? 2 : 1; }
  return 0;
}
function heatDetail(metric, day) {

    if (c.sleepHours != null) bits.push(fmtHM(c.sleepHours) + ' sleep');
    if (c.nothingToReport && !checkInHasData(c)) bits.push('nothing to report');
  }

  if (Store.state.injections.some(i => dateKey(i.dateTime) === day)) bits.push('shot day');
  return DTF.mdy.format(new Date(day + 'T12:00:00')) + ' — ' + (bits.length ? bits.join(' · ') : 'nothing logged');
}

/* -------- Cycle × how you feel -------- */
function cyclePatternBuckets() {
  const S = Store.state;
  const cycles = S.cycles.filter(c => c.startDate).slice().sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
  if (cycles.length < 2) return [];
  const defs = [['period', 'Period days'], ['early', 'After the period → day 14'], ['late', 'Day 15 → next period']];
  const acc = {}; defs.forEach(d => { acc[d[0]] = { key: d[0], label: d[1], n: 0, a: [], e: [], p: [], s: [] }; });
  S.checkIns.forEach(c => {
    const t = new Date(c.dateKey + 'T12:00:00').getTime();
    let idx = -1; cycles.forEach((cy, i) => { if (dateKey(cy.startDate) <= c.dateKey) idx = i; });
    if (idx < 0) return;
    const cy = cycles[idx], next = cycles[idx + 1];
    const dayN = Math.round((t - new Date(dateKey(cy.startDate) + 'T12:00:00').getTime()) / DAY) + 1;
    if (!next && dayN > 40) return;                       /* too long since the last logged start to say anything */
    const endDay = cy.endDate ? Math.round((new Date(dateKey(cy.endDate) + 'T12:00:00').getTime() - new Date(dateKey(cy.startDate) + 'T12:00:00').getTime()) / DAY) + 1 : 5;
    const b = acc[dayN <= endDay ? 'period' : dayN <= 14 ? 'early' : 'late'];
    b.n++;
    if (c.appetite != null) b.a.push(+c.appetite);
    if (c.energy != null) b.e.push(+c.energy);
    if (c.proteinG != null) b.p.push(+c.proteinG);
    if (c.sleepHours != null) b.s.push(+c.sleepHours);
  });
  const avg = a => a.length >= 3 ? a.reduce((x, y) => x + y, 0) / a.length : null;
  return defs.map(d => { const b = acc[d[0]]; return { key: b.key, label: b.label, n: b.n, appetite: avg(b.a), energy: avg(b.e), protein: avg(b.p), sleep: avg(b.s) }; }).filter(b => b.n >= 3);
}

/* -------- Today's expectation: what this day-after-shot has looked like for you before -------- */
function expectationCard(now) {
  const S = Store.state;
  const li = lastInjectionBefore(S.injections, now.getTime());
  if (!li) return '';
  const day = daysBetween(new Date(li.dateTime), now) + 1;
  if (day < 1 || day > 8) return '';
  const tgt = +S.settings.proteinTarget || 0;
  const n1 = v => String(Math.round(v * 10) / 10).replace('.', ',');
  const stat = f => {
    const all = S.checkIns.filter(c => c[f] != null);
    const mine = all.filter(c => dayAfterInjection(S.injections, c.dateKey + 'T12:00:00') === day);
    if (mine.length < 3 || all.length < 12) return null;
    const avg = a => a.reduce((x, y) => x + (+y[f]), 0) / a.length;
    return { n: mine.length, mine: avg(mine), all: avg(all) };
  };
  const ap = stat('appetite'), en = stat('energy'), pr = stat('proteinG');
  const parts = [];
  if (ap && Math.abs(ap.mine - ap.all) >= 0.4) parts.push('appetite ' + n1(ap.mine) + '/5 <span style="opacity:.65">(usually ' + n1(ap.all) + ')</span>');
  if (en && Math.abs(en.mine - en.all) >= 0.4) parts.push('energy ' + n1(en.mine) + '/5 <span style="opacity:.65">(usually ' + n1(en.all) + ')</span>');
  if (pr && Math.abs(pr.mine - pr.all) >= 8) parts.push('protein ' + Math.round(pr.mine) + ' g <span style="opacity:.65">(usually ' + Math.round(pr.all) + ')</span>');
  if (!parts.length) return '';
  const n = Math.max(ap ? ap.n : 0, en ? en.n : 0, pr ? pr.n : 0);
  const tip = (pr && tgt > 0 && pr.mine < tgt - 8) ? ' Protein tends to dip around now — worth lining up one easy protein-rich meal.' : '';
  return '<div class="banner fadeup" style="background:var(--lav-soft);color:var(--lav-deep)">🔮 <b>Day ' + day + ' after your shot.</b> Across your ' + n + ' earlier day-' + day + 's: ' + parts.join(', ') + '.' + tip + '</div>';
}

/* -------- Goal Road: stops between start and goal, with sealed notes to future-you -------- */
function goalRoad() {
  const set = Store.state.settings, sw = startWeight(), goal = +set.goalKg;
  if (!goal || sw == null) return { reason: 'nogoal' };
  if (!(goal < sw)) return { reason: 'direction' };
  const range = sw - goal;
  const step = [1, 2, 2.5, 5, 10, 20].find(st => Math.floor(range / st) + 1 <= 10) || 20;
  const r1 = v => Math.round(v * 10) / 10;
  const kgs = [];
  for (let k = 1; sw - k * step > goal + 0.2; k++) kgs.push(r1(sw - k * step));
  kgs.push(r1(goal));
  const daily = dailyWeightSeries(), rolling = weightRollingAvg(7, 3, daily);
  const notes = set.roadNotes || {};
  const stops = kgs.map((kg, i) => {
    const c = firstCrossBelow(kg, rolling, daily);
    return { kg, key: kg.toFixed(1), isGoal: i === kgs.length - 1, reached: !!c, at: c ? c.atT : null, note: notes[kg.toFixed(1)] || '' };
  });
  return { start: sw, goal, stops, current: daily.length ? daily[daily.length - 1].kg : null };
}

  const gi = c.gi || [];

  if (gi.indexOf('Nausea') >= 0) return { emoji: '🫖', text: 'Nausea today: small, bland bites and slow sips usually sit easier. If it keeps up, mention it to your doctor.' };
  if (gi.length) return { emoji: '🫖', text: 'Your gut is voting today. Go easy — warm, simple food and water.' };
  if (c.energy != null && c.energy <= 2) return { emoji: '🔋', text: pick(['Low-battery day. Protein, water, and permission to do less are all valid plans.', 'Running low today — keep the bar small and count the basics as a win.', 'Low energy is information, not failure. Something easy and protein-y, then rest.']) };

/* ================= Insights Lab + Explore Your Data =================
   One analysis engine, two ways in: the Lab (you pick variables) and Explore (Tempo suggests
   questions the records can actually answer). Everything is computed on-device from your own
   logs. Missing days are never counted as zero; small samples are labelled, not dressed up. */
const LAB_COLORS = ['var(--coral)', 'var(--teal)', 'var(--lav-deep)'];
function labAddDays(k, n) { return dateKey(new Date(new Date(k + 'T12:00:00').getTime() + n * DAY)); }
function labMean(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }
function labFmt(v, dec) { if (v == null || !isFinite(v)) return '—'; const p = Math.pow(10, dec == null ? 1 : dec); return String(Math.round(v * p) / p).replace('.', ','); }
function labPearson(xs, ys) {
  const n = xs.length; if (n < 3) return null;
  const mx = labMean(xs), my = labMean(ys);
  let sxx = 0, syy = 0, sxy = 0;
  for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
  if (sxx === 0 || syy === 0) return null;
  return sxy / Math.sqrt(sxx * syy);
}
function labRanks(a) {
  const idx = a.map((v, i) => [v, i]).sort((p, q) => p[0] - q[0]), r = new Array(a.length);
  for (let i = 0; i < idx.length;) {
    let j = i; while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++;
    const rank = (i + j) / 2 + 1; for (let k = i; k <= j; k++) r[idx[k][1]] = rank; i = j + 1;
  }

}
function labSpearman(xs, ys) { return labPearson(labRanks(xs), labRanks(ys)); }
/* 95% interval for r (Fisher z); only offered from n = 10 */
function labCI(r, n) { if (r == null || n < 10 || Math.abs(r) >= 0.999) return null; const z = Math.atanh(r), se = 1 / Math.sqrt(n - 3); return [Math.tanh(z - 1.96 * se), Math.tanh(z + 1.96 * se)]; }
function labStrength(r) { const a = Math.abs(r); return a < 0.2 ? 'little to no' : a < 0.4 ? 'a weak' : a < 0.6 ? 'a moderate' : 'a strong'; }

/* ---- variables ---- */
const LAB_VARS = [
  { id: 'weight', label: 'Weight', unit: 'kg', kind: 'daily', agg: 'mean', dec: 1 },
  { id: 'weightDev', label: 'Weight vs. nearby weigh-ins', unit: 'kg', kind: 'event', agg: 'mean', dec: 1, hint: 'each weigh-in minus the average of weigh-ins within 3 days either side (needs 2 neighbours)' },
  { id: 'sleep', label: 'Sleep', unit: 'h', kind: 'daily', agg: 'mean', dec: 1 },
  { id: 'energy', label: 'Energy', unit: '/5', kind: 'daily', agg: 'mean', dec: 1 },
  { id: 'appetite', label: 'Appetite', unit: '/5', kind: 'daily', agg: 'mean', dec: 1 },
  { id: 'protein', label: 'Protein', unit: 'g', kind: 'daily', agg: 'mean', dec: 0 },
  { id: 'kcal', label: 'Calories', unit: 'kcal', kind: 'daily', agg: 'mean', dec: 0 },
  { id: 'symptom', label: 'Symptom severity', unit: '/5', kind: 'event', agg: 'max', dec: 1, hint: 'worst symptom logged that day; days without an entry are left out, not counted as none' },
  { id: 'workoutDay', label: 'Workout day', unit: '', kind: 'daily', agg: 'sum7', dec: 0, weekLabel: 'Workout days / week', hint: 'counted from your first logged session onward (1 = trained, 0 = no session logged)' },
  { id: 'workoutSets', label: 'Strength sets', unit: 'sets', kind: 'event', agg: 'sum', dec: 0 },
  { id: 'workoutVol', label: 'Training volume', unit: 'kg', kind: 'event', agg: 'sum', dec: 0 },
  { id: 'dose', label: 'Dose', unit: 'mg', kind: 'event', agg: 'mean', dec: 2 }
].concat(MEAS_FIELDS.map(f => ({ id: 'm:' + f[0], label: f[1] + ' (measured)', unit: 'cm', kind: 'event', agg: 'mean', dec: 1, field: f[0] })));
function labVar(id) { return LAB_VARS.find(v => v.id === id) || null; }
function labVarName(id, gran) { const v = labVar(id); if (!v) return ''; return gran === 'week' && v.weekLabel ? v.weekLabel : v.label; }

function labDaily(id) {
  const S = Store.state, m = new Map();
  const put = (k, v) => { if (v != null && isFinite(v)) m.set(k, v); };
  if (id === 'weight') dailyWeightSeries().forEach(d => put(d.k, d.kg));
  else if (id === 'weightDev') {
    const ds = dailyWeightSeries();
    ds.forEach(d => { const nb = ds.filter(o => o !== d && Math.abs(o.t - d.t) <= 3 * DAY); if (nb.length >= 2) put(d.k, d.kg - labMean(nb.map(o => o.kg))); });
  } else if (id === 'sleep' || id === 'energy' || id === 'appetite' || id === 'protein' || id === 'kcal') {
    const f = { sleep: 'sleepHours', energy: 'energy', appetite: 'appetite', protein: 'proteinG', kcal: 'kcal' }[id];
    S.checkIns.forEach(c => { const v = c[f]; if (v == null || v === '' || !isFinite(+v)) return; if ((id === 'energy' || id === 'appetite') || +v > 0) put(c.dateKey, +v); });
  } else if (id === 'symptom') {
    S.symptoms.forEach(s => { const k = dateKey(s.dateTime); put(k, Math.max(m.get(k) || 0, +s.severity || 0)); });
  } else if (id === 'workoutDay') {
    if (S.workouts.length) {
      const days = new Set(S.workouts.map(w => dateKey(w.dateTime))), first = [...days].sort()[0], today = dateKey(new Date());
      for (let k = first; k <= today; k = labAddDays(k, 1)) put(k, days.has(k) ? 1 : 0);
    }
  } else if (id === 'workoutSets' || id === 'workoutVol') {
    S.workouts.forEach(w => { const k = dateKey(w.dateTime); const v = id === 'workoutSets' ? strengthSetCount(w) : workoutVolume(w); if (v > 0) put(k, (m.get(k) || 0) + v); });
  } else if (id === 'dose') {
    S.injections.forEach(i => { const k = dateKey(i.dateTime); put(k, (m.get(k) || 0) + (+i.doseMg || 0)); });
  } else if (id.indexOf('m:') === 0) {
    const f = id.slice(2);
    S.measurements.slice().sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime)).forEach(x => { if (+x[f] > 0) put(dateKey(x.dateTime), +x[f]); });
  }
  return m;
}
function labWeekly(daily, agg) {
  const wk = new Map();
  daily.forEach((v, k) => { const wi = weekIndex(new Date(k + 'T12:00:00')); if (!wk.has(wi)) wk.set(wi, []); wk.get(wi).push(v); });
  const out = new Map();
  wk.forEach((arr, wi) => {
    let v;
    if (agg === 'sum7') { if (arr.length < 7) return; v = arr.reduce((a, b) => a + b, 0); }
    else if (agg === 'sum') v = arr.reduce((a, b) => a + b, 0);
    else if (agg === 'max') v = Math.max.apply(null, arr);
    else v = labMean(arr);
    out.set(dateKey(new Date(WEEK_ANCHOR + wi * 7 * DAY + 12 * 3600000)), v);
  });

}
function labMapAll(id, gran) { const v = labVar(id); const d = labDaily(id); return gran === 'week' ? labWeekly(d, v ? v.agg : 'mean') : d; }
function labRangeKeys(r) {
  const today = dateKey(new Date());
  if (r.preset === 'custom' && r.from && r.to && r.from <= r.to) return { from: r.from, to: r.to };
  if (r.preset === 'all') return { from: trackingStartKey() || today, to: today };
  const n = r.preset === '30' ? 30 : r.preset === '14' ? 14 : 90;
  return { from: labAddDays(today, -(n - 1)), to: today };
}
function labInRange(map, from, to) { const out = []; map.forEach((v, k) => { if (k >= from && k <= to) out.push({ k, v }); }); out.sort((a, b) => a.k < b.k ? -1 : 1); return out; }
function labSlots(gran, from, to) { const d = daysBetween(new Date(from + 'T12:00:00'), new Date(to + 'T12:00:00')) + 1; return gran === 'week' ? Math.max(1, Math.ceil(d / 7)) : d; }
function labCoverage(id, gran, range) {
  const pts = labInRange(labMapAll(id, gran), range.from, range.to);
  return { id, n: pts.length, slots: labSlots(gran, range.from, range.to), pts };
}
function labPairs(aId, bId, gran, lag, range) {
  const A = labInRange(labMapAll(aId, gran), range.from, range.to), B = labMapAll(bId, gran);
  const pairs = [];
  A.forEach(p => { const tk = labAddDays(p.k, gran === 'week' ? 7 * lag : lag); if (B.has(tk)) pairs.push({ k: p.k, tk, x: p.v, y: B.get(tk) }); });
  return pairs;
}
function labPairStats(pairs) {

  if (n < 8) return { n, enough: false };
  const r = labPearson(xs, ys);

/* ---- groupers ---- */
const LAB_GROUPS = [['injDay', 'Injection day'], ['cycle', 'Cycle phase'], ['weekday', 'Weekday']];
function labGrouper(gid) {
  const S = Store.state;
  if (gid === 'injDay') return k => { const d = dayAfterInjection(S.injections, k + 'T12:00:00'); return d == null || d > 10 ? null : { o: d, label: 'Day ' + d }; };
  if (gid === 'weekday') { const nm = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']; return k => { const o = (new Date(k + 'T12:00:00').getDay() + 6) % 7; return { o, label: nm[o] }; }; }
  const cycles = S.cycles.filter(c => c.startDate).slice().sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
  if (cycles.length < 2) return () => null;
  const defs = { period: [0, 'Period days'], early: [1, 'After period → day 14'], late: [2, 'Day 15 → next period'] };
  return k => {
    const t = new Date(k + 'T12:00:00').getTime();
    let idx = -1; cycles.forEach((cy, i) => { if (dateKey(cy.startDate) <= k) idx = i; });
    if (idx < 0) return null;
    const cy = cycles[idx], next = cycles[idx + 1];
    const dayN = Math.round((t - new Date(dateKey(cy.startDate) + 'T12:00:00').getTime()) / DAY) + 1;
    if (!next && dayN > 40) return null;
    const endDay = cy.endDate ? Math.round((new Date(dateKey(cy.endDate) + 'T12:00:00').getTime() - new Date(dateKey(cy.startDate) + 'T12:00:00').getTime()) / DAY) + 1 : 5;
    const key = dayN <= endDay ? 'period' : dayN <= 14 ? 'early' : 'late';
    return { o: defs[key][0], label: defs[key][1] };
  };
}
function labGroups(varId, gid, range, minN) {
  const g = labGrouper(gid), pts = labInRange(labDaily(varId), range.from, range.to), acc = new Map();
  pts.forEach(p => { const gr = g(p.k); if (!gr) return; if (!acc.has(gr.o)) acc.set(gr.o, { o: gr.o, label: gr.label, vals: [], keys: [] }); const e = acc.get(gr.o); e.vals.push(p.v); e.keys.push(p.k); });
  return [...acc.values()].sort((a, b) => a.o - b.o).map(e => ({ o: e.o, label: e.label, n: e.vals.length, mean: labMean(e.vals), keys: e.keys, vals: e.vals })).filter(e => e.n >= (minN || 1));
}

/* ---- charts ---- */
function labAxisDates(from, to) { return [from, to].map(k => DTF.md.format(new Date(k + 'T12:00:00'))); }
function labTimeSVG(series, gran, range) {

  const X = t => p.l + (t - t0) / ((t1 - t0) || 1) * (w - p.l - p.r), Y = u => h - p.b - u * (h - p.t - p.b);

   Photos live ONLY in this device's IndexedDB. They are never part of the JSON backup, Drive sync,
   Wrapped, the dashboard or any game; leaving the device requires an explicit export.
   Recomposition only shows what was actually recorded (tape, scale, workouts) — it never
   claims fat or muscle change, because neither is measured. */

const PhotoStore = {
  db: null, ok: false,
  open() {
    return new Promise(res => {
      if (this.db) return res(true);

      let req; try { req = indexedDB.open('tempo_body_photos', 1); } catch (e) { return res(false); }
      req.onupgradeneeded = e => { const db = e.target.result; if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'id' }); if (!db.objectStoreNames.contains('full')) db.createObjectStore('full', { keyPath: 'id' }); };

  },
  run(stores, mode, fn) {
    return new Promise((res, rej) => {
      if (!this.db) return rej(new Error('Photo storage unavailable'));

      try { out = fn(t); } catch (e) { return rej(e); }
      t.oncomplete = () => res(out && 'result' in out ? out.result : out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('aborted'));
    });

  full(id) { return this.run('full', 'readonly', t => t.objectStore('full').get(id)).then(r => r ? r.blob : null); },
  put(meta, blob) { return this.run(['meta', 'full'], 'readwrite', t => { t.objectStore('meta').put(meta); if (blob) t.objectStore('full').put({ id: meta.id, blob }); }); },
  setMeta(meta) { return this.run('meta', 'readwrite', t => { t.objectStore('meta').put(meta); }); },
  remove(id) { return this.run(['meta', 'full'], 'readwrite', t => { t.objectStore('meta').delete(id); t.objectStore('full').delete(id); }); },
  clear() { return this.run(['meta', 'full'], 'readwrite', t => { t.objectStore('meta').clear(); t.objectStore('full').clear(); }); }

/* ================= Forecast Lab: dynamic energy-balance model =================

   fat-free mass 1,020 kcal/kg; EE = RMR + PA + DIT + SPA; Forbes FFM–FM relation; spontaneous activity
   adapts with weight change). Where that document is inconsistent or silent, the choices below were
   checked against the published model it describes (Thomas et al., Math Biosci Eng 2009):
     • DIT = 0.075 × intake            (the document's "0.75" is a typo; its own text and the paper say 7.5 %)
     • RMR = (1 − a)(c·W^p − y·A)      Livingston–Kohlstadt; women c=248 p=0.4356 y=5.09, men c=293 p=0.4330 y=5.92.
                                      `a` is optional metabolic adaptation applied to RMR only (default 0).
     • SPA = max(0, SPA0 + s/(1−s)·Δ(DIT+PA+RMR)), s = 2/3 for loss, 0.56 for gain
     • Forbes: FFM = 10.4·ln(FM/C). Only its derivative is needed, dFFM = 10.4·dFM/FM, so C never enters.
   NOT given in either source and therefore ASSUMPTIONS (editable, shown in the app): baseline activity
   level (PAL), the share of baseline expenditure that is spontaneous activity (paper benchmark 10 %),
   and starting body composition. This is a mathematical simulation, not a personal forecast. */
const FC_LK = { female: { c: 248, p: 0.4356, y: 5.09 }, male: { c: 293, p: 0.4330, y: 5.92 } };

function fcBodyFatEstimate(W, heightCm, age, sex) { const bmi = W / Math.pow(heightCm / 100, 2); return (1.2 * bmi + 0.23 * age - 10.8 * (sex === 'male' ? 1 : 0) - 5.4) / 100; }

  const past = [], vals = [];

function fcBind(body) {

  body.querySelectorAll('[data-fc]').forEach(el => el.addEventListener('change', () => {
    const k = el.dataset.fc, raw = el.value.trim();
    if (k === 'start') s.start = raw; else if (k === 'bf') s.bf = raw === '' ? '' : (isFinite(parseNumStrict(raw)) && parseNumStrict(raw) != null ? parseNumStrict(raw) / 100 : raw);
    else if (numKeys[k]) { const n = parseNumStrict(raw); s[k] = raw === '' ? '' : (n == null || Number.isNaN(n) ? raw : n); }
    fcSave(); Pages.render();
  }));
  body.querySelectorAll('[data-fcc]').forEach(el => el.addEventListener('click', () => {
    const a = el.dataset.fcc, v = el.dataset.v;
    if (a === 'sex' || a === 'mode' || a === 'basis') s[a] = v; else if (a === 'days') s.days = +v;
    else if (a === 'usestart') { const st = fcStartInfo(); s.start = st.date; s.W0 = st.kg; s.age = fcBirthAge(st.date); }
    else if (a === 'usetoday') { const cw = currentWeight(); s.start = dateKey(new Date()); if (cw) s.W0 = cw.kg; s.age = fcBirthAge(s.start); }
    else if (a === 'view') fcView = v === 'table' ? 'table' : 'graph';
    else if (a === 'forward') { const cw = currentWeight(); s.start = dateKey(new Date()); if (cw) s.W0 = cw.kg; s.age = fcBirthAge(s.start); if (+s.days < 30) s.days = 90; }
    else if (a === 'info') fcOpenInfo = !fcOpenInfo;
    else if (a === 'savesc') { if (fcValidate(s).err.length) return toast('Fix the inputs first'); return openTextSheet('Name this scenario', fcDescribe(s), name => { fcScenarios().push({ id: uid(), name, p: Object.assign({}, s, s.mode === 'logged' ? { eiSeries: fcLoggedSeries(s).series } : {}), savedAt: nowISO() }); Store.save(); toast('Scenario saved'); Pages.render(); }); }
    else if (a === 'loadsc') { const x = fcScenarios().find(q => q.id === v); if (x) Object.assign(s, x.p); }
    else if (a === 'delsc') { Store.state.meta.forecastScenarios = fcScenarios().filter(q => q.id !== v); fcChecked = fcChecked.filter(i => i !== v); Store.save(); }

/* ================= Tempo Play: engine (Arcade rounds, Mirror Room, Data Art) =================
   Optional and self-contained. It only READS existing records; it never writes to them and it never
   touches progress photos. Everything it saves lives in meta.play and meta.playGallery.
   Rules: no invented history; missing data is never a zero or a failure; sensitive categories
   (weight, symptoms, medication) stay out of games unless switched on. */
function playMeta() {
  const m = Store.state.meta;
  if (!m.play || typeof m.play !== 'object' || Array.isArray(m.play)) m.play = {};
  const p = m.play;
  if (!p.sens || typeof p.sens !== 'object' || Array.isArray(p.sens)) p.sens = {};
  ['weight', 'symptoms', 'medication'].forEach(k => { p.sens[k] = !!p.sens[k]; });
  if (!Array.isArray(p.seasons)) p.seasons = [];
  if (!Array.isArray(p.recent)) p.recent = [];
  if (!Array.isArray(p.dailyDone)) p.dailyDone = [];
  if (!(p.rounds >= 0)) p.rounds = 0;
  return p;
}
function playGallery() { const m = Store.state.meta; if (!Array.isArray(m.playGallery)) m.playGallery = []; return m.playGallery; }
function playHash(s) { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function playPick(rng, arr) { return arr.length ? arr[Math.floor(rng() * arr.length)] : null; }
function playShuffle(rng, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function playDateLong(k) { return DTF.mdy.format(new Date(k + 'T12:00:00')); }
function playDateShort(k) { return DTF.md.format(new Date(k + 'T12:00:00')); }
function playWeekKey(k) { const wi = weekIndex(new Date(k + 'T12:00:00')); return dateKey(new Date(WEEK_ANCHOR + wi * 7 * DAY + 12 * 3600000)); }
function playWeekLabel(wk) { return playDateShort(wk) + ' – ' + playDateShort(labAddDays(wk, 6)); }
function playJoin(a) { return a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }

/* ---- which categories may appear ---- */
function playAllowed(overrideAll) {
  const s = playMeta().sens;

}

const PL_CHAPTERS = [
  { id: 'c1', day: 1, name: 'Choose Your Lens', blurb: 'Pick the part of your records you want to look through.', el: 'facets', elName: 'Facets' },

  { id: 'c3', day: 15, name: 'The Mirror Room', blurb: 'Hold two periods side by side and see what the records support.', el: 'mirror', elName: 'Mirror plane' },

function playSaveBlob(filename, blob) {
  const go = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); };
  if (navigator.share && navigator.canShare) { try { const f = new File([blob], filename, { type: blob.type }); if (navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: filename }).catch(e => { if (!e || e.name !== 'AbortError') go(); }); return; } } catch (e) { /* fall through */ } }
  go();
}
function playExport(prm, snap, kind) {
  const name = plPlain(prm.name || prm.system).replace(/[^\w\- ]+/g, '').replace(/\s+/g, '-').toLowerCase() || 'tempo-art', file = 'tempo-' + name + '-' + stamp();
  if (kind === 'svg') { playSaveBlob(file + '.svg', new Blob([artRender(prm, snap, { uid: 'e' })], { type: 'image/svg+xml' })); return; }
  const svg = artRender(prm, snap, { uid: 'e', w: 2400 }), img = new Image();
  img.onload = () => { const c = document.createElement('canvas'); c.width = 2400; c.height = 3000; c.getContext('2d').drawImage(img, 0, 0, 2400, 3000); c.toBlob(b => { if (b) playSaveBlob(file + '.png', b); else toast('Could not make the image'); }, 'image/png'); };
  img.onerror = () => toast('Could not make the image');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
